const MAINQ=QUESTS.filter(q=>!q.side&&!q.line),SIDEQ=QUESTS.filter(q=>q.side),LIFEQ=QUESTS.filter(q=>q.line==='life');

/* ---------- 反應式自動檢查（質量守恆） ---------- */
function parseFormula(f){let i=0;
 function grp(){const m={};while(i<f.length&&f[i]!==')'){let sub;
   if(f[i]==='('){i++;sub=grp();i++;}
   else{const e=/^[A-Z][a-z]?/.exec(f.slice(i));if(!e)throw new Error('bad formula '+f);i+=e[0].length;sub={[e[0]]:1};}
   const d=/^\d+/.exec(f.slice(i));const k=d?+d[0]:1;if(d)i+=d[0].length;
   for(const a in sub)m[a]=(m[a]||0)+sub[a]*k;}
  return m;}
 return grp();}
function sideAtoms(s){const t={};s.split(' + ').forEach(term=>{const m=/^(\d*)(.+)$/.exec(term.trim());const k=m[1]?+m[1]:1;const a=parseFormula(m[2]);for(const e in a)t[e]=(t[e]||0)+a[e]*k;});return t;}
function isBalanced(eq){const [l,r]=eq.split(' -> ').map(sideAtoms);const ks=new Set([...Object.keys(l),...Object.keys(r)]);for(const k of ks)if(l[k]!==r[k])return false;return true;}

 const cur=MAINQ.find(q=>q.ch===ch&&!qd[q.id])||MAINQ.find((q,i)=>i>hi&&!qd[q.id])||MAINQ[MAINQ.length-1],ci=MAINQ.indexOf(cur),inCh=MAINQ.filter(q=>q.ch===cur.ch);
 return{cur,done:inCh.filter(q=>qd[q.id]).length,total:inCh.length,behind:MAINQ.filter((q,i)=>i<ci&&q.ch!==cur.ch&&!qd[q.id]),life:LIFEQ.find(q=>!qd[q.id])||null};}

 st.w312=j.w312?1:0;if(st.found&&st.found.steel&&!st.found.steel_o2&&!st.v118){st.found.steel_o2=true;}if(st.abil&&st.abil.iron_tools)st.found.forge=true;st.v118=1;   /* 舊存檔：以前的鋼是吹氧煉的；已經有鐵製工具的人當作會鍛打了 */

 return r.inputs.slice(0,2).map(a=>a.map(i=>ITEMS[i].n).join('＋')).join('　或　')+(r.inputs.length>2?'　…':'')+'　→　'+(Object.keys(r.out).map(o=>ITEMS[o].n).join('＋')||r.name)+'｜'+c.filter(Boolean).join('、');}
function questNotes(s,q){if(!q.rx)return{recipe:null,tried:[]};const rs=q.rx.map(id=>RMAP[id]),items=new Set(),ats=new Set();rs.forEach(r=>{ats.add(r.at);r.inputs.forEach(a=>a.forEach(i=>items.add(i)));});
 const got=rs.filter(r=>s.found[r.id]);
 const tried=REACTIONS.filter(o=>o.kind==='obs'&&s.found[o.id]&&(o.failOf?q.rx.includes(o.failOf):(o.inputs.length&&ats.has(o.at)&&o.inputs.every(a=>a.every(i=>items.has(i))))));

/* 保底：主線必需的礦物快不夠時，隔一陣子讓一處挖空的地方重新露出礦脈（量減半）。平常資源夠，就完全不會發生 */
const RESERVE={galena:2,clay:12,caco3:6,sand:6,quartz:4,malachite:4,cassiterite:4,hematite:6,magnetite:2,vitriol:4,natron:4,smithsonite:4,coal:6},RESPAWN=240;
function safetyNet(s,nodes,dt,isl){const back=[];s.rs=s.rs||{};s.thin=s.thin||{};
 for(const item in RESERVE){let have=s.inv[item]||0;for(const st of s.st)if(st.store)have+=st.store[item]||0;const goneL=[];
  nodes.forEach((n,i)=>{const d=NODES[n.type];if(d.item!==item||d.regrow)return;if(s.gone[i])goneL.push(i);else have+=Math.ceil(nodeYield(s,n.type,d.n||1)*(s.thin[i]?.5:1));});
  if(have>=RESERVE[item]||!goneL.length){delete s.rs[item];continue;}
  s.rs[item]=(s.rs[item]==null?RESPAWN:s.rs[item])-dt;
  if(s.rs[item]<=0){delete s.rs[item];let pick=goneL.find(i=>nodes[i].isl===isl);if(pick==null)pick=goneL[0];delete s.gone[pick];s.thin[pick]=1;back.push(pick);}}
 return back;}

/* 伏打堆：一層（鋅＋銅＋鹽水布）約 1 伏特；每電解一次吃掉一點鋅。有發電機就不必再靠它 */
const PMAX=8,PLIFE=5,GENV=12;
const pileOf=s=>{if(s.abil.elec&&!s.pile)s.pile={n:2,life:2*PLIFE};return s.pile;};
const pcap=p=>PLIFE*(p.dan?4:1);   /* 丹尼爾電池：鋅片耐用四倍，而且電壓穩定 */
const freePower=s=>!!(s.hydro||s.legacyGen);   /* 接上水力發電機（或舊存檔的手搖發電機）：不靠電池 */
const steady=s=>freePower(s)||!!(s.pile&&s.pile.dan&&s.pile.life>0);
const wireCostOf=d=>Math.max(1,Math.ceil(d/6.5));
function voltOf(s){if(freePower(s))return GENV;const p=pileOf(s);return p&&p.life>0?p.n:0;}
function pileDan(s){const p=pileOf(s);if(!p)return{err:'還沒有伏打堆。'};if(p.dan)return{err:'已經是丹尼爾電池了。'};const need={cuso4:1,znso4:1,ceramic:1},miss=Object.keys(need).filter(k=>(s.inv[k]||0)<need[k]);

<script>
/* ================= 畫面與操作（three.js） ================= */
const SAVE='island_chemist2_v1',SEED=20261113;
const $=id=>document.getElementById(id);
const fh=s=>s.replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>').replace(/->/g,'→');
let S=newState();
try{const j=JSON.parse(localStorage.getItem(SAVE)||'null');if(j&&j.v===3)S=loadState(j);}catch(e){}
const save=()=>{if(typeof flySt!=='undefined'&&flySt)return;try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}};   /* 飛行中不存檔 */
const world=genWorld(SEED),{W,H,tiles,owner,hc,nodes}=world;
const P={x:S.px||world.start.x,y:S.py||world.start.y,ang:0,swing:0};
const tileAt=(x,y)=>(x<0||y<0||x>=W||y>=H)?SEA:tiles[y*W+x];
const rankAt=(x,y)=>(x<0||y<0||x>=W||y>=H)?9:ISLANDS[owner[y*W+x]].rank;
const walk=(x,y)=>{const tx=Math.floor(x),ty=Math.floor(y),t=tileAt(tx,ty);if(t===LAKE||t===ACID||t===CLIFF)return false;if(t===CRATER&&!S.abil.mask)return false;if(t===SEA){const b=curBoat();return !!b&&boatOK(b.r,rankAt(tx,ty));}return true;};
function curBoat(){return S.aboard&&S.boats?S.boats[S.cur]||null:null;}
const free=(x,y)=>walk(x-.28,y-.28)&&walk(x+.28,y-.28)&&walk(x-.28,y+.28)&&walk(x+.28,y+.28);
function hAt(x,y){const x0=Math.max(0,Math.min(W-1,Math.floor(x))),y0=Math.max(0,Math.min(H-1,Math.floor(y))),fx=Math.min(1,Math.max(0,x-x0)),fy=Math.min(1,Math.max(0,y-y0)),i=y0*(W+1)+x0;
 return hc[i]*(1-fx)*(1-fy)+hc[i+1]*fx*(1-fy)+hc[i+W+1]*(1-fx)*fy+hc[i+W+2]*fx*fy;}
const now=()=>performance.now()/1000;

/* ================= 聲音：全部用 Web Audio 即時合成，不需要任何音檔 ================= */
const AU={ctx:null,sfx:true,bgm:true,mood:0};
try{const p=JSON.parse(localStorage.getItem('island_audio')||'{}');if(p.sfx===false)AU.sfx=false;if(p.bgm===false)AU.bgm=false;}catch(e){}
function audioInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended'){try{AU.ctx.resume().catch(()=>{});}catch(e){}}return;}
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=AU.ctx=new C();
  AU.sg=c.createGain();AU.sg.gain.value=AU.sfx?.55:0;AU.sg.connect(c.destination);
  AU.mg=c.createGain();AU.mg.gain.value=AU.bgm?.5:0;AU.mg.connect(c.destination);
  AU.mIn=c.createGain();AU.mIn.connect(AU.mg);const dl=c.createDelay(1),fb=c.createGain(),wet=c.createGain();dl.delayTime.value=.39;fb.gain.value=.3;wet.gain.value=.4;AU.mIn.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AU.mg);
  const buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;AU.nbuf=buf;
  const loop=(freq,type)=>{const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=buf;src.loop=true;f.type=type;f.frequency.value=freq;g.gain.value=0;src.connect(f);f.connect(g);g.connect(AU.sg);src.start();return{g,f};};
  const sea=loop(520,'lowpass');AU.seaG=sea.g;const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.13;lg.gain.value=260;lfo.connect(lg);lg.connect(sea.f.frequency);lfo.start();   /* 海浪 */
  AU.roarG=loop(380,'lowpass').g;                                                                                                                                 /* 火的低鳴 */
  if(c.state==='suspended'){try{c.resume().catch(()=>{});}catch(e){}}
 }catch(e){AU.ctx=null;}
}
['pointerdown','pointerup','click','keydown'].forEach(ev=>addEventListener(ev,audioInit,true));
function audioToggle(k){audioInit();AU[k]=!AU[k];try{localStorage.setItem('island_audio',JSON.stringify({sfx:AU.sfx,bgm:AU.bgm}));}catch(e){}
 if(AU.ctx){AU.sg.gain.value=AU.sfx?.55:0;AU.mg.gain.value=AU.bgm?.5:0;}audioBtns();if(AU.sfx)SFX.ui();}
function audioBtns(){document.querySelectorAll('[data-au]').forEach(b=>b.classList.toggle('off',!AU[b.dataset.au]));}
function tone(f,dur,type,vol,when,slide){const c=AU.ctx;if(!c||!AU.sfx||c.state!=='running')return;try{const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol||.3,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.sg);o.start(t);o.stop(t+dur+.03);}catch(e){}}
function noise(dur,vol,freq,q,type,when,slide){const c=AU.ctx;if(!c||!AU.sfx||c.state!=='running')return;try{const t=c.currentTime+(when||0),src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=AU.nbuf;src.loop=true;
 f.type=type||'bandpass';f.frequency.setValueAtTime(freq,t);if(slide)f.frequency.exponentialRampToValueAtTime(slide,t+dur);f.Q.value=q||1;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 src.connect(f);f.connect(g);g.connect(AU.sg);src.start(t,Math.random());src.stop(t+dur+.03);}catch(e){}}
const SFX={
 chop(){noise(.08,.5,900,1);tone(150,.12,'triangle',.5,0,75);},                         /* 砍樹 */
 fall(){noise(.4,.4,500,.6,'lowpass',.02,150);tone(95,.35,'sine',.45,.05,45);},         /* 樹倒下 */
 rock(){noise(.045,.5,2800,2.5);tone(560,.05,'square',.12,0,320);},                     /* 敲石頭 */
 crack(){noise(.28,.6,1500,.7,'bandpass',0,500);tone(210,.22,'triangle',.4,0,60);},     /* 石頭裂開 */
 pick(){tone(660,.07,'triangle',.25);tone(990,.1,'triangle',.25,.06);},                 /* 撿到東西 */
 water(){noise(.32,.4,600,1.2,'bandpass',0,1900);tone(300,.12,'sine',.15,.05,700);},    /* 裝水 */
 step(){noise(.035,.1,260+Math.random()*120,1.2,'lowpass');},                           /* 腳步 */
 ui(){tone(540,.045,'sine',.14);},
 page(){noise(.18,.14,2200,.8,'bandpass',0,900);},                                      /* 翻筆記 */
 deny(){tone(170,.16,'sawtooth',.14,0,115);},
 place(){tone(180,.1,'triangle',.35,0,120);noise(.1,.3,500,1,'lowpass');},              /* 放上材料 */
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.28,i*.09));},          /* 蓋好了 */
 discover(){[659,784,988,1319,1568].forEach((f,i)=>tone(f,.38,'sine',.26,i*.085));},    /* 新發現 */
 react(){tone(880,.12,'sine',.22);tone(1320,.22,'sine',.18,.08);},
 ignite(){noise(.55,.45,300,.7,'bandpass',0,2600);},
 boom(){noise(.9,1,700,.4,'lowpass',0,60);tone(80,.6,'sine',.9,0,28);},                     /* 爆炸 */                                    /* 點火 */

 if(LIQ.has(id)){/* 液體：燒杯 */c.lineJoin='round';c.fillStyle=col;c.beginPath();c.moveTo(15,19);c.lineTo(41,19);c.lineTo(41,44);c.quadraticCurveTo(41,49,36,49);c.lineTo(20,49);c.quadraticCurveTo(15,49,15,44);c.closePath();c.fill();

  c.strokeStyle='#6b7f8a';c.lineWidth=2.6;c.beginPath();c.moveTo(11,8);c.lineTo(15,11);c.lineTo(15,44);c.quadraticCurveTo(15,49,20,49);c.lineTo(36,49);c.quadraticCurveTo(41,49,41,44);c.lineTo(41,9);c.stroke();

 else if(GAS.has(id)){/* 氣體：集氣瓶裡的氣泡 */[[20,36,11],[36,30,9],[28,17,7]].forEach(b=>{c.beginPath();c.arc(b[0],b[1],b[2],0,7);c.fillStyle=col;c.globalAlpha=.75;c.fill();c.globalAlpha=1;c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1.6;c.stroke();c.beginPath();c.arc(b[0]-b[2]*.35,b[1]-b[2]*.35,b[2]*.22,0,7);c.fillStyle='#fff';c.fill();});}

const chip=(id,extra,cls,noc)=>{const it=ITEMS[id];return `<button class="item ${cls||''}" ${extra||''}>${ico(id)}<b>${it.n}</b>${it.f?`<small>${fh(it.f)}</small>`:''}${noc?'':`<span>×${S.inv[id]||0}</span>`}</button>`;};

 <div><span class="lbl">現象：</span>${r.phen}</div><div><span class="lbl">知識：</span>${r.use}</div>${r.note?`<div class="muted">🔍 真實世界：${r.note}</div>`:''}`;}

/* ===== 設施：蓋、搬材料、使用 ===== */
function place(type){if(BMAP[type].inLab)return toast(BMAP[type].n+'要裝在屋裡的實驗室：走進'+LABNEED[BMAP[type].inLab]+'以上的房子安裝。');const d=BMAP[type],x=P.x+Math.sin(P.ang)*1.7,y=P.y+Math.cos(P.ang)*1.7,t=tileAt(Math.floor(x),Math.floor(y));
 if(t===SEA||t===LAKE||t===ACID||t===RIVER)return toast('這裡是水。面向一塊空地再蓋。');
 if(d.river){let ok=false;for(let dy=-2;dy<=2&&!ok;dy++)for(let dx=-2;dx<=2;dx++)if(tileAt(Math.floor(x)+dx,Math.floor(y)+dy)===RIVER){ok=true;break;}if(!ok)return toast('水車要蓋在河邊——綠岩島和火山島各有一條從湖流向海的小河。走到河岸，面向岸邊的空地再蓋。');}
 if(d.isl!=null&&owner[Math.floor(y)*W+Math.floor(x)]!==d.isl)return toast(d.n+'只能立在'+ISLANDS[d.isl].name+'——那裡才有打不完的雷。');
 if(d.dock&&t!==SAND)return toast('船要在沙灘上造——走到沙灘、面向沙地再試一次。');
 if(d.dock&&!nearestSea(x,y,BOATT[type]))return toast(type==='ship'?'這附近的海太淺，遠洋帆船一下水就會擱淺。要到海比較深的島（火山島）的沙灘上造。':'這附近沒有這艘船能走的海。');
 if(allStations().some(s=>Math.hypot(s.x-x,s.y-y)<1.8)||nodes.some(n=>!n.gone&&n.cd<=now()&&Math.hypot(n.x+.5-x,n.y+.5-y)<.9))return toast('這裡太擠了。把旁邊的樹砍掉、或把石頭和沙堆清掉，就有空地了。');
 const st={type,x,y,isl:owner[Math.floor(y)*W+Math.floor(x)],have:{},done:false};S.st.push(st);syncStation(st);closeModal();useStation(st);}
function openWreck(){panel='wreck';SFX.ui();const got=lootWreck(S);if(got){SFX.done();closeHook=()=>after();}
 openModal(head('🚢 擱淺的破船')+`<div class="story" style="margin-bottom:10px">這就是載你來的那艘船。龍骨斷了，船艙進了半艙的沙。它哪裡也去不了了。</div>
 ${got?`<div class="result new"><b>你在船艙裡翻出一些還能用的東西：</b><br>🪓 <b>一把舊鐵斧</b>——從原來的世界帶來的。斧刃撞缺了一角，又鏽又鈍。砍樹、敲開一般的石頭還行；碰到真正堅硬的礦石，大概只會彈回來。<br>${Object.keys(got).map(k=>ITEMS[k].n+' ×'+got[k]).join('、')}（拆下來的船板和纜繩）</div>`:'<div class="muted">能拆的都拆了。剩下的只有這些看得到、帶不走的東西。</div>'}
 <h3>仔細看看這艘船</h3>${WRECK_CLUES.map(c=>`<div class="entry" style="padding:8px 12px"><b>${c[0]}</b>　${c[1]}</div>`).join('')}
 <div class="muted">這些東西本身幫不上忙。但它們是用什麼做的、後來變成了什麼樣子——也許值得記在心裡。</div>`);}
function useStation(st){if(st.type==='wreck')return openWreck();const d=BMAP[st.type];
 if(!st.done){const miss=d.req.filter(q=>!hasReq(S,q));if(miss.length)return warn('還不行。需要先'+miss.map(reqName).join('、'));
  const r=deliver(S,st);if(st!==TOWER)syncStation(st);const a=Object.keys(r.added).map(k=>ITEMS[k].n+'×'+r.added[k]).join('、');
  if(r.done){SFX.done();burst(st.x,hAt(st.x,st.y),st.y,'#ffe9a8');toast(d.icon+' '+d.n+' 完成了！');if(d.dock)launch(st);if(d.house){st.floors=1;syncStation(st);}}
  else{if(a)SFX.place();toast((a?'放上 '+a+'。':'')+'還缺 '+Object.keys(r.missing).map(k=>ITEMS[k].n+'×'+r.missing[k]).join('、'));}

 if(st.type==='radio')return toast('📡 答答答。答——答——答——。答答答。');
 if(st.type==='rod'){const r=rodUse(S,st);if(r.err)return warn(r.err);if(r.soft){SFX.deny();toast('熟鐵棒吸起了幾粒鐵屑，才一轉眼又全掉了下來。太軟的鐵留不住磁。'+(r.isNew?'　📖 圖鑑新增：被雷打過的熟鐵':''));syncStation(st);return after();}
  if(r.hung){SFX.place();toast('把'+ITEMS[r.k].n+'棒放進銅線繞成的圈裡了。現在——離遠一點，等雷打下來。');boltT=6+Math.random()*8;}else if(r.wait)toast('鐵棒掛著。雷還沒打下來，再等等。');else{SFX.discover();toast('🧲 拿到一根磁鐵！'+(r.k==='pigiron'?'（生鐵做的，磁力比鋼弱一些，但留得住）':'')+(r.isNew?'　📖 圖鑑新增：雷擊磁化':''));}syncStation(st);return after();}
 if(st.type==='balloon'||st.type==='airship')return openBalloon(st);
 if(d.house)return openHome(st);
 if(st.type==='field')return openFarm(st);
 bench.on=false;S.hydro=false;if(STN[st.type]){openFire(st.type);fireSt=st;if(STN[st.type].bellows&&wheelNear(S,st)){fire.auto=true;flog.push('🎡 河邊的水車替你拉著風箱，不用自己踩了。');}else if(STN[st.type].bellows&&st.fan){fire.auto=true;flog.push('⚡ 電動鼓風機嗡嗡地轉，不用自己踩風箱了。');}fireCtl();return;}openMix(st.type==='cell'?'cell':'table');}

/* ===== 火：營火、陶窯、鼓風爐、蒸餾器共用 ===== */
let fire=null,fz='fuel',flog=[],fent=null,fsum=false,ffast=false,fpart=[],fseen=false;
function openFire(type,indoor){fire=newFire(type,indoor);fz='fuel';flog=['把燃料和材料放進去，然後點火。'];fent=null;fsum=false;ffast=false;fpart=[];fseen=false;panel='fire';
 openModal(head(bench.on?'🧪 實驗桌（室內）':type==='stove'?'🔥 爐灶（室內）':BMAP[type].icon+' '+BMAP[type].n+(indoor?'（室內）':''))+`<canvas class="scene" id="sc" width="560" height="330"></canvas><div id="ctl"></div>`);fireCtl();}
function fireCtl(){if(!$('ctl'))return;const d=STN[fire.type],fuelZone=fz==='fuel',list=have().filter(id=>fuelZone?!!FUEL[id]:true);
 const known=fire.lit&&eligible(fire).length&&eligible(fire).every(r=>S.found[r.id]);
 $('ctl').innerHTML=`${benchBar()}<div class="log">${flog.slice(-4).join('<br>')}</div><div class="row"><b>放到：</b><button class="cond ${fuelZone?'sel':''}" data-zone="fuel">🔥 ${d.fuel}</button><button class="cond ${fuelZone?'':'sel'}" data-zone="charge">📥 ${d.charge}</button></div>
 ${(()=>{const one=id=>`<span class="pair">`+chip(id,`data-add="${id}"`)+((S.inv[id]>=5)?`<button class="plus" data-add="${id}" data-n="5">＋5</button>`:'')+`</span>`;if(!list.length)return `<span class="muted">${fuelZone?'背包裡沒有燃料。':'背包是空的。'}</span>`;return fuelZone?`<div class="grid">${list.map(one).join('')}</div>`:chemGroups(list,one);})()}
 ${fireTakeRow()}
 <div class="row"><button class="btn fire" data-act="ignite" ${fire.lit?'disabled':''}>🔥 點火</button>${d.bellows?'<button class="btn air" data-act="pump">🌬 鼓風（空白鍵）</button>':''}${d.bellows&&S.abil.motor&&fireSt&&!fire.auto?(h=>`<button class="btn alt" data-act="fan" ${h?'':'disabled'}>💨 裝電動鼓風機${h?'（拉線要銅 '+h.cost+'）':'<small>　這座島沒有水力發電機</small>'}</button>`)(hydroFor(fireSt)):''}
 ${known?`<button class="btn alt" data-act="fast">${ffast?'⏸ 恢復正常速度':'⏩ 已經學會了，快轉'}</button>`:''}<button class="btn" data-act="close">熄火，全部取出</button></div>${fent?`<div class="result ${fent.isNew?'new':''}">${fent.isNew?'<b>✨ 新發現！已記入知識圖鑑</b><br>':''}${entryHTML(fent.r)}</div>`:''}`;}
/* 放錯了可以拿回來：燃料、爐料、接住的氣體，一份一份或整項取出，不必熄火 */
function fireTakeRow(){const f=fire,rows=[],put=(w,id,n)=>{n=Math.floor(n+1e-6);if(n<=0||!ITEMS[id])return;
  rows.push(`<span class="pair"><button class="item" data-out="${w}:${id}">${ico(id)}<b>${ITEMS[id].n}</b><small>${w==='fuel'?'燃料':w==='out'?'接住的氣體':'材料'}</small><span>×${n}</span></button>${n>1?`<button class="plus" data-out="${w}:${id}" data-n="99">全部</button>`:''}</span>`);};
 for(const k of FUELS)put('fuel',k,f.fuel[k]);for(const k in f.charge)put('charge',k,f.charge[k]);for(const k in f.out)put('out',k,f.out[k]);
 if(!rows.length)return '';
 return `<h3 style="margin:10px 0 4px">放錯了？點一下取回 1 份，按「全部」整項取回</h3><div class="grid">${rows.join('')}</div>${f.lit?'<div class="muted">火還在燒：燒到一半的燃料取不出來。</div>':''}`;}
function fireTake(w,id,n){const f=fire,src=w==='fuel'?f.fuel:w==='out'?f.out:f.charge,has=Math.floor((src[id]||0)+1e-6);n=Math.min(n,has);if(n<=0)return;
 src[id]=Math.max(0,src[id]-n);S.inv[id]=(S.inv[id]||0)+n;
 const ok=new Set(eligible(f).map(r=>r.id));for(const k in f.prog)if(!ok.has(k))f.prog[k]=0;   /* 材料拿走了，進行到一半的反應就停下來 */
 fsum=false;fseen=false;SFX.place();flog.push('取回：'+ITEMS[id].n+' ×'+n);fireCtl();}
function fireAdd(id,n){const d=STN[fire.type];n=Math.min(n,S.inv[id]||0);if(n<=0)return;
 if(fz==='fuel'){if(!FUEL[id])return;fire.fuel[id]+=n;}
 else{if(LIQ.has(id)&&!S.abil.pottery)return toast('沒有容器可以裝液體——你需要先燒出陶器。');
  if(GAS.has(id)&&!S.abil.pottery)return;
  if(id==='wood'&&!d.closed)return toast('木頭放在火上，就只是多一根柴。想試別的結果，需要能隔絕空氣的地方。');
  fire.charge[id]=(fire.charge[id]||0)+n;fsum=false;fseen=false;}
 S.inv[id]-=n;fireCtl();}
function pump(){if(fire&&STN[fire.type].bellows){fire.bell=Math.min(1,fire.bell+.28);SFX.pump();}}
function showSummary(){if(fsum)return;fsum=true;const r=fireSummary(fire,S);
 r.obs.forEach(o=>{flog.push('🔎 '+o.r.name+'：'+o.r.phen+o.r.use);fent=o;});r.hints.forEach(h=>flog.push('🤔 '+h));
 const L=Object.keys(r.lost);if(L.length){SFX.deny();flog.push('💨 浪費掉了：'+L.map(k=>ITEMS[k].n+'×'+r.lost[k]).join('、')+(r.why.length?'（'+r.why.join('；')+'）':'')+'。');}hud();save();fireCtl();}
function fireStep(dt,t){const d=STN[fire.type],k=ffast?6:1;if(ffast&&d.bellows)fire.bell=1;
 const sub=Math.max(1,Math.ceil(dt/.05)),steps=sub*(ffast?6:1);for(let i=0;i<steps;i++){if(fire.auto&&fire.lit)fire.bell=1;const ev=fireTick(fire,dt/sub,S);
  for(const e of ev){if(e.t==='out'){flog.push('火熄了。最高溫度 '+Math.round(fire.peak/10)*10+' °C。');showSummary();ffast=false;fseen=true;SFX.out();}
   else{flog.push('✅ '+Math.round(fire.T/10)*10+' °C：'+e.r.name+(e.isNew?'　✨ 新發現':''));if(e.isNew||!fent||!fent.isNew)fent=e;if(e.isNew){SFX.discover();toast('✨ 新發現：'+e.r.name);}else SFX.react();
    for(let j=0;j<8;j++)fpart.push({x:200+Math.random()*60,y:150,vy:-30-Math.random()*40,life:1.2,c:'#ddd'});storyQ.push(...advanceQuests(S));hud();save();}
   fireCtl();}}
 if(fire)drawFire(t,dt);}
function endFire(){if(fire.T>80||Object.keys(fire.charge).some(k=>fire.charge[k]>0))showSummary();
 const lines=flog.filter(l=>l.startsWith('🔎')||l.startsWith('🤔')||l.startsWith('💨'));const got=fireCollect(fire,S);const g=Object.keys(got).map(k=>ITEMS[k].n+'×'+got[k]).join('、');if(g)toast('取回：'+g);
 if(lines.length&&!fseen)storyQ.unshift('<b>這次燒製的觀察</b>\n\n'+[...new Set(lines)].join('\n\n'));
 fire=null;storyQ.push(...advanceQuests(S));hud();save();}
/* 火色 */
/* 每種東西畫成它該有的樣子：木頭是一段原木、礦物有各自的晶形 */
function drawItem(c,id,x,y,r){c.save();c.translate(x,y);c.scale(r/11,r/11);c.lineJoin='round';c.lineWidth=1;const dk='rgba(0,0,0,.45)';
 const poly=(pts,fill,stroke)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.stroke();}};
 const blob=(px,py,pr,fill,stroke)=>{c.beginPath();c.arc(px,py,pr,0,7);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.stroke();}};
 const line=(pts,col,w)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.strokeStyle=col;c.lineWidth=w||1;c.stroke();c.lineWidth=1;};
 const pile=(fill,dot)=>{c.beginPath();c.moveTo(-12,9);c.quadraticCurveTo(0,-13,12,9);c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=dk;c.stroke();c.fillStyle=dot;for(let i=0;i<8;i++)c.fillRect(-7+((i*5)%13),6-((i*7)%10)*(1-Math.abs(-7+((i*5)%13))/12),1.6,1.6);};
 const ingot=(fill,hi)=>{poly([[-12,8],[-8,-5],[8,-5],[12,8]],fill,dk);poly([[-7,-3],[7,-3],[8.5,1],[-8.5,1]],hi);};
 switch(id){
  case 'wood':c.rotate(-.22);c.fillStyle='#8a5a2c';c.fillRect(-13,-5,25,10);c.strokeStyle='#4f3216';c.strokeRect(-13,-5,25,10);line([[-9,-2],[5,-2]],'#6b4423');line([[-6,2],[8,2]],'#6b4423');
   c.beginPath();c.ellipse(12,0,3.2,5,0,0,7);c.fillStyle='#dcb67e';c.fill();c.strokeStyle='#4f3216';c.stroke();c.beginPath();c.ellipse(12,0,1.4,2.4,0,0,7);c.stroke();break;
  case 'fiber':for(let i=0;i<3;i++){c.beginPath();c.moveTo(-11,-6+i*6);c.bezierCurveTo(-4,-15+i*6,3,7+i*6,11,-5+i*5);c.strokeStyle=i%2?'#3f8a45':'#58b05a';c.lineWidth=2.4;c.stroke();}c.lineWidth=1;
   [[-7,1],[5,-6],[8,6]].forEach(p=>{c.beginPath();c.ellipse(p[0],p[1],3.4,1.8,.6,0,7);c.fillStyle='#7fcf6f';c.fill();});break;

function lbHash(t){let h=2166136261;t=String(t);for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function lbAlias(key){const h=lbHash(key);return LB_ADJ[h%LB_ADJ.length]+LB_ANI[(h>>>8)%LB_ANI.length];}

 openModal(`<div class="story">暴風雨過後，你在一片沙灘上睜開了眼睛。\n\n這裡不是你原來的世界。頭很痛，嘴裡都是鹹味。\n\n你努力回想——你的名字是：</div><p style="margin:14px 0"><input id="pname" maxlength="10" placeholder="你的名字（最多 10 個字）" value="${(S.name||'').replace(/"/g,'')}" style="font-size:18px;padding:8px 12px;width:80%;border-radius:8px;border:2px solid #8a6a45;background:#fff;color:#2b2a26"></p><p style="text-align:right;margin:0">${(()=>{try{const j=JSON.parse(localStorage.getItem('island_chemist_v3')||'null');return j&&j.v===3&&(j.quest>0||Object.keys(j.inv||{}).length)?`<button class="btn alt" data-act="from-v1" style="margin-right:8px">⏩ 接著玩第一版的進度${j.name?'（'+String(j.name).replace(/[<>&"]/g,'')+'）':''}</button>`:'';}catch(e){return '';}})()}<button class="btn" data-act="setname">想起來了</button></p><p class="muted" style="margin:12px 0 0;font-size:12px">荒島化學家 2　v${VERSION}　© 2026 小p老師　CC BY-NC-SA 4.0</p>`);
 setTimeout(()=>{const i=$('pname');if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')$('modal').querySelector('[data-act=setname]').click();});}},30);}
function intro(){storyQ.unshift('<b>'+S.name+'</b>。對，你叫'+S.name+'。\n\n你穿越到了一座荒島上。載你來的那艘船擱淺在不遠處的沙灘，船身裂開，再也開不了了。四周只有海，和遠方幾座看不清楚的島。\n\n原來那個世界的東西，一樣也沒跟過來。但你腦子裡的科學知識還在：火是怎麼燒起來的、石頭裡藏著什麼、一種物質怎樣變成另一種物質。\n\n只是——知道，和親手做出來，是兩回事。','沙灘上有一本被海水泡皺的筆記本，不是你的。封面寫著：\n「一個化學家的漂流筆記・第一章」\n\n看來在你之前，也有人到過這裡。\n\n第一頁只有一句話：\n「這片海上什麼都有。缺的只是知道怎麼把它們變成你需要的東西。」\n\n<span class="muted">先去看看那艘破船吧，也許還有能用的東西。</span>');showStory();}
hud();audioBtns();requestAnimationFrame(loop);
const go=()=>{if(S.quest===0&&!Object.keys(S.inv).length&&!S.st.length)intro();else after();};
if(lbOn())$('lbbtn').style.display='';
if(!S.name)namePrompt(go);else if(lbOn()&&S.share==null&&S.abil.raft)askShare(go);else go();
</script>
