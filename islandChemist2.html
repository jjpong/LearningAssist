<style>
*{box-sizing:border-box}
:root{color-scheme:light}
button,input{color:#2b2a26}
html,body{margin:0;height:100%;overflow:hidden;background:#7ec0e4;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#2b2a26;-webkit-font-smoothing:antialiased}
#cv{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}
sub{font-size:.72em}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:rgba(214,199,162,.28);border-radius:99px}
::-webkit-scrollbar-thumb{background:#b59b6d;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#8a6a3a}
#quest{position:fixed;left:12px;top:12px;width:min(360px,calc(100vw - 24px));background:linear-gradient(165deg,rgba(255,252,242,.95),rgba(247,238,215,.93));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid #6e4f2a;border-radius:14px;padding:11px 14px;box-shadow:0 6px 20px rgba(20,15,8,.28),inset 0 1px 0 rgba(255,255,255,.8)}
#quest .ch{font-size:12px;color:#8a561e;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
#quest .goal{font-size:16px;font-weight:700;margin:4px 0 5px;color:#241c10;line-height:1.35}
#quest .hint{font-size:13px;line-height:1.58;color:#4f4937;display:none;border-top:1px dashed #c4ae82;margin-top:7px;padding-top:7px}
#quest.open .hint{display:block}
#qmore{font-size:12px;line-height:1.5;color:#6b5836;margin:2px 0 5px}
#qlist{display:none;font-size:12.5px;line-height:1.58;max-height:38vh;overflow:auto;margin-top:7px;border-top:1px dashed #c4ae82;padding-top:5px}
#quest.open #qlist{display:block}
#qlist .ql-h{font-weight:700;color:#8a561e;margin-top:6px}
#qlist .ql{padding-left:1.4em;text-indent:-1.4em;color:#3d3a30}
#qlist .ql.dn{color:#8f8a78}
#qlist .ql.cur{font-weight:700;color:#1f573a}
#qlist .ql small{display:block;text-indent:0;color:#7a7462}
#qlist .ql small.rcp{color:#2f6838;font-weight:600}
#quest .tried{margin-top:4px;color:#8a561e}
#quest button{font:inherit;font-size:12.5px;font-weight:700;border:1px solid rgba(138,90,34,.35);border-radius:99px;background:rgba(255,244,218,.75);color:#7a4b18;cursor:pointer;padding:3px 10px;transition:all .15s}
#quest button:hover{background:#f7e4b5;border-color:#8a5a22}
#score{margin-top:8px;font-size:12.5px;font-weight:700;color:#4a3618;padding-top:6px;border-top:1px solid rgba(196,174,130,.45)}#score b{color:#c2571a;font-size:13.5px}
#abil{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
#abil span{font-size:11.5px;padding:2px 8px;border-radius:99px;background:rgba(222,210,182,.75);color:#8f856e;border:1px solid rgba(175,158,122,.35);transition:all .2s}
#abil span.on{background:linear-gradient(135deg,#2f7854,#23593e);color:#fff;font-weight:700;border-color:#1c4731;box-shadow:0 1px 3px rgba(35,89,62,.3)}
#mini.big{width:min(86vw,760px);z-index:30}
#mini{cursor:zoom-in;position:fixed;right:12px;top:12px;width:268px;border:3px solid #6e4f2a;border-radius:10px;image-rendering:auto;box-shadow:0 6px 20px rgba(20,15,8,.35),inset 0 0 0 1px rgba(255,255,255,.35);background:#2b6ca3}
#zoom{position:fixed;right:12px;top:212px;display:flex;gap:6px}
#zoom button,#bar button{font:inherit;font-weight:700;border-radius:11px;border:2px solid #6e4f2a;background:linear-gradient(180deg,#fffaf0,#f3e3be);color:#432f13;cursor:pointer;box-shadow:0 3px 0 #5c4120,0 5px 12px rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s,background .15s}
#zoom button:hover,#bar button:hover{background:linear-gradient(180deg,#ffffff,#f9eccb)}
#zoom button{width:38px;height:38px;font-size:18px;padding:0}#zoom button.off{opacity:.45;text-decoration:line-through;filter:grayscale(.6)}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;padding:5px 8px;border-radius:16px;background:rgba(42,32,20,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bar button{font-size:15px;padding:9px 15px;white-space:nowrap}
#bar button:active,#zoom button:active{transform:translateY(2px);box-shadow:0 1px 0 #5c4120,0 2px 5px rgba(0,0,0,.2)}
#prompt{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);font-size:14px;font-weight:700;color:#fff8ea;background:rgba(24,22,18,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border:1px solid rgba(255,235,190,.28);padding:6px 16px;border-radius:99px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.28);letter-spacing:.02em}
#toasts{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:30}
.toast{background:rgba(24,22,18,.88);backdrop-filter:blur(6px);border:1px solid rgba(255,230,175,.3);color:#fff9ec;font-size:14px;font-weight:600;padding:7px 16px;border-radius:99px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@keyframes pop{from{transform:scale(.82) translateY(-6px);opacity:0}}
#mask{position:fixed;inset:0;background:rgba(12,20,28,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#mask.show{display:flex}
#modal{background:linear-gradient(180deg,#fffcf4,#f8f0dc);border:3px solid #6e4f2a;border-radius:16px;width:min(820px,100%);max-height:calc(100vh - 24px);overflow:auto;padding:16px 20px;box-shadow:0 16px 42px rgba(0,0,0,.52),inset 0 1px 0 #fff}
#modal h2{margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:2px solid rgba(196,174,130,.45);color:#3a2810}
#modal h3{margin:13px 0 6px;font-size:15px;color:#8a561e}
.scene{display:block;width:100%;max-width:560px;margin:0 auto;border-radius:12px;border:2px solid #6e4f2a;background:#1c2228;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.x{font:inherit;font-size:13.5px;font-weight:700;border:2px solid #8a6a42;background:linear-gradient(180deg,#fff,#f2e5c8);border-radius:9px;padding:4px 11px;cursor:pointer;box-shadow:0 2px 0 #6e4f2a;transition:all .12s}
.x:hover{background:#fff}
.btn{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;padding:9px 15px;background:linear-gradient(180deg,#367d59,#275e42);color:#fff;cursor:pointer;box-shadow:0 3px 0 #193f2b,0 3px 8px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #193f2b}
.btn:disabled{background:#bdb6a4!important;box-shadow:none!important;cursor:not-allowed;opacity:.75}
.btn.warn{background:linear-gradient(180deg,#bc4d37,#963825);box-shadow:0 3px 0 #662315}.btn.fire{background:linear-gradient(180deg,#d66422,#ad4a12);box-shadow:0 3px 0 #753008}.btn.air{background:linear-gradient(180deg,#367cbd,#265c91);box-shadow:0 3px 0 #173b5e}.btn.alt{background:linear-gradient(180deg,#918568,#73684e);box-shadow:0 3px 0 #4d4533}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.grid{display:flex;flex-wrap:wrap;gap:7px}
.item{border:2px solid #d4c39a;border-radius:10px;background:linear-gradient(180deg,#ffffff,#faf4e6);padding:5px 9px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;box-shadow:0 2px 4px rgba(0,0,0,.06);transition:all .12s}
.item:hover{border-color:#a88d58;background:#fff}
.item.sel{border-color:#2f6f4f;background:linear-gradient(180deg,#ebf7ee,#d6eedc);box-shadow:0 0 0 2px rgba(47,111,79,.2)}
.item img.ii{width:24px;height:24px;flex:none;display:block;margin:-2px 0}
.item small{color:#8a8470}
.plus{font:inherit;font-size:12px;font-weight:700;border:2px solid #d4c39a;border-radius:10px;background:linear-gradient(180deg,#f7efda,#eadbc0);padding:0 8px;cursor:pointer;margin-left:-5px;transition:background .12s}
.plus:hover{background:#fff3d6}
.cond{font:inherit;font-size:14px;border:2px solid #d4c39a;background:linear-gradient(180deg,#fff,#f9f2e2);border-radius:10px;padding:7px 12px;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.05);transition:all .12s}
.cond:hover:not(:disabled){border-color:#b0945e}
.cond.sel{border-color:#c2571a;background:linear-gradient(180deg,#fff0e2,#ffe1c6);font-weight:700;box-shadow:0 0 0 2px rgba(194,87,26,.18)}
.log{font-size:13px;line-height:1.65;background:#f2ead6;border:1px solid #dfd1b0;border-radius:10px;padding:7px 12px;margin-top:6px;min-height:28px}
.result{margin-top:10px;border-radius:12px;padding:12px 14px;background:#eef6ff;border:2px solid #9cc3ea;font-size:14px;line-height:1.68;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.result.fail{background:#f3efe6;border-color:#c9c0aa}
.result.new{background:linear-gradient(180deg,#fff9dc,#fff1b8);border-color:#dfaf2b}
.eq{font-size:17px;font-weight:700;margin:4px 0;font-family:"Times New Roman","Noto Serif TC",serif}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;color:#fff;background:#2f6f4f;margin-right:6px}
.tag.k-phys{background:#2f6ea8}.tag.k-obs{background:#857a5e}.tag.k-tech{background:#c2571a}
.entry{border:2px solid #d8c8a2;border-radius:11px;background:#fffdf8;padding:10px 13px;margin-bottom:8px;font-size:14px;line-height:1.68;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.entry.lock{color:#a8a08a;background:#f2ece0;border-style:dashed;padding:6px 12px;box-shadow:none}
.lbl{color:#8a5a22;font-weight:700}
.tech{display:flex;gap:12px;align-items:flex-start;border:2px solid #d8c8a2;border-radius:12px;background:#fffdf8;padding:10px 13px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.tech .ic{font-size:28px;line-height:1;width:38px;text-align:center}
.tech.done{border-color:#2f6f4f;background:linear-gradient(180deg,#eff8f1,#e4f2e8)}
.tech.locked{opacity:.62}
table.lb{width:100%;border-collapse:collapse;font-size:13.5px}
table.lb th,table.lb td{padding:6px 8px;border-bottom:1px solid #e3d8ba;text-align:left;white-space:nowrap}
table.lb th{color:#8a5a22;font-size:12px}
table.lb tr.me td{background:#fff3c4;font-weight:700}
.treewrap{overflow:auto;border:2px solid #d6c7a2;border-radius:12px;background:#fffdf6;padding:8px;max-height:62vh;box-shadow:inset 0 2px 6px rgba(0,0,0,.05)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:2px solid #d6c7a2;border-radius:11px;background:#f4efe2;padding:9px 10px;text-align:center;color:#9a927c;transition:transform .15s}
.badge.on{background:linear-gradient(180deg,#fff9e2,#ffefc2);border-color:#c98a1c;color:#3d3a30;box-shadow:0 3px 8px rgba(201,138,28,.16)}
.badge .bi{font-size:26px;line-height:1.2}
.badge b{display:block;font-size:14px}
.badge small{display:block;font-size:11.5px;line-height:1.35;margin-top:2px}
.tech .body{flex:1;font-size:14px;line-height:1.6}
.tech h4{margin:0;font-size:16px}
.era{font-size:12px;font-weight:400;color:#8a5a22;margin-left:8px}
.need span{display:inline-block;margin-right:10px}
.need .ok{color:#2f6f4f;font-weight:700}.need .no{color:#a8432f;font-weight:700}
.story{font-size:16px;line-height:1.9;white-space:pre-line}
.muted{color:#847d69;font-size:13px}
.pair{display:inline-flex;gap:3px}.pair .plus{margin-left:0}
.cgrp{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed #e0d5b8}.cgrp:first-child{border-top:0}.cname{flex:none;width:92px;font-size:12px;font-weight:700;color:#8a5a22;padding-top:8px;line-height:1.3}
@media(max-width:700px){.cname{width:58px}}
.savebox{border:2px solid #d6c7a2;border-radius:12px;background:#fffdf8;padding:11px 13px;margin-bottom:10px;font-size:14px;line-height:1.7;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.savebox h4{margin:0 0 4px;font-size:16px;color:#3a2810}
.savebox textarea{width:100%;height:64px;font:12px monospace;border:2px solid #d6c7a2;border-radius:8px;padding:6px;margin-top:6px}
.filebtn{display:inline-block;position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:40px}
@media(max-width:700px){#mini.big{width:92vw;bottom:auto;top:10px}#bar{gap:4px;padding:4px 6px}#bar button{font-size:12px;padding:8px 7px}#mini{width:136px;top:auto;bottom:68px}#zoom{top:auto;bottom:68px;right:156px;flex-wrap:wrap;width:82px}#prompt{bottom:122px}}
</style>

<body>
<canvas id="cv"></canvas>
<div id="quest"><div class="ch" id="qch"></div><div class="goal" id="qgoal"></div><div id="qmore"></div><button id="qtoggle">📓 翻看筆記（提示與任務清單）</button><div class="hint" id="qhint"></div><div id="qlist"></div><div id="score" title="點「圖鑑」看分數怎麼算"></div><div id="abil"></div></div>

<script id="logic">
/* ================= 資料區：物質、設施、反應、任務、世界（純邏輯，不碰畫面） ================= */
const ITEMS={
 actcarbon:{n:'活性碳',f:'C',c:'#2a2a2e',d:'用水蒸氣在高溫下把木炭「蛀」出無數小孔。孔的表面積大得驚人，能把有毒的氣體抓住。'},
 magnet:{n:'磁鐵',f:'',c:'#b33a3a',d:'被雷擊磁化的鋼棒。一端吸、一端斥，能吸起鐵屑。'},
 lens:{n:'透鏡',f:'SiO2',c:'#cfeaf2',d:'磨成中間厚、邊緣薄的玻璃。光通過它會偏折、聚在一起。'},
 filament:{n:'碳絲',f:'C',c:'#3a3a3a',d:'隔絕空氣悶燒過的植物纖維。細、黑、能導電，通電會發亮。'},
 tartar:{n:'酒石',f:'',c:'#d9c7b0',d:'釀酒的罐子內壁結出來的粗糙結晶。成分是酒石酸氫鉀。'},
 rochelle:{n:'酒石晶體',f:'',c:'#eaf4f7',d:'酒石酸鉀鈉的透明大晶體。擠壓它會產生電，通電它會振動——可以把電變成聲音。'},
 caramel:{n:'焦糖',f:'',c:'#7a3d12',d:'糖加熱到一百七十度左右，分解成褐色、帶苦香的混合物。'},
 cola:{n:'可樂',f:'',c:'#3d1c0a',d:'焦糖加碳酸水。冒著泡、甜中帶苦——這個世界的第一瓶汽水。'},
 galena:{n:'方鉛礦',f:'PbS',c:'#8d949c',d:'鉛灰色、有金屬光澤的立方體結晶。用細金屬絲輕觸它的表面，電只能朝一個方向通過。'},

 seawater:{n:'海水',f:'',c:'#2f7fc1',d:'溶有食鹽等多種鹽類的混合物。'},
 water:{n:'淡水',f:'H2O',c:'#8fd0f2',d:'從湖裡取得的水。'},
 caco3:{n:'石灰石／貝殼',f:'CaCO3',c:'#e2dfd2',d:'主要成分都是碳酸鈣。大理石、蛋殼也是。'},
 sand:{n:'石英砂',f:'SiO2',c:'#e0c98a',d:'沙的主要成分是二氧化矽，熔點高達 1700 °C。'},

 grain:{n:'穀物',f:'',c:'#d9b84a',d:'野生的穀粒。可以吃，也可以當種子種回田裡。'},

 guano:{n:'鳥糞石',f:'',c:'#dcd8c8',d:'海鳥的糞便經年累月堆積成的石頭，富含磷和氮。十九世紀時，各國曾為了搶它而打仗。'},

  phen:'窯口噴出黃色的濃煙和可以點燃的氣體，有一股刺鼻的臭味。留下來的東西變成銀灰色、佈滿小孔、敲起來鏗鏘作響。',use:'和悶木炭是同一個道理：隔絕空氣加熱，讓硫和容易跑掉的雜質先變成氣體離開，留下幾乎純的碳。跑出來的煤氣後來被拿去點路燈。',note:'1709 年英國的達比用焦炭煉鐵成功。那時英國的森林快被燒木炭砍光了，焦炭讓煉鐵不再受木材限制。中國在宋代就已經用焦炭煉鐵。'},
 {id:'pig_iron',name:'高爐煉鐵',kind:'chem',at:'heat',T:1400,sulfur:1,inputs:[['hematite','coke','caco3'],['hematite','coke','quicklime'],['magnetite','coke','caco3'],['magnetite','coke','quicklime']],out:{pigiron:3,co2:1},eq:'Fe2O3 + 3CO -> 2Fe + 3CO2',
  phen:'爐底流出亮得刺眼的橘白色鐵水，上面浮著一層像玻璃的熔渣。',use:'焦炭先燒成一氧化碳，一氧化碳再把鐵礦裡的氧搶走。溫度高到鐵整個熔化，可以直接流出來鑄造。石灰石負責把礦石裡的泥沙（二氧化矽）變成熔渣浮在上面，和鐵水分開。',note:'流出來的是含碳很多的生鐵。真實歷史上木炭高爐也煉得出生鐵（中國在兩千多年前就會了），但焦炭便宜又堅硬，撐得起更高的爐子；在這座島上，只有焦炭撐得起這麼高的爐子。'},
 {id:'steel',name:'鼓風煉鋼',kind:'chem',at:'heat',T:1500,air:1,fresh:1,not:['coke','charcoal','coal','hematite','magnetite','o2'],inputs:[['pigiron']],out:{steel:1},eq:'C + O2 -> CO2',
  phen:'空氣吹進熔化的生鐵，爐口噴出一大片火花，像放煙火。火花漸漸變少，就是碳快燒完了。',use:'生鐵太脆，是因為裡面的碳太多。鼓進去的空氣裡有氧，碳比鐵更容易和氧結合，先被燒成二氧化碳帶走。剩下含碳量剛好的就是鋼——又硬又韌。',note:'這一爐的爐料裡不能放焦炭：旁邊有碳，鐵裡的碳就燒不掉。中國漢代的「炒鋼」把生鐵加熱攪拌，讓空氣把碳燒掉；1856 年貝塞麥的轉爐直接把空氣吹進鐵水，幾十分鐘就能把幾噸生鐵變成鋼。'},
 {id:'steel_o2',name:'吹氧煉鋼',kind:'chem',at:'heat',T:1500,inputs:[['pigiron','o2']],out:{steel:1},eq:'C + O2 -> CO2',
  phen:'氧氣吹進鐵水，爐口噴出的火花比鼓風時更猛。',use:'用純氧代替空氣，碳燒得更快、更乾淨。',note:'現代煉鋼廠吹的就是純氧。'},
 {id:'cement',name:'燒製水泥',kind:'chem',at:'heat',T:1400,inputs:[['caco3','clay'],['quicklime','clay']],out:{cement:2},eqx:'石灰石 + 黏土 —(1450 °C)→ 水泥 + 二氧化碳',
  phen:'石灰和黏土燒成一顆顆灰黑色的硬塊，磨碎以後是灰色的粉末。',use:'石灰裡的鈣和黏土裡的矽、鋁在高溫下結合成新的化合物（主要是矽酸鈣）。這些化合物遇水會起反應、變硬。',note:'1824 年英國人阿斯普丁發明。因為硬化後的顏色像波特蘭島的石頭，所以叫波特蘭水泥。'},
 {id:'smelt_zn',name:'木炭還原氧化鋅',kind:'chem',at:'heat',T:950,closed:1,needs:'distill',inputs:[['zno','charcoal'],['zno','coke'],['zno','coal']],out:{zinc:2},eq:'ZnO + C -> Zn + CO',
  phen:'爐裡冒出的金屬蒸氣，在冷凝管裡凝成銀灰色的鋅。',use:'鋅在 907 °C 就沸騰，一煉出來就變成蒸氣跑掉，必須冷凝收集。蒸氣一碰到空氣又會燒回氧化鋅，所以要在封閉的窯裡煉，不能用鼓風爐。所以鋅比鐵晚了兩千多年才被煉出來。',note:'產生的一氧化碳有毒。'},
 {id:'bread',name:'烤麵包',kind:'chem',at:'heat',T:180,indoor:1,inputs:[['risen']],out:{bread:1},eqx:'發好的麵團 —(180 °C 以上)→ 麵包',phen:'麵團表面變成金黃色，飄出香味。',use:'高溫讓澱粉吸水糊化、蛋白質凝固，把氣孔的形狀固定下來；表面的糖和蛋白質反應，產生褐色和香氣。',note:''},
 {id:'boiledegg',name:'把蛋加熱',kind:'chem',at:'heat',T:70,inputs:[['egg']],out:{boiledegg:1},eqx:'蛋白質 —(加熱)→ 凝固',phen:'透明的蛋白變成不透明的白色固體。',use:'蛋白質受熱後形狀改變、互相纏在一起。冷卻也變不回去，所以是化學變化。',note:''},
 {id:'burn_ethanol',name:'酒精燃燒',kind:'chem',at:'heat',T:100,air:1,defer:['ester'],inputs:[['ethanol']],out:{co2:1},eq:'C2H5OH + 3O2 -> 2CO2 + 3H2O',phen:'淡藍色的火焰，幾乎沒有煙。',use:'酒精燈的原理。燃燒完全，所以火焰乾淨。',note:''},
 {id:'burn_h2',name:'氫氣燃燒',kind:'chem',at:'heat',T:300,air:1,defer:['burn_h2_o2','h2_cl2','h2_cuo','h2_fe'],inputs:[['h2']],out:{water:1},eq:'2H2 + O2 -> 2H2O',phen:'「啵！」一聲爆鳴，壁上出現水珠。',use:'氫和氧化合變成水——所以水不是元素，是化合物。',note:'氫氣和空氣混合遇火會爆炸，現實中只能用極少量做爆鳴測試。'},
 {id:'burn_c',lab:1,name:'木炭在氧氣中燃燒',kind:'chem',at:'heat',T:300,inputs:[['charcoal','o2'],['coke','o2'],['coal','o2']],out:{co2:1},eq:'C + O2 -> CO2',phen:'木炭在純氧中發出耀眼的白光！',use:'氧氣濃度越高，燃燒越劇烈。',note:''},
 {id:'cu_o2',lab:1,name:'銅在氧氣中加熱',kind:'chem',at:'heat',T:300,inputs:[['copper','o2']],out:{cuo:1},eq:'2Cu + O2 -> 2CuO',phen:'紅色的銅表面變黑。',use:'金屬的氧化。黑色的氧化銅可以再用木炭還原回銅。',note:''},
 {id:'fe_o2',lab:1,name:'鐵在氧氣中燃燒',kind:'chem',at:'heat',T:500,fresh:1,inputs:[['iron','o2'],['sponge','o2'],['steel','o2']],out:{magnetite:1},eq:'3Fe + 2O2 -> Fe3O4',phen:'火星四射！留下黑色的固體。',use:'鐵在純氧中可以燃燒，產物是四氧化三鐵——和磁鐵礦是同一種物質。',note:'把鋼絲絨點著了伸進氧氣瓶，會燒得像仙女棒一樣火花四射。'},
 /* ===== 蒸餾器 ===== */
 {id:'distill_wine',name:'蒸餾酒',kind:'phys',at:'still',T:78,inputs:[['wine']],out:{ethanol:1},eqx:'酒 → 酒精蒸氣 → 冷凝成酒精',phen:'還沒到水的沸點，就有透明液體滴進接收瓶，一點就著。',use:'酒精的沸點（78 °C）比水（100 °C）低，會先被蒸出來。',note:''},
 {id:'distill_sea',name:'蒸餾海水',kind:'phys',at:'still',T:100,inputs:[['seawater']],out:{water:1,salt:1},eqx:'海水 → 水蒸氣 → 冷凝成淡水',phen:'燒瓶裡的海水沸騰，冷凝管另一端滴出清澈的水，嚐起來不鹹。',use:'利用沸點不同來分離混合物：水先變成氣體跑出去，鹽留在原地。',note:''},
 {id:'hcl',name:'食鹽加硫酸製鹽酸',kind:'chem',at:'still',T:150,inputs:[['salt','h2so4']],out:{hcl:1},eq:'NaCl + H2SO4 -> NaHSO4 + HCl',phen:'冒出刺鼻的白霧，通入水中就成了鹽酸。',use:'「鹽酸」這個名字，就是因為它是從食鹽做出來的酸。',note:'氯化氫氣體有強烈刺激性。'},
 {id:'h2so4',name:'乾餾綠礬製硫酸',kind:'chem',at:'still',T:480,inputs:[['vitriol','water']],out:{h2so4:1,hematite:1},eq:'2FeSO4 + H2O -> Fe2O3 + SO2 + H2SO4',
  phen:'藍綠色的晶體變白、再變成紅褐色粉末；冷凝管滴出油狀的液體，還有刺鼻的氣味。',use:'這是八世紀鍊金術士發現的方法，硫酸因此被叫做「礬油」。留下的紅色粉末就是三氧化二鐵。',note:'二氧化硫有毒、有刺激性。現代工業改用硫磺和接觸法製硫酸。'},
 /* ===== 實驗桌 ===== */
 {id:'slake',name:'生石灰加水',kind:'chem',at:'table',hot:1,inputs:[['quicklime','water']],out:{slaked:1},eq:'CaO + H2O -> Ca(OH)2',phen:'嘶嘶作響、冒出水蒸氣，塊狀裂開成白色粉末——好燙！',use:'化合反應，而且放熱。自熱便當、食品乾燥劑都利用了它。',note:'現實中會燙傷，不能用手碰。'},
 {id:'limewater',name:'配製澄清石灰水',kind:'phys',at:'table',inputs:[['slaked','water']],out:{limewater:1},eqx:'熟石灰 + 水 → 澄清石灰水（溶解）',phen:'攪拌後液體混濁，靜置後取上層澄清液。',use:'氫氧化鈣只微溶於水，所以要取上層澄清的部分。',note:''},
 {id:'breath',name:'對石灰水吹氣',kind:'chem',at:'table',ppt:1,inputs:[['limewater']],out:{caco3:1},eq:'Ca(OH)2 + CO2 -> CaCO3 + H2O',phen:'用一根空心的草莖，對著澄清的石灰水慢慢吹氣。吹著吹著，水變得白白濁濁的。',use:'你呼出來的氣體裡有二氧化碳，它和石灰水反應，生成不溶於水的碳酸鈣——和貝殼、石灰石是同一種東西。',note:'燒石灰石時從爐口散掉的，也是二氧化碳。吸進去的空氣裡很少，呼出來的卻變多了：身體裡也在進行某種「燃燒」。'},
 {id:'limewater_co2',name:'二氧化碳通入石灰水',kind:'chem',at:'table',ppt:1,inputs:[['limewater','co2']],out:{caco3:1},eq:'Ca(OH)2 + CO2 -> CaCO3 + H2O',phen:'澄清的石灰水變成白色混濁！',use:'這是檢驗二氧化碳的方法。白色沉澱就是碳酸鈣——和貝殼是同一種物質，繞了一圈又回來了。',note:''},
 {id:'mortar',name:'調製灰泥',kind:'phys',at:'table',inputs:[['slaked','sand','water'],['quicklime','sand','water']],out:{mortar:2},eqx:'熟石灰 + 石英砂 + 水 → 灰泥（混合）',phen:'攪成黏稠的灰白色泥漿。',use:'調的時候只是混合。但抹上牆之後，熟石灰會吸收空氣中的二氧化碳，慢慢變回堅硬的碳酸鈣——那就是化學變化了。',note:'羅馬人和古代中國的城牆都用它。'},
 {id:'crush',name:'把石英敲碎',kind:'phys',at:'table',inputs:[['quartz']],out:{sand:2},eqx:'石英 → 石英砂（敲碎）',phen:'透明的晶體碎成一堆白色的細砂。',use:'只是顆粒變小，成分還是二氧化矽——沒有產生新物質，這是物理變化。',note:''},
 {id:'forge',name:'鍛打海綿鐵',kind:'phys',at:'table',n:{sponge:2},inputs:[['sponge']],out:{iron:1},eqx:'海綿鐵 —(燒紅、反覆鍛打)→ 熟鐵 + 擠出來的爐渣',phen:'趁海綿鐵還燒得通紅，放在石砧上用力敲。每敲一下，就有火星和黑色的渣噴出來；鐵塊越打越小、越打越結實。',use:'爐子的溫度不夠讓鐵熔化，鐵和爐渣混成一團多孔的海綿。把它燒紅反覆鍛打，渣被擠出來，鐵被壓成緻密的一塊，才成為能用的熟鐵。兩塊海綿鐵只打得出一塊。',note:'世界上大多數地方，最早的鐵都是這樣一鎚一鎚打出來的。中國很早就把爐子蓋高、把風鼓足，讓鐵熔成鐵水直接流出來，走上了另一條路。'},
 {id:'concrete',name:'拌混凝土',kind:'chem',at:'table',hot:1,inputs:[['cement','sand','water']],out:{concrete:2},eqx:'水泥 + 水 → 水合矽酸鈣（硬化）',phen:'灰色的泥漿慢慢變稠、發熱，最後硬得像石頭，再泡水也不會散。',use:'水泥不是「乾了」才變硬，而是和水發生化學反應（水化），所以在水裡也能凝固。這和灰泥不一樣——灰泥是靠吸收空氣中的二氧化碳。',note:'反應會放熱。大型水壩灌漿時，還得埋冷卻水管幫它降溫。'},
 {id:'flour',name:'把穀物磨成粉',kind:'phys',at:'table',inputs:[['grain']],out:{flour:1},eqx:'穀物 → 麵粉（磨碎）',phen:'穀粒在石頭上磨成白色的細粉。',use:'只是顆粒變小，成分沒有變——物理變化。',note:''},
 {id:'dough',name:'揉麵團',kind:'phys',at:'table',inputs:[['flour','water']],out:{dough:1},eqx:'麵粉 + 水 → 麵團',phen:'粉和水揉成一團有彈性的麵團。',use:'麵粉裡的蛋白質吸水後互相拉在一起，形成有彈性的網（麵筋）。',note:''},
 {id:'rise',name:'麵團發酵',kind:'chem',at:'table',indoor:1,clean:1,inputs:[['dough']],out:{risen:1,co2:1},eq:'C6H12O6 -> 2C2H5OH + 2CO2',phen:'麵團放著放著，脹成兩倍大，切開來裡面都是小洞。',use:'空氣裡的酵母菌吃掉麵團裡的糖，放出二氧化碳，氣體被麵筋包住，就把麵團撐大了。和釀酒是同一個反應。',note:'產生的少量酒精在烤的時候會蒸發掉。'},
 {id:'vinegar',name:'酒變成醋',kind:'chem',at:'table',indoor:1,clean:1,inputs:[['wine']],out:{vinegar:1},eq:'C2H5OH + O2 -> CH3COOH + H2O',phen:'沒蓋好的酒放了幾天，聞起來變酸了。',use:'空氣中的醋酸菌讓酒精和氧氣反應，變成醋酸。這是人類最早得到的酸。',note:'現實中要等上好幾天。'},
 {id:'ind_vinegar',name:'指示劑檢驗醋',kind:'chem',at:'table',col:'#c8508f',inputs:[['indicator','vinegar']],out:{},eqx:'紫色 → 粉紅色（弱酸性）',phen:'紫色的指示劑變成粉紅色。',use:'醋是弱酸，顏色變化介於碳酸水和硫酸之間。',note:''},
 {id:'caco3_vinegar',name:'貝殼泡醋',kind:'chem',at:'table',inputs:[['caco3','vinegar']],out:{co2:1},eq:'CaCO3 + 2CH3COOH -> Ca(CH3COO)2 + H2O + CO2',phen:'貝殼表面慢慢冒出細小的氣泡。',use:'醋雖然是弱酸，一樣能和碳酸鈣反應放出二氧化碳，只是比鹽酸慢得多。',note:''},
 {id:'egg_vinegar',name:'雞蛋泡醋',kind:'chem',at:'table',inputs:[['egg','vinegar']],out:{co2:1},eq:'CaCO3 + 2CH3COOH -> Ca(CH3COO)2 + H2O + CO2',phen:'蛋殼冒著泡慢慢消失，最後剩下一顆軟軟的、半透明的「無殼蛋」。',use:'蛋殼是碳酸鈣，會被醋溶掉；裡面那層薄膜不是碳酸鈣，所以留了下來。',note:'現實中要泡一兩天。'},
 {id:'curd',name:'牛奶加酸',kind:'chem',at:'table',ppt:1,inputs:[['milk','vinegar'],['milk','hcl']],out:{curd:1},eqx:'牛奶裡的蛋白質 + 酸 → 凝固',phen:'牛奶裡出現一團一團白色的凝塊，剩下的水變得清清的。',use:'牛奶裡的蛋白質（酪蛋白）遇到酸，形狀會改變、互相黏在一起沉下來。把凝塊瀝乾就是最簡單的起司。',note:'換成鹽酸也一樣。胃酸就是鹽酸，所以喝下去的牛奶，到了胃裡也會先凝成一塊一塊。'},
 {id:'compost',name:'堆肥',kind:'chem',at:'table',inputs:[['fiber','water'],['cabbage','water']],out:{compost:1},eqx:'植物殘渣 —(微生物分解)→ 腐植質 + 二氧化碳',phen:'草葉堆在一起澆了水，慢慢發熱、變黑、變鬆，聞起來像森林裡的土。',use:'微生物把植物分解成植物能再吸收的養分。分解會放熱，所以堆肥堆的中心是燙的。',note:'現實中要幾個星期到幾個月。'},
 {id:'carbonic',name:'二氧化碳溶於水',kind:'chem',at:'table',inputs:[['co2','water']],out:{carbonic:1},eq:'CO2 + H2O -> H2CO3',phen:'氣體溶進水裡，外觀沒有明顯變化。',use:'汽水的原理。看不出來的變化，可以用指示劑檢驗。',note:'真實情況下只有一小部分二氧化碳會變成碳酸。'},
 {id:'neutral',name:'碳酸水加石灰水',kind:'chem',at:'table',ppt:1,inputs:[['carbonic','limewater']],out:{caco3:1},eq:'H2CO3 + Ca(OH)2 -> CaCO3 + 2H2O',phen:'混合後產生白色混濁。',use:'酸鹼中和：酸 + 鹼 → 鹽 + 水。這裡的「鹽」是難溶的碳酸鈣。',note:''},
 {id:'ind_base',name:'指示劑檢驗石灰水',kind:'chem',at:'table',col:'#3fa35a',inputs:[['indicator','limewater'],['indicator','slaked'],['indicator','quicklime']],out:{},eqx:'紫色 → 綠色（鹼性）',phen:'紫色的指示劑變成綠色！',use:'石灰水是鹼性溶液。',note:''},
 {id:'ind_lye',name:'指示劑檢驗草木灰水',kind:'chem',at:'table',col:'#3f9a8a',inputs:[['indicator','lye']],out:{},eqx:'紫色 → 藍綠色（鹼性）',phen:'紫色的指示劑變成藍綠色。',use:'草木灰水是鹼性的，所以古人用它洗衣服。',note:''},
 {id:'ind_acid',name:'指示劑檢驗碳酸水',kind:'chem',at:'table',col:'#b0457f',inputs:[['indicator','carbonic']],out:{},eqx:'紫色 → 紫紅色（弱酸性）',phen:'紫色的指示劑偏向紫紅色。',use:'碳酸是弱酸，顏色只改變一點點。',note:''},
 {id:'ind_koh',name:'指示劑檢驗氫氧化鉀',kind:'chem',at:'table',col:'#b7c23a',inputs:[['indicator','koh'],['indicator','naoh']],out:{},eqx:'紫色 → 黃綠色（強鹼性）',phen:'紫色的指示劑變成黃綠色！',use:'強鹼讓顏色變化得比石灰水更明顯。',note:''},
 {id:'ind_h2so4',name:'指示劑檢驗強酸',kind:'chem',at:'table',col:'#e0393e',inputs:[['indicator','h2so4'],['indicator','hcl']],out:{},eqx:'紫色 → 紅色（強酸性）',phen:'紫色的指示劑變成鮮紅色！',use:'強酸讓指示劑變成紅色。',note:''},
 {id:'lye',name:'草木灰泡水',kind:'phys',at:'table',inputs:[['ash','water']],out:{lye:1},eqx:'草木灰 + 水 → 草木灰水（溶解、過濾）',phen:'灰沉到底部，上層的水略帶黃色，摸起來滑滑的。',use:'灰裡的碳酸鉀溶進水裡，不溶的雜質留下來。',note:''},
 {id:'causticize',name:'草木灰水加石灰水',kind:'chem',at:'table',ppt:1,inputs:[['lye','limewater'],['lye','slaked'],['ash','limewater'],['ash','slaked','water']],out:{koh:1,caco3:1},eq:'K2CO3 + Ca(OH)2 -> 2KOH + CaCO3',phen:'混合後出現白色沉澱，上層液體變得更滑、更「咬手」。',use:'沉澱是碳酸鈣；留在水裡的氫氧化鉀是比原來強得多的鹼。這是古人製造強鹼的方法。',note:'氫氧化鉀有腐蝕性。'},
 {id:'juice',name:'榨甘蔗汁',kind:'phys',at:'table',inputs:[['sugarcane','water']],out:{juice:1},eqx:'甘蔗 + 水 → 糖水（溶解）',phen:'得到一罐甜甜的黃綠色汁液。',use:'糖溶在水裡，形成溶液。',note:''},
 {id:'ferment',name:'糖水發酵',kind:'chem',at:'table',indoor:1,clean:1,inputs:[['juice']],out:{wine:1,co2:1},eq:'C6H12O6 -> 2C2H5OH + 2CO2',phen:'靜置幾天，液面不斷冒出小氣泡，聞起來有酒味。',use:'空氣中的酵母菌把糖分解成酒精和二氧化碳。',note:'甘蔗裡的蔗糖會先被分解成葡萄糖和果糖（都是 C₆H₁₂O₆）再發酵。現實中要等上好幾天。'},
 {id:'caco3_hcl',name:'石灰石加鹽酸',kind:'chem',at:'table',inputs:[['caco3','hcl'],['caco3','acidlake']],out:{co2:1},eq:'CaCO3 + 2HCl -> CaCl2 + H2O + CO2',phen:'石頭表面冒出大量氣泡，慢慢變小。',use:'碳酸鹽遇到酸會放出二氧化碳。這也是實驗室製造二氧化碳的方法。',note:''},
 {id:'cuo_acid',name:'氧化銅加稀硫酸',kind:'chem',at:'table',inputs:[['cuo','h2so4']],out:{cuso4:1},eq:'CuO + H2SO4 -> CuSO4 + H2O',phen:'黑色粉末消失，溶液變成漂亮的藍色！',use:'金屬氧化物 + 酸 → 鹽 + 水。藍色來自銅離子。',note:'稍微加熱會反應得更快。'},
 {id:'fe_cuso4',name:'鐵放進硫酸銅溶液',kind:'chem',at:'table',col:'#bfe0c8',inputs:[['iron','cuso4'],['sponge','cuso4'],['pigiron','cuso4'],['steel','cuso4']],out:{copper:1,vitriol:1},eq:'Fe + CuSO4 -> FeSO4 + Cu',phen:'鐵的表面長出一層紅色的銅，藍色溶液漸漸變成淺綠色。',use:'鐵比銅活潑，把銅從溶液裡「趕」了出來。古人叫它「膽水煉銅」。',note:''},
 {id:'cu_hot_acid',name:'銅加硫酸加熱',kind:'chem',at:'heat',T:200,pot:1,inputs:[['copper','h2so4']],out:{cuso4:1},eq:'Cu + 2H2SO4 -> CuSO4 + SO2 + 2H2O',
  phen:'一開始什麼事也沒有。水越煮越少，酸越來越濃，銅片表面開始冒出刺鼻的氣體，溶液慢慢變成藍色。',use:'冷的稀硫酸拿銅沒辦法；但加熱把水趕走以後，又濃又熱的硫酸能直接把銅氧化，生成硫酸銅，同時放出二氧化硫。',note:'這和「金屬把酸裡的氫趕出來」是不同的反應——冒出來的不是氫氣，是有毒的二氧化硫。現實中必須在抽風櫃裡做。'},
 {id:'actcarbon',name:'用水蒸氣活化木炭',kind:'chem',at:'heat',T:800,closed:1,inputs:[['charcoal','water']],out:{actcarbon:1},eq:'C + H2O -> CO + H2',phen:'悶在窯室裡的木炭被滾燙的水蒸氣一點一點「蛀」掉，剩下的部分佈滿了看不見的小孔，變得又輕又脆。',use:'高溫的水蒸氣會和碳反應，把一部分的碳變成氣體帶走。留下來的碳像海綿一樣全是孔洞——一小撮的表面積就有好幾座籃球場大，能把氣體和雜質牢牢吸在表面。',note:'這叫「吸附」，是物理變化。淨水器、口罩、冰箱除臭劑裡的黑色顆粒，都是活性碳。'},
 {id:'obs_actc_cold',name:'溫度不夠的木炭和水',kind:'obs',at:'heat',T:150,failOf:'actcarbon',lose:['water'],inputs:[['charcoal','water']],out:{},eqx:'（水只是蒸發了）',phen:'水燒乾了，木炭還是原來的木炭。',use:'水蒸氣要夠燙，才咬得動碳。',note:''},
 {id:'filament',name:'把纖維悶成碳絲',kind:'chem',at:'heat',T:800,closed:1,needs:'pottery',inputs:[['fiber']],out:{filament:1},eqx:'植物纖維 —(隔絕空氣加熱)→ 碳絲 + 水蒸氣 + 可燃氣體',phen:'把纖維埋在炭粉裡、封進有蓋的陶罐再燒。細細的纖維沒有燒掉，而是整條變黑、變硬，還保持著原來的形狀。',use:'和悶木炭是同一件事，只是要燒得更熱，碳絲才導得了電：沒有氧氣，纖維裡的氫和氧先跑掉，留下一條細細的碳。碳能導電，又耐高溫，是最早的燈絲。',note:'愛迪生試了六千多種材料，最後用的是日本京都的竹子悶成的碳絲，可以亮一千多個小時。'},
 {id:'lens',name:'把玻璃磨成透鏡',kind:'phys',at:'table',inputs:[['glass','sand']],out:{lens:1},eqx:'玻璃 —(用細沙研磨)→ 透鏡',phen:'玻璃片在沾濕的細沙上一圈一圈地磨。磨了很久很久，中間厚、邊緣薄，對著太陽能把光聚成一個亮點。',use:'石英砂比玻璃硬，所以磨得動玻璃。光從空氣進到玻璃會偏折；把玻璃磨成弧面，就能讓光線往中間集中。',note:'十七世紀的磨鏡師傅磨一片好透鏡要好幾天。'},
 {id:'rochelle',name:'製作酒石晶體',kind:'chem',at:'heat',T:80,pot:1,inputs:[['tartar','natron','water']],out:{rochelle:1},eqx:'酒石（酒石酸氫鉀）+ 碳酸鈉 → 酒石酸鉀鈉 + 水 + 二氧化碳',phen:'酒石在溫熱的鹼水裡冒著細泡溶掉了。放涼以後，杯底慢慢長出一顆透明的大晶體。',use:'酒石是酸性的鹽，遇到碳酸鈉會冒二氧化碳，生成更容易溶解、也更容易長成大晶體的酒石酸鉀鈉。這種晶體一被擠壓就產生電，一通電就振動。',note:'這叫「壓電效應」。早期的麥克風、耳機和唱針，用的就是這種晶體。'},
 {id:'caramel',name:'把糖水熬成焦糖',kind:'chem',at:'heat',T:170,pot:1,inputs:[['juice']],out:{caramel:1},eqx:'蔗糖 —(約 170 °C)→ 焦糖 + 水',phen:'水先滾乾，糖漿從透明變成金黃、再變成深褐色，冒出又甜又苦的香氣。',use:'糖受熱到一百七十度左右會分解、互相結合，變成幾百種有顏色、有香氣的新物質。這是化學變化——焦糖再也變不回白糖。',note:'再燒下去就只剩黑色的碳了：糖是碳、氫、氧組成的。'},
 {id:'cola',name:'調一瓶可樂',kind:'phys',at:'table',inputs:[['caramel','carbonic']],out:{cola:1},eqx:'焦糖 + 碳酸水 → 可樂（混合）',phen:'褐色的糖漿在冒泡的水裡化開。喝一口——氣泡在舌頭上炸開，甜中帶一點苦。',use:'汽水的「氣」就是溶在水裡的二氧化碳。打開瓶子壓力變小，二氧化碳就跑出來。',note:'真正的可樂還加了磷酸和香料。配方是商業機密。'},
 {id:'unslake',name:'加熱熟石灰',kind:'chem',at:'heat',T:520,inputs:[['slaked']],out:{quicklime:1},eq:'Ca(OH)2 -> CaO + H2O',phen:'白色粉末冒出水氣，變得更乾、更輕。',use:'熟石灰加熱到五百多度會把水吐出來，變回生石灰。加水變熟石灰、加熱變回生石灰——這個反應可以來回走。',note:'所以灰泥砌的爐子，內壁其實一直在失水、吸水之間循環。'},
 {id:'dry_lime',name:'煮乾石灰水',kind:'phys',at:'heat',T:100,pot:1,not:['oil'],inputs:[['limewater']],out:{slaked:1},eqx:'澄清石灰水 → 水蒸氣 + 熟石灰（析出）',phen:'水煮乾了，鍋底留下一層薄薄的白色粉末。',use:'石灰水是熟石灰溶在水裡。把水趕走，溶質就留下來——和煮海水得到食鹽是同一個道理。',note:'氫氧化鈣很難溶，所以留下來的粉末只有一點點。'},
 {id:'roast_vitriol',name:'在火上直接燒綠礬',kind:'chem',at:'heat',T:480,inputs:[['vitriol']],out:{hematite:1},eqx:'硫酸亞鐵 —(加熱)→ 氧化鐵 + 二氧化硫 + 三氧化硫',phen:'藍綠色的晶體先變白，再變成紅褐色的粉末，同時冒出嗆鼻的白煙，一下就散掉了。',use:'綠礬受熱分解，留下的紅色粉末是氧化鐵（鐵紅），和赤鐵礦是同一種東西。真正值錢的是那陣白煙——可惜在敞開的火上，它全跑掉了。',note:'如果能把那陣煙接住、讓它溶進水裡呢？'},
 {id:'carb_acid',name:'碳酸鹽遇到酸',kind:'chem',at:'table',inputs:[['natron','vinegar'],['natron','hcl'],['natron','h2so4'],['lye','vinegar'],['lye','hcl'],['lye','h2so4'],['sodawater','vinegar'],['sodawater','hcl'],['sodawater','h2so4'],['ash','vinegar'],['ash','hcl'],['ash','h2so4'],['natron','h2so3'],['sodawater','h2so3'],['lye','h2so3'],['natron','acidlake'],['lye','acidlake'],['ash','acidlake']],out:{co2:1},eqx:'碳酸鹽 + 酸 → 鹽 + 水 + 二氧化碳',phen:'一碰到酸就嘶嘶作響，冒出大量氣泡。',use:'天然鹼和鹼湖水裡是碳酸鈉，草木灰和草木灰水裡是碳酸鉀，貝殼是碳酸鈣——名字裡有「碳酸」的，遇到酸都會放出二氧化碳。',note:'這是檢驗碳酸鹽最簡單的方法。'},
 {id:'obs_caco3_h2so4',name:'石灰石加稀硫酸',kind:'obs',at:'table',inputs:[['caco3','h2so4']],out:{},eqx:'CaCO₃ + H₂SO₄ → CaSO₄（微溶，包住表面）+ H₂O + CO₂',phen:'冒了幾個氣泡，很快就停了。石頭表面蓋上一層白白的東西。',use:'反應生成的硫酸鈣很難溶於水，像一層殼包住石灰石，酸碰不到裡面，反應就停了。換成鹽酸或醋就不會這樣。',note:'所以實驗室製二氧化碳用的是鹽酸，不用硫酸。'},
 {id:'neutral3',name:'酸鹼中和',kind:'chem',at:'table',hot:1,inputs:[['h2so4','limewater'],['hcl','limewater'],['vinegar','limewater'],['h2so4','koh'],['hcl','koh'],['vinegar','koh'],['h2so4','naoh'],['vinegar','naoh'],['slaked','h2so4'],['slaked','hcl'],['slaked','vinegar'],['quicklime','hcl'],['quicklime','h2so4'],['quicklime','vinegar'],['h2so3','naoh'],['h2so3','koh'],['acidlake','naoh'],['acidlake','koh'],['acidlake','limewater'],['acidlake','slaked']],out:{},eqx:'酸 + 鹼 → 鹽 + 水',phen:'兩種液體倒在一起，杯子微微發熱。看起來還是一杯水，但酸不再酸、鹼不再滑了。',use:'酸和鹼會互相抵消，生成鹽和水，並放出熱。先滴幾滴紫甘藍指示劑再混合，可以看到顏色一路變回紫色。',note:'硫酸加石灰水會出現白色混濁，那是難溶的硫酸鈣（石膏）。'},
 {id:'metal_hcl',name:'金屬與稀鹽酸',kind:'chem',at:'table',inputs:[['iron','hcl'],['sponge','hcl'],['zinc','hcl'],['pigiron','hcl'],['steel','hcl'],['tin','hcl'],['iron','acidlake'],['sponge','acidlake'],['pigiron','acidlake'],['zinc','acidlake']],out:{h2:1},eqx:'活潑金屬 + 鹽酸 → 金屬的氯化物 + 氫氣',phen:'金屬表面冒出氣泡，慢慢變小。鋅冒得比鐵快得多。',use:'和稀硫酸一樣，鹽酸裡的氫也會被比氫活潑的金屬趕出來。',note:'錫也會冒泡，只是比鐵慢。銅放進鹽酸裡，一樣沒有動靜。'},
 {id:'mal_acid',name:'孔雀石加稀硫酸',kind:'chem',at:'table',inputs:[['malachite','h2so4']],out:{cuso4:2,co2:1},eq:'Cu2(OH)2CO3 + 2H2SO4 -> 2CuSO4 + CO2 + 3H2O',phen:'綠色的石頭冒著氣泡溶進酸裡，溶液變成漂亮的藍色。',use:'孔雀石是鹼式碳酸銅：有「碳酸」，所以遇酸冒二氧化碳；有銅，所以溶液變藍。不必先燒成氧化銅，酸可以直接把銅「泡」出來。',note:'現代的銅礦場有一大部分就是用酸把銅從礦石裡淋洗出來，再用電把銅鍍回來。'},
 {id:'obs_ash_heat',name:'把草木灰再燒一次',kind:'obs',at:'heat',T:600,alone:1,inputs:[['ash']],out:{},eqx:'（碳酸鉀很耐熱，沒有分解）',phen:'灰還是灰。燒得通紅，冷了以後一點也沒變。',use:'草木灰的主要成分是碳酸鉀。同樣是碳酸鹽，貝殼裡的碳酸鈣八百多度就分解了，碳酸鉀卻要到一千兩百度以上——不是每一種碳酸鹽都燒得動。',note:'天然鹼（碳酸鈉）也一樣耐熱。'},
 {id:'obs_seawater',name:'用海水代替淡水',kind:'obs',at:'none',inputs:[],out:{},eqx:'（反應照樣發生，但鹽留在成品裡）',phen:'看起來和用淡水做的差不多。可是乾了以後，表面浮出一層白白的鹽霜，摸起來潮潮的。',use:'海水每一百份裡大約有三份半的鹽。水參加反應或蒸發以後，鹽全留在成品裡：灰泥會吸潮、鬆掉，溶液不純，吃的東西鹹得不能入口。',note:'生石灰加海水一樣會發熱變成熟石灰，只是裡面混了鹽，不能用了。化學實驗講究「純」，就是這個原因。'},
 {id:'fe_acid',name:'鐵加稀硫酸',kind:'chem',at:'table',col:'#cfe6d0',inputs:[['iron','h2so4'],['sponge','h2so4'],['pigiron','h2so4'],['steel','h2so4']],out:{vitriol:1,h2:1},eq:'Fe + H2SO4 -> FeSO4 + H2',phen:'鐵的表面冒出氣泡，溶液變成淺綠色。',use:'活潑的金屬能把酸裡的氫趕出來，變成氫氣。',note:'1766 年卡文迪西就是這樣發現氫氣的。'},
 {id:'zn_acid',name:'鋅加稀硫酸',kind:'chem',at:'table',inputs:[['zinc','h2so4']],out:{znso4:1,h2:1},eq:'Zn + H2SO4 -> ZnSO4 + H2',phen:'鋅的表面劇烈冒泡，比鐵快得多。',use:'鋅比鐵更活潑，所以反應更快。實驗室常用這個方法製造氫氣。',note:''},
 {id:'zn_cuso4',name:'鋅放進硫酸銅溶液',kind:'chem',at:'table',inputs:[['zinc','cuso4']],out:{copper:1,znso4:1},eq:'Zn + CuSO4 -> ZnSO4 + Cu',phen:'鋅的表面長出紅色的銅，藍色溶液褪成無色。',use:'鋅比銅活潑。金屬活性：鋅 > 鐵 > 銅。',note:''},
 {id:'brine',name:'配製食鹽水',kind:'phys',at:'table',inputs:[['salt','water']],out:{brine:1},eqx:'食鹽 + 水 → 食鹽水（溶解）',phen:'白色晶體消失在水中。',use:'食鹽在水中解離成鈉離子和氯離子，所以能導電，是電解質。',note:''},
 {id:'neutral2',name:'鹽酸加氫氧化鈉',kind:'chem',at:'table',hot:1,inputs:[['hcl','naoh']],out:{salt:1},eq:'HCl + NaOH -> NaCl + H2O',phen:'混合後溫度上升，把水蒸乾，留下白色晶體——是食鹽。',use:'酸鹼中和：酸 + 鹼 → 鹽 + 水，並且放熱。兩種有腐蝕性的東西，變成了可以吃的鹽。',note:''},
 {id:'clwater',name:'氯氣溶進水裡',kind:'chem',at:'table',inputs:[['cl2','water']],out:{clwater:1},eq:'Cl2 + H2O -> HCl + HClO',phen:'黃綠色的氣體慢慢溶進水裡，水變成淡淡的黃綠色，聞起來像游泳池。',use:'氯氣有一部分和水反應，變成鹽酸和次氯酸。這個反應可以倒回去，所以水裡同時有氯氣、鹽酸和次氯酸。次氯酸能漂白、能殺菌。',note:'自來水加氯消毒，就是利用這個反應。'},
 {id:'ind_clwater',name:'指示劑遇到氯水',kind:'chem',at:'table',col:'#f2efe6',inputs:[['indicator','clwater'],['indicator','bleach'],['indicator','cl2']],out:{},eqx:'先變色，接著褪成無色',phen:'紫色的汁液先變了色，幾秒鐘後顏色越來越淡，最後幾乎變成透明的水。',use:'一般的酸或鹼只會讓指示劑「變色」，換個酸鹼就能變回來。次氯酸卻是把色素分子拆壞了，顏色再也回不來——這就是「漂白」。',note:'所以用氯水或漂白水測酸鹼，是測不準的。'},
 {id:'bleach',name:'製作漂白水',kind:'chem',at:'table',inputs:[['cl2','naoh'],['clwater','naoh']],out:{bleach:1},eq:'Cl2 + 2NaOH -> NaClO + NaCl + H2O',phen:'黃綠色的氣體通進氫氧化鈉溶液，顏色消失了，溶液帶著一股熟悉的消毒水味。',use:'氯氣和鹼反應，生成次氯酸鈉，就是家用漂白水的主要成分。電解食鹽水正好同時得到氯氣和氫氧化鈉——兩個產物湊在一起，就是一瓶漂白水。',note:'回屋裡用它消毒發酵罐，比洗手更能防止雜菌污染。'},
 {id:'bleach_acid',name:'漂白水遇到酸',kind:'chem',at:'table',inputs:[['bleach','hcl'],['bleach','vinegar'],['bleach','h2so4'],['bleach','acidlake']],out:{cl2:1},eq:'NaClO + 2HCl -> NaCl + Cl2 + H2O',phen:'溶液冒出氣泡，一股刺鼻的黃綠色氣體湧了出來！',use:'漂白水碰到酸，次氯酸根會變回氯氣跑出來。氯氣有毒，吸進去會傷害呼吸道。',note:'⚠️ 家裡的漂白水絕對不能和浴廁清潔劑（含鹽酸）混用，每年都有人因此中毒。'},
 /* ===== v2.19 補齊的反應 ===== */
 {id:'causticize_na',name:'天然鹼加石灰水',kind:'chem',at:'table',ppt:1,inputs:[['natron','limewater'],['sodawater','limewater'],['natron','slaked','water'],['sodawater','slaked']],out:{naoh:1,caco3:1},eq:'Na2CO3 + Ca(OH)2 -> 2NaOH + CaCO3',phen:'混合後出現白色沉澱，上層的液體摸起來更滑、更「咬手」。',use:'和草木灰水加石灰水是同一個反應，只是把鉀換成鈉：沉下去的是碳酸鈣，留在水裡的是氫氧化鈉。十九世紀的工廠就是這樣把蘇打變成燒鹼，後來才改用電解食鹽水。',note:'氫氧化鈉有強腐蝕性，現實中要戴手套和護目鏡。'},
 {id:'ore_acid',name:'碳酸鹽礦石遇到酸',kind:'chem',at:'table',inputs:[['malachite','hcl'],['malachite','vinegar'],['smithsonite','hcl'],['smithsonite','vinegar'],['egg','hcl'],['egg','acidlake']],out:{co2:1},eqx:'碳酸鹽 + 酸 → 鹽 + 水 + 二氧化碳',phen:'表面冒出一串串氣泡。泡孔雀石的那杯，溶液染成了藍綠色。',use:'孔雀石、菱鋅礦、蛋殼，成分裡都有「碳酸」，遇到酸都會放出二氧化碳。銅的化合物溶在水裡，大多帶著藍綠色。',note:'用醋的話冒得慢很多——醋是弱酸。'},
 {id:'smith_acid',name:'菱鋅礦加稀硫酸',kind:'chem',at:'table',inputs:[['smithsonite','h2so4']],out:{znso4:1,co2:1},eq:'ZnCO3 + H2SO4 -> ZnSO4 + H2O + CO2',phen:'礦石冒著氣泡溶進酸裡，留下一杯無色的溶液。',use:'不必先把鋅煉出來，酸就能直接把礦石裡的鋅溶出來，得到硫酸鋅。',note:'現代的鋅大多是這樣先溶成硫酸鋅，再用電把鋅鍍出來。'},
 {id:'zno_acid',name:'氧化鋅加稀硫酸',kind:'chem',at:'table',inputs:[['zno','h2so4']],out:{znso4:1},eq:'ZnO + H2SO4 -> ZnSO4 + H2O',phen:'白色粉末慢慢溶掉，留下無色的溶液。',use:'金屬氧化物 + 酸 → 鹽 + 水，和氧化銅加稀硫酸是同一類反應。鋅的鹽沒有顏色，不像銅那麼藍。',note:''},
 {id:'zno_hcl',name:'氧化鋅加鹽酸',kind:'chem',at:'table',inputs:[['zno','hcl']],out:{},eq:'ZnO + 2HCl -> ZnCl2 + H2O',phen:'白色粉末溶掉了，溶液清澈無色。',use:'金屬氧化物 + 酸 → 鹽 + 水。生成的是氯化鋅。',note:''},
 {id:'cuo_hcl',name:'氧化銅加鹽酸',kind:'chem',at:'table',col:'#3fb39a',inputs:[['cuo','hcl']],out:{},eq:'CuO + 2HCl -> CuCl2 + H2O',phen:'黑色粉末溶掉，溶液變成藍綠色。',use:'和氧化銅加稀硫酸一樣，是金屬氧化物和酸反應。換成氯化銅，顏色偏綠一些。',note:''},
 {id:'rust_acid',name:'用酸洗掉鐵鏽',kind:'chem',at:'table',col:'#d9b23a',inputs:[['hematite','hcl'],['magnetite','hcl'],['hematite','h2so4'],['magnetite','h2so4']],out:{},eq:'Fe2O3 + 6HCl -> 2FeCl3 + 3H2O',phen:'紅褐色的粉末慢慢溶掉，溶液變成黃色。',use:'鐵鏽是鐵的氧化物，會被酸溶掉。工廠在鐵件上漆或鍍鋅之前，會先把它泡進酸裡「酸洗」除鏽。',note:'泡太久，酸會連底下的鐵一起吃掉，冒出氫氣。'},
 {id:'acid_rain',name:'石灰石泡亞硫酸',kind:'chem',at:'table',inputs:[['caco3','h2so3']],out:{co2:1},eq:'CaCO3 + H2SO3 -> CaSO3 + H2O + CO2',phen:'石灰石表面慢慢冒出細小的氣泡，摸起來粗粗的，被蝕出一個個小坑。',use:'燒煤、燒硫冒出的二氧化硫溶在雨水裡，就是酸雨。大理石雕像、石灰岩建築被酸雨一點一點溶掉，就是這個反應。',note:'工業革命以後，歐洲許多古老教堂的石雕被侵蝕得面目全非。'},
 {id:'h2so3_lime',name:'亞硫酸加石灰水',kind:'chem',at:'table',ppt:1,inputs:[['h2so3','limewater']],out:{},eq:'H2SO3 + Ca(OH)2 -> CaSO3 + 2H2O',phen:'混合後出現白色混濁。',use:'酸鹼中和，生成難溶的亞硫酸鈣。發電廠的煙囪就是用石灰漿把二氧化硫抓下來，減少酸雨。',note:''},
 {id:'metal_vinegar',name:'金屬泡醋',kind:'chem',at:'table',inputs:[['iron','vinegar'],['sponge','vinegar'],['pigiron','vinegar'],['zinc','vinegar']],out:{h2:1},eq:'Zn + 2CH3COOH -> Zn(CH3COO)2 + H2',phen:'過了好一陣子，金屬表面才冒出零星的小氣泡。',use:'醋是弱酸，比氫活潑的金屬一樣能把它的氫趕出來，只是慢得多。用鐵鍋煮醋會溶出一點鐵，就是這個道理。',note:''},
 {id:'sn_cuso4',name:'錫放進硫酸銅溶液',kind:'chem',at:'table',inputs:[['tin','cuso4']],out:{copper:1},eq:'Sn + CuSO4 -> SnSO4 + Cu',phen:'銀白色的錫表面慢慢鍍上一層紅色的銅，藍色變淡了。',use:'錫比銅活潑，也能把銅從溶液裡趕出來，只是比鐵和鋅慢。',note:''},
 {id:'zn_vitriol',name:'鋅放進綠礬溶液',kind:'chem',at:'table',inputs:[['zinc','vitriol','water']],out:{znso4:1},eq:'Zn + FeSO4 -> ZnSO4 + Fe',phen:'鋅片表面長出一層黑色的細粉，淺綠色的溶液慢慢褪成無色。',use:'鋅比鐵活潑，把鐵從溶液裡趕了出來。析出的鐵是極細的黑色粉末，收集不起來。',note:'鍍鋅的鐵皮不容易生鏽，也是因為鋅比鐵活潑：要被氧化，鋅會先頂上去。'},
 {id:'obs_no_displace',name:'不夠活潑的金屬',kind:'obs',at:'table',inputs:[['copper','znso4'],['iron','znso4'],['sponge','znso4'],['tin','znso4'],['copper','vitriol','water']],out:{},eqx:'（沒有反應）',phen:'泡了很久，金屬表面還是亮亮的，溶液顏色也沒變。',use:'金屬只能把「比自己不活潑」的金屬從溶液裡趕出來。活性大小：鉀 > 鈉 > 鋅 > 鐵 > 錫 > 氫 > 銅。銅趕不動鋅和鐵，鐵和錫也趕不動鋅。',note:'材料沒有壞，撈起來還能再用。'},
 {id:'cu_oh',name:'硫酸銅加強鹼',kind:'chem',at:'table',ppt:1,col:'#4a90d9',inputs:[['naoh','cuso4'],['koh','cuso4']],out:{},eq:'CuSO4 + 2NaOH -> Cu(OH)2 + Na2SO4',phen:'藍色溶液裡立刻生成一團一團淺藍色、像棉絮一樣的沉澱。',use:'銅離子和氫氧根結合成不溶於水的氫氧化銅，就沉了下來。要檢驗溶液裡有沒有銅，常用這一招。',note:'把這團藍色沉澱加熱，會變成黑色的氧化銅。'},
 {id:'bordeaux',name:'調製波爾多液',kind:'chem',at:'table',ppt:1,col:'#7fb6e0',inputs:[['limewater','cuso4'],['slaked','cuso4']],out:{},eq:'CuSO4 + Ca(OH)2 -> Cu(OH)2 + CaSO4',phen:'藍色溶液變成一缸天藍色、糊糊的懸濁液。',use:'1880 年代，法國波爾多的葡萄園在路邊的葡萄上噴石灰和硫酸銅，本來是要嚇阻路人偷摘，卻發現那些葡萄不長黴病。銅離子對黴菌有毒，石灰讓它黏在葉子上、不被雨沖走。這是人類最早的殺菌農藥之一，果農到現在還在用。',note:''},
 {id:'fe_oh',name:'綠礬加鹼',kind:'chem',at:'table',ppt:1,col:'#8a9a6a',inputs:[['naoh','vitriol'],['koh','vitriol'],['limewater','vitriol']],out:{},eq:'FeSO4 + 2NaOH -> Fe(OH)2 + Na2SO4',phen:'出現灰綠色的沉澱。放著放著，表面慢慢變成紅褐色。',use:'先生成灰綠色的氫氧化亞鐵；它碰到空氣裡的氧，又被氧化成紅褐色的氫氧化鐵——和鐵生鏽是同一家人。',note:''},
 {id:'zn_oh',name:'硫酸鋅加強鹼',kind:'chem',at:'table',ppt:1,col:'#f2f2ee',inputs:[['naoh','znso4'],['koh','znso4']],out:{},eq:'ZnSO4 + 2NaOH -> Zn(OH)2 + Na2SO4',phen:'無色溶液裡出現白色的沉澱。',use:'鋅離子遇到氫氧根，生成白色的氫氧化鋅。和銅（藍）、鐵（灰綠轉紅褐）比一比：看沉澱的顏色，就能猜出溶液裡是哪一種金屬。',note:''},
 {id:'cu_co3',name:'硫酸銅遇到碳酸鹽',kind:'chem',at:'table',ppt:1,col:'#3fae86',inputs:[['natron','cuso4'],['sodawater','cuso4'],['lye','cuso4'],['ash','cuso4']],out:{co2:1},eq:'2CuSO4 + 2Na2CO3 + H2O -> Cu2(OH)2CO3 + 2Na2SO4 + CO2',phen:'冒出一點氣泡，生成一團藍綠色的沉澱。',use:'這團沉澱是鹼式碳酸銅——和孔雀石、銅器上的銅綠是同一種東西。從礦石煉成的銅，又繞回了礦石。',note:'沉澱又細又少，撈不起來。'},
 {id:'sea_mg',name:'海水加鹼',kind:'chem',at:'table',ppt:1,col:'#eef2f2',inputs:[['seawater','limewater'],['seawater','slaked'],['seawater','naoh']],out:{},eq:'MgCl2 + Ca(OH)2 -> Mg(OH)2 + CaCl2',phen:'海水變得白白濁濁的，慢慢沉下一層白色的東西。',use:'海水裡除了食鹽，還溶著不少鎂。加了鹼，鎂就變成不溶的氫氧化鎂沉下來。1916 年起，美國就有工廠用石灰從海水裡撈出鎂，再電解成金屬鎂。',note:'這團白色沉澱又細又散，撈不起來。'},
 {id:'co2_koh',name:'氫氧化鉀吸收二氧化碳',kind:'chem',at:'table',inputs:[['co2','koh']],out:{lye:1},eq:'2KOH + CO2 -> K2CO3 + H2O',phen:'氣體被吸得一乾二淨，溶液看起來沒有任何變化。',use:'強鹼會把二氧化碳吸進去，變回碳酸鹽——氫氧化鉀又變回了草木灰水。所以強鹼要密封保存，放久了會「失效」。',note:'太空船和潛水艇裡，也是用強鹼把人呼出的二氧化碳吸掉。'},
 {id:'co2_naoh',name:'氫氧化鈉吸收二氧化碳',kind:'chem',at:'table',inputs:[['co2','naoh']],out:{natron:1},eq:'2NaOH + CO2 -> Na2CO3 + H2O',phen:'氣體被吸得一乾二淨。把溶液蒸乾，留下白色的粉末。',use:'氫氧化鈉吸收二氧化碳，變成碳酸鈉——就是天然鹼。燒鹼放久了會變成蘇打，所以要密封保存。',note:''},
 {id:'egg_ethanol',name:'雞蛋泡酒精',kind:'chem',at:'table',inputs:[['egg','ethanol']],out:{},eqx:'蛋白質 —(酒精)→ 凝固',phen:'透明的蛋白變成白色、不透明的固體。沒有加熱，蛋卻「熟」了。',use:'酒精和加熱一樣，會讓蛋白質變形、凝固。細菌也是由蛋白質組成的，所以酒精能殺菌。',note:'消毒用的酒精濃度約 75%；太濃反而只把細菌表面凝固，裡面殺不死。'},
 {id:'pidan',name:'用強鹼醃蛋',kind:'chem',at:'table',inputs:[['egg','naoh'],['egg','koh'],['egg','lye','slaked']],out:{},eqx:'蛋白質 —(強鹼)→ 凝固',phen:'泡了一陣子，蛋白變成透明的茶褐色果凍，蛋黃變成墨綠色。',use:'這就是皮蛋。強鹼和加熱、酒精一樣，能讓蛋白質變性凝固。傳統做法是用石灰、草木灰和鹽調成泥裹在蛋外面——石灰和草木灰在泥裡，就變成了氫氧化鉀。',note:'現實中要醃上一個月左右。'},
 {id:'soap_hard',name:'肥皂遇到硬水',kind:'chem',at:'table',ppt:1,inputs:[['soap','seawater'],['soap','limewater']],out:{},eqx:'肥皂（脂肪酸鈉）+ 鈣、鎂離子 → 皂垢（不溶於水）',phen:'怎麼搓都搓不出泡沫，水面浮起一層灰白色的渣。',use:'海水和石灰水裡有很多鈣、鎂離子，把肥皂變成不溶於水的鈣皂、鎂皂，就是浴室裡洗不掉的皂垢。含鈣、鎂多的水叫「硬水」。',note:'在海上用一般肥皂洗不乾淨，所以船上要用特製的「海水皂」。'},
 {id:'soap_acid',name:'肥皂遇到酸',kind:'chem',at:'table',inputs:[['soap','vinegar'],['soap','hcl']],out:{},eqx:'脂肪酸鈉 + 酸 → 脂肪酸（不溶於水）+ 鈉鹽',phen:'肥皂水變混濁，表面浮起一層油油的白色東西，再也搓不出泡沫。',use:'酸把肥皂變回不溶於水的脂肪酸，肥皂就失效了。肥皂水是鹼性的，碰到酸會被中和掉。',note:''},
 {id:'rust',name:'鐵泡在水裡',kind:'chem',at:'table',inputs:[['iron','water'],['sponge','water'],['iron','seawater'],['sponge','seawater'],['iron','brine']],out:{hematite:1},eq:'4Fe + 3O2 + 6H2O -> 4Fe(OH)3',phen:'放了一陣子，鐵的表面長出一層紅褐色、鬆鬆的鏽，一刮就掉。泡在鹽水裡的鏽得特別快。',use:'鐵同時碰到水和空氣裡的氧，就會生鏽。鐵鏽是含水的氧化鐵，脫了水就和赤鐵礦一樣——鐵又繞回了礦石。',note:'塗油、上漆、鍍鋅，都是為了把鐵和水、空氣隔開。現實中要放上好幾天。'},
 {id:'obs_insol',name:'放進水裡攪一攪',kind:'obs',at:'table',inputs:[['sand','water'],['quartz','water'],['caco3','water'],['sulfur','water'],['charcoal','water'],['oil','water'],['glass','water']],out:{},eqx:'（不溶於水）',phen:'攪了半天，東西還是原樣：沙和石頭沉在底下，硫磺粉和油浮在上面。',use:'不是每種東西都溶得進水。沙、石灰石、硫磺、木炭、油都不溶於水；食鹽、糖、天然鹼就溶得很快。能不能溶在水裡，是物質的特性之一。',note:'材料沒有壞，撈起來還能再用。'},
 {id:'obs_dissolve',name:'溶在水裡',kind:'obs',at:'table',inputs:[['natron','water'],['ethanol','water']],out:{},eqx:'（溶解，沒有產生新物質）',phen:'白色的天然鹼很快就溶得看不見了；酒精倒進水裡，一下就混在一起，分不出界線。',use:'溶解是物理變化：東西只是散進水裡，沒有變成新的物質。把水蒸發掉，就能拿回原來的東西。',note:'想用天然鹼溶液，就把天然鹼、淡水和其他材料一起放進陶缽。這次的材料沒有用掉。'},
 {id:'ind_neutral',name:'指示劑遇到中性的東西',kind:'chem',at:'table',col:'#8e44ad',inputs:[['indicator','water'],['indicator','brine'],['indicator','salt'],['indicator','ethanol'],['indicator','juice']],out:{},eqx:'紫色 → 紫色（中性）',phen:'紫色的指示劑一點也沒變。',use:'淡水、食鹽水、酒精、糖水都是中性的：不酸也不鹼。指示劑不變色，也是一種結果。',note:''},
 {id:'ind_carb',name:'指示劑檢驗天然鹼、草木灰',kind:'chem',at:'table',col:'#3f8f7a',inputs:[['indicator','natron'],['indicator','ash']],out:{},eqx:'紫色 → 藍綠色（鹼性）',phen:'粉末一溶進去，紫色就變成藍綠色。',use:'碳酸鈉和碳酸鉀是「鹽」，不是鹼；但它們溶在水裡會讓水變成鹼性。所以古人拿它們來洗衣服、做肥皂。',note:''},
 {id:'ind_soap',name:'指示劑檢驗肥皂水',kind:'chem',at:'table',col:'#4fa36a',inputs:[['indicator','soap']],out:{},eqx:'紫色 → 綠色（弱鹼性）',phen:'紫色的指示劑變成綠色。',use:'肥皂是強鹼和油做的，溶在水裡是弱鹼性。用肥皂洗太多次手會乾澀，就是這個原因。',note:''},
 {id:'ind_drink',name:'指示劑檢驗酒和可樂',kind:'chem',at:'table',col:'#c8508f',inputs:[['indicator','wine'],['indicator','cola']],out:{},eqx:'紫色 → 粉紅色（弱酸性）',phen:'紫色的指示劑變成粉紅色。',use:'酒放久了會變成醋，本來就帶一點酸；可樂裡溶著碳酸，也是酸的。很多飲料其實都偏酸。',note:''},
 {id:'ind_sea',name:'指示劑檢驗海水',kind:'chem',at:'table',col:'#6a5fb0',inputs:[['indicator','seawater']],out:{},eqx:'紫色 → 藍紫色（弱鹼性）',phen:'紫色只偏藍了一點點。',use:'海水是弱鹼性的。空氣中的二氧化碳越來越多，溶進海裡，海水正一點一點變酸，叫做「海洋酸化」，會讓貝殼和珊瑚長不好。',note:''},
 {id:'burn_h2_o2',lab:1,name:'氫氣在氧氣中燃燒',kind:'chem',at:'heat',T:300,inputs:[['h2','o2']],out:{water:1},eq:'2H2 + O2 -> 2H2O',phen:'淡藍色的火焰又尖又亮，瓶壁上很快凝滿水珠。',use:'在純氧裡，氫燒得更猛。氫和氧化合只生成水，沒有其他東西，所以氫被看作最乾淨的燃料。',note:'⚠️ 氫和氧事先混好再點火，會猛烈爆炸。'},
 {id:'h2_cl2',lab:1,name:'氫氣在氯氣中燃燒',kind:'chem',at:'heat',T:300,inputs:[['h2','cl2']],out:{hcl:1},eq:'H2 + Cl2 -> 2HCl',phen:'氫氣在黃綠色的氯氣裡安靜地燒，火焰是蒼白色的，瓶口冒出白霧。',use:'氫和氯化合成氯化氫，溶在水裡就是鹽酸。現代的鹽酸就是這樣做的：電解食鹽水同時得到氫氣和氯氣，再讓它們燒在一起。',note:'⚠️ 氫氣和氯氣事先混在一起，照到陽光就可能爆炸。'},
 {id:'h2_cuo',lab:1,name:'氫氣還原氧化銅',kind:'chem',at:'heat',T:300,inputs:[['cuo','h2']],out:{copper:1,water:1},eq:'CuO + H2 -> Cu + H2O',phen:'黑色粉末從邊緣開始變紅，管壁上出現水珠。',use:'氫氣和碳一樣能把氧搶走，自己變成水。被搶走氧的氧化銅還原成銅，氫氣則被氧化——這是最經典的氧化還原實驗之一。',note:'要先通一陣子氫氣把空氣趕走再加熱，否則可能爆炸。'},
 {id:'h2_fe',name:'氫氣還原鐵礦',kind:'chem',at:'heat',T:800,inputs:[['hematite','h2'],['magnetite','h2']],out:{sponge:1},eq:'Fe2O3 + 3H2 -> 2Fe + 3H2O',phen:'紅褐色的礦石變成灰黑色的海綿鐵。冒出來的不是二氧化碳，而是水蒸氣。',use:'用碳煉鐵會放出大量二氧化碳；改用氫，排出來的只有水。這就是現在各國正在試的「綠色煉鋼」。',note:'前提是氫氣得用不排碳的電來電解。'},
 {id:'na_cl2',lab:1,name:'鈉在氯氣中燃燒',kind:'chem',at:'heat',T:150,inputs:[['sodium','cl2']],out:{salt:1},eq:'2Na + Cl2 -> 2NaCl',phen:'熔化的鈉在黃綠色的氯氣裡燒出耀眼的黃色火焰，冒著白煙，瓶底積了一層白色粉末。',use:'白色粉末是氯化鈉——食鹽。一種碰到水就爆炸的金屬，加上一種有毒的氣體，變成每天吃的鹽。化合物的性質，可以和組成它的元素完全不同。',note:'現實中非常危險，只能由專業人員示範。'},
 {id:'metal_cl2',lab:1,name:'金屬在氯氣中燃燒',kind:'chem',at:'heat',T:250,inputs:[['iron','cl2'],['sponge','cl2'],['copper','cl2']],out:{},eqx:'金屬 + 氯氣 → 金屬氯化物',phen:'燒熱的金屬伸進氯氣裡就燒了起來，冒出棕黃色的濃煙。',use:'氯氣非常活潑，連不太活潑的銅都能直接和它化合。鐵生成棕褐色的氯化鐵，銅生成棕黃色的氯化銅。',note:'現實中有毒，只能在通風櫥裡做。'},
 {id:'zn_o2',lab:1,name:'鋅在氧氣中燃燒',kind:'chem',at:'heat',T:420,fresh:1,inputs:[['zinc','o2']],out:{zno:1},eq:'2Zn + O2 -> 2ZnO',phen:'鋅燒出藍綠色的火焰，飄起一團團像棉絮的白色粉末。',use:'白色的是氧化鋅，鍊金術士叫它「哲學家的羊毛」。鋅好不容易才從氧化鋅煉出來，一碰到氧又燒回去——所以煉鋅一定要隔絕空氣。',note:''},
 {id:'fe_s',lab:1,name:'鐵和硫一起加熱',kind:'chem',at:'heat',T:300,inputs:[['iron','sulfur'],['sponge','sulfur']],out:{},eq:'Fe + S -> FeS',phen:'混合物的一端燒紅以後，紅光自己往另一端蔓延，就算把火移開也不停。冷卻後是一塊黑色、磁鐵吸不起來的東西。',use:'鐵和硫化合成硫化亞鐵。原本鐵會被磁鐵吸、硫是黃色的；化合以後，兩種性質都不見了——這就是化合物和混合物的差別。',note:'這個反應會放熱，一點燃就能自己進行下去。'},
 {id:'cu_s',lab:1,name:'銅和硫一起加熱',kind:'chem',at:'heat',T:300,inputs:[['copper','sulfur']],out:{},eq:'2Cu + S -> Cu2S',phen:'紅色的銅在硫蒸氣裡發出紅光，變成黑色、一敲就碎的東西。',use:'銅和硫化合成硫化亞銅。很多銅礦本來就是銅和硫的化合物，要先在空氣裡燒掉硫，才煉得出銅。',note:''},
 {id:'heat_carbonic',name:'加熱碳酸水',kind:'chem',at:'heat',T:60,pot:1,inputs:[['carbonic']],out:{co2:1,water:1},eq:'H2CO3 -> CO2 + H2O',phen:'還沒煮開，水裡就冒出一大堆氣泡；嚐一口，已經不酸了。',use:'碳酸很不穩定，溫度一高，二氧化碳就跑出來。汽水放在太陽下會沒氣，就是這樣。',note:''},
 {id:'boil_lye',name:'煮乾草木灰水',kind:'phys',at:'heat',T:100,pot:1,defer:['soap_ash'],inputs:[['lye']],out:{ash:1},eqx:'草木灰水 → 碳酸鉀（鉀鹼）+ 水蒸氣',phen:'水越煮越少，鍋底剩下一層灰白色的硬殼。',use:'灰水煮乾留下的，是比草木灰純得多的碳酸鉀。英文的 potash（鉀鹼）就是「鍋子（pot）裡的灰（ash）」；1807 年戴維從它裡面抓出一種新金屬，就取名叫 potassium——鉀。',note:'這份白色的粉末和草木灰的主要成分一樣，可以當草木灰用。'},
 {id:'ester',name:'酯化反應',kind:'chem',at:'heat',T:70,pot:1,inputs:[['ethanol','vinegar','h2so4']],out:{},eq:'CH3COOH + C2H5OH -> CH3COOC2H5 + H2O',phen:'燒瓶裡飄出一股甜甜的水果香，液面上浮著一層油狀的液體。',use:'酸和醇反應，生成「酯」和水。硫酸在這裡當催化劑，讓反應快一點。水果和花的香味，很多都是酯。',note:'乙酸乙酯也是去光水、膠水裡常見的溶劑。'},
 {id:'obs_soap_dry',name:'乾的鹼粉和油一起煮',kind:'obs',at:'heat',T:90,pot:1,not:['water','sodawater','lye','koh','naoh'],inputs:[['oil','natron'],['oil','ash']],out:{},eqx:'（少了水，反應起不來）',phen:'油在鍋裡滋滋作響，白色的粉末沉在鍋底，怎麼攪都只是油裡混著粉。',use:'天然鹼和草木灰要先溶在水裡，才會變成鹼性的溶液，去「咬」油脂。加一份淡水再試試。',note:''},
 {id:'tech_tepui',name:'平頂山與天使瀑布',kind:'tech',inputs:[],out:{},eqx:'整片砂岩高原 —(流水切割、侵蝕上億年)→ 四面懸崖的平頂山',phen:'雲頂島的山頂平得像一張桌子，四周是筆直的懸崖，雲就繞在半山腰。一道瀑布從平台邊緣一躍而下，還沒落到海面，就散成了一大片白霧。',use:'平頂山原本是一整片砂岩高原，被雨水和河流一點一點切開，最後只留下一座座四面都是懸崖的「桌山」。山頂和山下隔著幾百公尺的岩壁，動植物各自演化，彷彿另一個世界。瀑布落得太高，水在半空中被風吹散、蒸發，到了底下常常只剩水霧。',note:'南美洲圭亞那高原上的平頂山，當地人叫它 tepui，意思是「神的居所」。天使瀑布從奧揚特普伊山落下約 979 公尺，是世界上落差最大的瀑布。柯南．道爾的小說《失落的世界》，靈感就來自這一帶的平頂山。'},
 {id:'tech_airship',name:'氫氣飛艇',kind:'tech',inputs:[],out:{},eqx:'浮力（氫氣）＋ 推力（電動機）',phen:'電動機一轉，螺旋槳把飛艇推向前方。你轉動舵，它就乖乖轉向。',use:'氫氣是最輕的氣體，密度只有空氣的十四分之一，不用加熱就浮得起來。可是氣球只會隨風飄——想要往哪裡就去哪裡，得加上推力。電池推動電動機，電動機轉動螺旋槳，化學能變成電能，再變成動能。',note:'1783 年查理教授做出第一個氫氣球；1884 年法國的「法蘭西號」用電池和電動機推動，成了第一艘能飛回出發點的飛艇。氫氣遇火會爆炸：1785 年羅齊耶把熱氣球和氫氣球綁在一起，飛到半空起火喪命；1937 年興登堡號飛艇著火後，載人飛行就改用不會燒的氦氣。'},
 {id:'tech_bleach',name:'漂白水為什麼能殺菌',kind:'tech',inputs:[],out:{},eqx:'次氯酸根 → 破壞細菌的細胞',phen:'用稀釋的漂白水把發酵罐、木杓和桌面泡過一遍，再用清水沖乾淨。',use:'漂白水裡的次氯酸根是很強的氧化劑，會破壞細菌的細胞膜和酵素。肥皂是把細菌連同油汙一起帶走，漂白水是直接把細菌殺死，所以效果撐得更久。但它也會傷皮膚，所以拿來消毒器具，不拿來洗手。',note:'自來水廠和游泳池用的，也是含氯的消毒劑。'},
 {id:'distill_soda',name:'蒸餾鹼湖水',kind:'phys',at:'still',T:100,inputs:[['sodawater']],out:{water:1,natron:1},eqx:'鹼湖水 —(蒸餾)→ 淡水 ＋ 天然鹼（碳酸鈉）',phen:'燒瓶裡的湖水沸騰，冷凝管滴下清澈的淡水；燒瓶底留下一層白色的結晶。',use:'水會變成水蒸氣，碳酸鈉不會。蒸氣冷凝回來就是淡水，碳酸鈉留在燒瓶裡——和蒸餾海水得到淡水和食鹽是同一個道理。',note:'這座湖沒有出口，水只能蒸發，鹼就越積越濃。坦尚尼亞火山腳下的納特龍湖就是這樣，「natron」這個字就從那裡來。'},
 {id:'boil_soda',name:'煮乾鹼湖水',kind:'phys',at:'heat',T:100,pot:1,defer:['distill_soda'],inputs:[['sodawater']],out:{natron:1},eqx:'鹼湖水 → 天然鹼 ＋ 水蒸氣',phen:'水越煮越少，鍋底結出一層白色、摸起來滑滑的結晶。',use:'水蒸發掉了，溶在裡面的碳酸鈉留了下來。湖邊那一圈白色的結晶，也是太陽這樣曬出來的。',note:''},
 {id:'ind_soda',name:'指示劑檢驗鹼湖水',kind:'chem',at:'table',col:'#3f8f7a',inputs:[['indicator','sodawater']],out:{},eqx:'紫色 → 藍綠色（鹼性）',phen:'紫色的汁液變成了藍綠色。',use:'鹼湖水裡溶著碳酸鈉，是鹼性的。火山灰裡的鈉在水裡慢慢風化成碳酸鈉，湖又沒有出口，鹼就越積越多。',note:''},
 {id:'distill_acidlake',name:'蒸餾酸湖水',kind:'phys',at:'still',T:110,inputs:[['acidlake']],out:{hcl:1,h2so4:1},eqx:'酸湖水 —(蒸餾)→ 鹽酸（先揮發、被冷凝接住）＋ 稀硫酸（留在燒瓶裡）',phen:'加熱沒多久，冷凝管先滴下刺鼻的液體——是鹽酸。燒瓶裡剩下的，是不太會揮發的稀硫酸。',use:'氯化氫很容易揮發，一加熱就跟著水蒸氣跑出來；硫酸幾乎不揮發，留在原地。利用沸點不同，就能把混在一起的兩種酸分開。',note:'這和「食鹽加硫酸蒸餾出鹽酸」是同一個道理：不揮發的酸留下，揮發的酸跑出來。'},
 {id:'boil_acidlake',name:'沒接冷凝管就煮酸湖水',kind:'phys',at:'heat',T:110,pot:1,defer:['distill_acidlake'],inputs:[['acidlake']],out:{h2so4:1},eqx:'酸湖水 → 稀硫酸 ＋（鹽酸散到空氣裡）',phen:'鍋子冒出刺鼻的白霧，嗆得你直咳嗽。剩下的液體比原本更酸、更黏稠。',use:'鹽酸揮發掉了，沒有冷凝管接住；硫酸不揮發，留在鍋子裡。',note:'想要連鹽酸一起留下，得接上冷凝管。'},
 {id:'ind_acidlake',name:'指示劑檢驗酸湖水',kind:'chem',at:'table',col:'#d0305a',inputs:[['indicator','acidlake']],out:{},eqx:'紫色 → 鮮紅色（強酸性）',phen:'紫色的汁液一下子變成鮮紅色。',use:'酸湖水裡有硫酸和鹽酸，都是強酸。',note:'山腳下的湖會讓同一種汁液變成藍綠色。'},
 {id:'acid_soda',name:'酸湖水倒進鹼湖水',kind:'chem',at:'table',inputs:[['acidlake','sodawater']],out:{co2:1},eqx:'硫酸、鹽酸 ＋ 碳酸鈉 → 鈉鹽 ＋ 水 ＋ 二氧化碳',phen:'兩罐湖水一碰到，就嘶嘶地冒出大量氣泡，最後變成一罐溫和的鹹水。',use:'酸遇到碳酸鹽，會放出二氧化碳，酸和鹼也互相抵消了。山頂的酸和山腳的鹼，在你手上中和了。',note:''},
 {id:'burn_s',name:'硫在空氣中燃燒',kind:'chem',at:'still',open:1,T:250,defer:['burn_s_o2','fe_s','cu_s'],inputs:[['sulfur']],out:{so2:1},eq:'S + O2 -> SO2',phen:'黃色的硫磺熔成褐色的液體，冒出淡藍色、很小的火焰，還有一股刺鼻的臭味。',use:'硫和空氣裡的氧結合，變成二氧化硫。空氣裡的氧不多，火焰又小又淡。',note:'現實中要在通風櫥裡做，二氧化硫有毒。'},
 {id:'burn_s_o2',name:'硫在氧氣中燃燒',kind:'chem',at:'still',open:1,T:250,inputs:[['sulfur','o2']],out:{so2:1},eq:'S + O2 -> SO2',phen:'硫磺一伸進氧氣裡，立刻燒出明亮的藍紫色火焰！',use:'和在空氣中燒是同一個反應，產物也一樣。氧氣越濃，燒得越劇烈、越亮。',note:'比一比木炭、鐵在空氣和氧氣中燃燒的樣子。'},
 {id:'obs_s_open',name:'在露天的火上燒硫磺',kind:'obs',at:'heat',air:1,T:250,lose:['sulfur'],inputs:[['sulfur']],out:{},eqx:'S + O₂ → SO₂（散到空氣裡）',phen:'硫磺冒出藍色的小火焰，一股刺鼻的臭味嗆得你直咳嗽，但什麼也沒接住。',use:'燒出來的二氧化硫是氣體，直接散掉了。要收集它，得在實驗桌上用燒瓶來燒。',note:''},
 {id:'sulfurous',name:'二氧化硫溶進水裡',kind:'chem',at:'table',inputs:[['so2','water']],out:{h2so3:1},eq:'SO2 + H2O -> H2SO3',phen:'刺鼻的氣體溶進水裡，水看起來沒什麼變化，但聞起來是酸的。',use:'非金屬的氧化物溶在水裡，大多會變成酸：二氧化碳變成碳酸，二氧化硫變成亞硫酸。',note:'燒煤、燒石油會放出二氧化硫，溶進雨水裡，就是酸雨。'},
 {id:'ind_h2so3',name:'指示劑檢驗亞硫酸',kind:'chem',at:'table',col:'#c23d74',inputs:[['indicator','h2so3']],out:{},eqx:'紫色 → 紅色（酸性）',phen:'紫色的汁液變成紅色，比碳酸水紅得多。',use:'亞硫酸也是弱酸，但比碳酸強一些。',note:''},
 {id:'heat_h2so3',name:'加熱亞硫酸',kind:'chem',at:'heat',T:60,pot:1,inputs:[['h2so3']],out:{so2:1,water:1},eq:'H2SO3 -> SO2 + H2O',phen:'還沒煮開，就冒出一股刺鼻的氣體。',use:'亞硫酸很不穩定，一加熱就分解回二氧化硫和水——和碳酸一加熱就放出二氧化碳一樣。',note:''},
 {id:'so2_limewater',name:'二氧化硫通進石灰水',kind:'chem',at:'table',ppt:1,inputs:[['so2','limewater']],out:{},eq:'SO2 + Ca(OH)2 -> CaSO3 + H2O',phen:'澄清的石灰水變得白白濁濁的。',use:'二氧化硫也會讓石灰水變混濁，生成不溶於水的亞硫酸鈣。',note:'所以「石灰水變混濁」只能說可能是二氧化碳。要分辨，還得聞聞看——二氧化硫有刺鼻的臭味，二氧化碳沒有。'},
 {id:'obs_sodawater',name:'用鹼湖水代替淡水',kind:'obs',at:'none',inputs:[],out:{},eqx:'（反應被鹼打亂了）',phen:'東西是混在一起了，可是摸起來滑滑的，嚐起來又苦又澀，和預期的完全不一樣。',use:'鹼湖水裡溶著大量的碳酸鈉，不是淡水。很多反應遇到鹼就走樣了。要淡水，得把鹼湖水蒸餾，或從別的島帶過來。',note:''},
 /* ===== 電解槽 ===== */
 {id:'electro_water',name:'電解水',kind:'chem',at:'cell',V:2,back:1,inputs:[['water','h2so4'],['water','naoh'],['water','koh'],['water','natron'],['water','lye'],['water','limewater'],['h2so4'],['naoh'],['koh'],['lye'],['limewater'],['water','sodawater'],['sodawater']],out:{h2:2,o2:1},eq:'2H2O -> 2H2 + O2',phen:'兩極都冒出氣泡，負極的氣體體積是正極的 2 倍。',use:'水被電分解成氫氣和氧氣，體積比 2：1。',note:'加進去的酸、鹼（或碳酸鈉這類鹽）只是幫助導電，沒有被消耗，所以會還給你。但不是每種電解質都這樣——換成食鹽或鹽酸，正極出來的就不是氧氣了。1800 年，伏打電堆發明後幾個星期，就有人完成了這個實驗。'},
 {id:'electro_brine',name:'電解食鹽水',kind:'chem',at:'cell',V:3,inputs:[['brine'],['seawater'],['water','salt'],['water','brine']],out:{naoh:1,h2:1,cl2:1},eq:'2NaCl + 2H2O -> 2NaOH + H2 + Cl2',phen:'兩極都冒出氣泡，其中一邊的氣體是黃綠色、有刺鼻味。',use:'氯鹼工業：漂白水、鹽酸、做肥皂用的氫氧化鈉都從這裡來。',note:'氯氣有毒！現實中只能在通風櫥裡進行。'},
 {id:'electro_cuso4',name:'電解硫酸銅溶液',kind:'chem',at:'cell',V:1,inputs:[['cuso4'],['water','cuso4']],out:{copper:1,o2:1,h2so4:1},eq:'2CuSO4 + 2H2O -> 2Cu + O2 + 2H2SO4',phen:'負極長出一層紅色的銅，正極冒出氣泡，藍色慢慢變淡。',use:'電可以把溶液裡的銅離子變回金屬銅。電鍍和精煉銅都用這個原理。',note:'這是使用碳棒電極的情況。'},
 {id:'electro_hcl',name:'電解鹽酸',kind:'chem',at:'cell',V:2,inputs:[['hcl'],['water','hcl']],out:{h2:1,cl2:1},eq:'2HCl -> H2 + Cl2',phen:'負極冒出無色的氣泡，正極冒出黃綠色、有刺鼻味的氣體。',use:'鹽酸被電拆成氫氣和氯氣，正好是「氯化氫」這個名字裡的兩種元素。',note:'和電解稀硫酸比一比：同樣是酸，硫酸根留在水裡不動，氯離子卻會在正極變成氯氣。氯氣有毒！'},
 {id:'electro_znso4',name:'電解硫酸鋅溶液',kind:'chem',at:'cell',V:3,inputs:[['znso4'],['water','znso4']],out:{zinc:1,o2:1,h2so4:1},eq:'2ZnSO4 + 2H2O -> 2Zn + O2 + 2H2SO4',phen:'負極慢慢長出一層銀灰色的鋅，也夾著一些小氣泡；正極冒出氣泡。',use:'現代的鋅大多就是這樣電解出來的，不必再把鋅燒成蒸氣。',note:'鋅比氫活潑，照理說負極應該先冒氫氣。但氫氣在鋅的表面很難生成，所以鋅還是鍍得出來，只是效率不到百分之百。'},
 {id:'molten_koh',name:'電解熔融的氫氧化鉀',kind:'chem',at:'still',open:1,T:400,V:6,inputs:[['koh_s']],out:{potassium:1,o2:1},eq:'4KOH -> 4K + O2 + 2H2O',phen:'白色的固體熔成一灘透明的液體。接上電極，負極冒出一顆顆銀亮的小珠子，有的一碰到空氣就噗地燒出紫色的火焰。',use:'在水溶液裡，電只會把水拆開，鉀始終留在水裡。把水趕走、讓它自己熔化，電才終於把鉀抓出來。鉀太活潑，碳搶不走它的氧，只有電辦得到。',note:'1807 年，戴維用兩百多片金屬板疊成的大電池，電解熔融的苛性鉀（氫氧化鉀），第一次看見金屬鉀。據說他高興得在實驗室裡跳起舞來。幾天後，他用同樣的方法從苛性鈉得到了鈉。'},
 {id:'molten_naoh',name:'電解熔融的氫氧化鈉',kind:'chem',at:'still',open:1,T:350,V:6,inputs:[['naoh_s']],out:{sodium:1,o2:1},eq:'4NaOH -> 4Na + O2 + 2H2O',phen:'白色的固體熔成透明的液體。接上電極，負極浮出銀亮的小珠子，偶爾竄出黃色的火焰。',use:'和鉀一樣，鈉也只能用電從熔化的化合物裡抓出來。',note:'這個方法後來成了工業製鈉的做法。現在改成電解熔融的食鹽，但那需要 800 °C 以上的爐子。'},
 {id:'alkali_acid',name:'把鈉或鉀丟進酸裡',kind:'chem',at:'table',hot:1,boom:1,inputs:[['sodium','hcl'],['sodium','h2so4'],['sodium','vinegar'],['sodium','acidlake'],['potassium','hcl'],['potassium','h2so4'],['potassium','vinegar'],['potassium','acidlake']],out:{},eq:'2Na + 2HCl -> 2NaCl + H2',phen:'金屬一碰到酸，「砰」一聲炸開！火光一閃，酸液和碎片噴得到處都是，杯子也裂了。',use:'鈉和鉀連水裡的氫都搶得走；酸裡可以搶的氫更多、更容易搶，反應快到一瞬間就放出大量的熱和氫氣，氫氣再被點燃——就成了爆炸。這兩份材料都炸飛了，什麼也沒留下。',note:'⚠️ 現實中絕對不可以這樣做！鈉、鉀碰到水或酸都可能爆炸，噴出的強鹼和酸會灼傷眼睛和皮膚。戴維一生做過許多危險的實驗，1812 年還在一次化學爆炸中傷了眼睛。'},
 {id:'dry_naoh',name:'蒸乾氫氧化鈉溶液',kind:'phys',at:'heat',T:100,pot:1,defer:['soap'],inputs:[['naoh']],out:{naoh_s:1},eqx:'氫氧化鈉溶液 → 氫氧化鈉（固體）＋ 水蒸氣',phen:'水越煮越少，鍋底留下一層白色、半透明的固體。',use:'和煮海水得到食鹽一樣：水跑掉了，溶在裡面的東西留下來。這就是燒鹼。要讓它熔化，還得燒到三百多度。',note:'固體燒鹼放在空氣裡會吸水變得濕黏，還會吸收二氧化碳變質，要密封保存。'},
 {id:'dry_koh',name:'蒸乾氫氧化鉀溶液',kind:'phys',at:'heat',T:100,pot:1,defer:['soap'],inputs:[['koh']],out:{koh_s:1},eqx:'氫氧化鉀溶液 → 氫氧化鉀（固體）＋ 水蒸氣',phen:'水越煮越少，鍋底留下一層白色的固體。',use:'水跑掉了，溶在裡面的苛性鉀留下來。要讓它熔化，還得燒到三百多度。',note:'苛性鉀比燒鹼還會吸水，放在空氣裡一下子就變得濕濕黏黏。'},
 {id:'dissolve_naoh',name:'把燒鹼溶進水裡',kind:'phys',at:'table',hot:1,inputs:[['naoh_s','water']],out:{naoh:1},eqx:'氫氧化鈉（固體）+ 水 → 氫氧化鈉溶液（放熱）',phen:'白色固體一溶進水裡，杯子馬上變得燙手。',use:'溶解是物理變化，卻可以放出大量的熱。所以稀釋強鹼要慢慢加，現實中還要戴手套和護目鏡。',note:''},
 {id:'dissolve_koh',name:'把苛性鉀溶進水裡',kind:'phys',at:'table',hot:1,inputs:[['koh_s','water']],out:{koh:1},eqx:'氫氧化鉀（固體）+ 水 → 氫氧化鉀溶液（放熱）',phen:'白色固體一溶進水裡，杯子馬上變得燙手。',use:'溶解是物理變化，卻可以放出大量的熱。所以稀釋強鹼要慢慢加，現實中還要戴手套和護目鏡。',note:''},
 /* ===== 霧裡小島的香氣 ===== */
 {id:'camphor_dist',name:'蒸餾樟木片',kind:'phys',at:'still',T:100,inputs:[['camphorwood','water']],out:{camphor:1},eqx:'樟木片 + 水蒸氣 → 樟腦（在冷凝管裡結晶）',phen:'水蒸氣帶著一股濃濃的樟腦味穿過樟木片。冷凝管的內壁和接收瓶口，慢慢結出一層雪白的晶體。',use:'這叫水蒸氣蒸餾：樟腦被水蒸氣一路帶出來，到了冷的地方，沒有先變成液體，就直接凝成固體——這是「凝華」，正好是昇華倒過來。',note:'十九世紀末，臺灣的樟腦產量曾經佔全世界的大半，被稱為「樟腦王國」。樟腦是早期塑膠「賽璐珞」的原料，也拿來防蟲。'},
 {id:'citro_dist',name:'蒸餾香茅',kind:'phys',at:'still',T:100,inputs:[['citronella','water']],out:{citroil:1},eqx:'香茅 + 水蒸氣 → 香茅油 + 水（冷凝後分成兩層）',phen:'接收瓶裡的液體分成兩層：底下是清水，上面浮著一層淡黃色、帶著檸檬香的油。',use:'水蒸氣蒸餾：香茅油的沸點比水高、也不溶於水，卻會被水蒸氣一起帶出來。冷凝以後油比水輕，浮在上面，把上層倒出來就分開了。',note:'1950 年代，臺灣的香茅油產量是世界第一，大多拿去做香皂和防蚊液。'},
 {id:'vanilla_ext',name:'用酒精萃取香草',kind:'phys',at:'table',inputs:[['vanilla','ethanol']],out:{vanillaext:1},eqx:'香草莢 + 酒精 → 香草精（萃取）',phen:'黑褐色的香草莢泡在酒精裡，透明的酒精慢慢染成琥珀色，香味越來越濃。',use:'這叫萃取：香草的香味分子（香草醛）在酒精裡溶得比在水裡好，就被「拉」進了酒精。泡茶、泡咖啡也是萃取，只是用的是熱水。',note:'香草是一種蘭花的果莢。1841 年，留尼旺島上一個 12 歲的奴隸少年愛德蒙，發明了用手替香草蘭授粉的方法，香草才能在原產地墨西哥以外大量種植。'},
 {id:'obs_vanilla_water',name:'香草莢泡水',kind:'obs',at:'table',inputs:[['vanilla','water']],out:{},eqx:'（香味分子不太溶於水）',phen:'泡了半天，水只沾上一點點淡淡的香味，顏色幾乎沒變。',use:'香草醛在水裡溶得不多。要把香味「拉」出來，得換一種更溶得了它的液體。',note:'材料沒有壞，撈起來還能再用。'},
 {id:'obs_camphor_sub',name:'加熱樟腦',kind:'obs',at:'heat',T:60,pot:1,fresh:1,lose:['camphor'],inputs:[['camphor']],out:{},eqx:'樟腦（固體）→ 樟腦（氣體）',phen:'白色的晶體沒有熔成液體，就一縷一縷變成氣體散掉了，整間屋子都是樟腦味。',use:'這叫昇華：固體直接變成氣體。衣櫃裡的樟腦丸越放越小，也是這個道理。',note:''},
 {id:'obs_lens_quartz',name:'用整塊石英磨玻璃',kind:'obs',at:'table',inputs:[['glass','quartz']],out:{},eqx:'（磨不動）',phen:'石英在玻璃上刮出幾道細細的刮痕，可是磨了半天，玻璃還是平的。',use:'石英確實比玻璃硬，但整塊太大了，只刮得出刮痕，磨不出光滑的弧面。',note:'材料沒有壞，撈起來還能再用。'},
 {id:'k_water',name:'把鉀丟進水裡',kind:'chem',at:'table',hot:1,inputs:[['potassium','water']],out:{koh:1,h2:1},eq:'2K + 2H2O -> 2KOH + H2',phen:'鉀浮在水面上四處亂竄，嘶嘶作響，冒出紫色的火焰！',use:'鉀活潑到連水裡的氫都搶得出來，自己又變回氫氧化鉀。所以自然界找不到金屬鉀，只找得到它的化合物。',note:'現實中非常危險，只能用米粒大小，而且要有防護。'},
 {id:'na_water',name:'把鈉丟進水裡',kind:'chem',at:'table',hot:1,inputs:[['sodium','water']],out:{naoh:1,h2:1},eq:'2Na + 2H2O -> 2NaOH + H2',phen:'鈉熔成一顆銀色的小球，在水面上快速游動，嘶嘶冒氣，越來越小。',use:'鈉和水反應，放出氫氣，自己變成氫氧化鈉。反應比鉀溫和一些：同一族的金屬，越往下越活潑。',note:'現實中同樣危險。'},
 /* ===== 有意義的「失敗」 ===== */
 {id:'obs_clay',name:'火不夠旺的土坯',kind:'obs',at:'heat',T:150,failOf:'pottery',inputs:[['clay']],out:{},eqx:'只是乾了',phen:'土坯變乾、變硬了一點，但丟進水裡又化成一攤泥。',use:'只是水分蒸發（物理變化），黏土還是黏土。要讓它真的變成陶，溫度得再高——多放些木頭，讓火更旺。',note:''},
 {id:'obs_lime_fire',name:'溫度不夠的貝殼',kind:'obs',at:'heat',T:300,failOf:'calcine',inputs:[['caco3']],out:{},eqx:'沒有變化',phen:'被燻黑了，但敲開來還是原本的樣子。',use:'溫度不夠。營火的熱都散到空氣裡了——得用能把熱留住的窯，而且柴要夠多。',note:''},
 {id:'obs_cu_kiln',lose:['charcoal','coke','coal'],name:'溫度不夠的氧化銅與木炭',kind:'obs',at:'heat',T:500,failOf:'smelt_cu',inputs:[['cuo','charcoal'],['cuo','coke'],['cuo','coal']],out:{},eqx:'反應不完全',phen:'只有零星幾點紅色，大部分還是黑色粉末。',use:'溫度不夠高。需要送進更多空氣，讓火燒得更猛。',note:''},
 {id:'obs_fe_kiln',lose:['charcoal'],name:'溫度不夠的鐵礦與木炭',kind:'obs',at:'heat',T:700,failOf:'smelt_fe',inputs:[['hematite','charcoal'],['magnetite','charcoal']],out:{},eqx:'沒有變化',phen:'礦石燒得通紅，冷卻後還是原來的顏色。',use:'還原鐵的氧化物需要 1200 °C 以上，比煉銅更高。用木炭當燃料，而且鼓風不能停。',note:''},
 {id:'obs_cuo',name:'單獨加熱氧化銅',kind:'obs',at:'heat',T:700,alone:1,inputs:[['cuo']],out:{},eqx:'沒有變化',phen:'黑色粉末燒得通紅，冷卻後還是黑色。',use:'光加熱沒有用，還需要一種能把氧「搶走」的物質。',note:''},
 {id:'obs_sand',name:'單獨加熱石英砂',kind:'obs',at:'heat',T:900,alone:1,inputs:[['sand'],['quartz']],out:{},eqx:'沒有變化',phen:'沙子燒得發紅，卻一點也沒有熔化。',use:'二氧化矽的熔點高達 1700 °C。需要加入能降低熔點的東西（助熔劑）。',note:''},
 {id:'obs_coal_iron',name:'用煤直接煉鐵',kind:'obs',at:'heat',inputs:[],out:{},eqx:'鐵 + 硫 → 脆鐵',phen:'鐵是煉出來了，但燒紅後一敲就裂成碎塊。',use:'煤裡含有硫。硫混進鐵裡，鐵在高溫下就會變脆（叫做「熱脆」）。所以幾百年來，人們明知道煤比木炭便宜，卻沒辦法拿它煉鐵——直到有人想到先把煤裡的硫趕走。',note:''},
 {id:'obs_burn_air',name:'在通風的火裡悶東西',kind:'obs',at:'heat',T:300,air:1,lose:['wood','fiber','coal'],not:['hematite','magnetite','cuo','cassiterite','zno'],inputs:[['wood'],['fiber'],['coal']],out:{},eqx:'可燃物 + 氧氣 → 二氧化碳 + 灰（這是燃燒，不是乾餾）',phen:'空氣一灌進去，放在裡面的東西很快燒得一乾二淨，只剩一點灰。',use:'同樣是加熱，有沒有空氣差很多。空氣充足，東西會燒掉；隔絕空氣，氫和氧先跑掉，才會留下碳——這叫乾餾。鼓風爐和高爐不停灌進空氣，做不了乾餾；要找一個封得起來的地方。',note:'溫度太低燒不起來，溫度夠高又有氧就燒光。要留下碳，得同時做到「夠熱」和「沒有氧」。'},
 {id:'obs_zn_air',name:'在鼓風的爐子裡煉鋅',kind:'obs',at:'heat',T:950,air:1,lose:['zno','charcoal','coke','coal'],inputs:[['zno','charcoal'],['zno','coke'],['zno','coal']],out:{},eq:'2Zn + O2 -> 2ZnO',phen:'爐口竄出藍白色的火焰，四周落下一層白色的粉末。爐底什麼也沒有。',use:'鋅一煉出來就是蒸氣。鼓風爐裡到處是空氣，鋅蒸氣一碰到氧，就燒回白色的氧化鋅。煉鋅要在封閉、沒有空氣的地方，再把蒸氣引出來冷卻。',note:''},
 {id:'obs_pig_carbon',name:'和碳一起再燒的生鐵',kind:'obs',at:'heat',T:1400,fresh:1,inputs:[['pigiron','coke'],['pigiron','charcoal'],['pigiron','coal']],out:{},eqx:'沒有變化',phen:'生鐵熔了又凝固。敲一下，還是一樣脆。',use:'爐料裡還有碳，鐵水裡的碳就燒不掉，甚至吸得更多。要讓碳離開，爐料裡就不能再放碳——只留生鐵，然後用力鼓風。',note:''},
 {id:'obs_pig_low',lose:['coke'],name:'溫度不夠的高爐料',kind:'obs',at:'heat',T:900,failOf:'pig_iron',inputs:[['hematite','coke','caco3'],['hematite','coke','quicklime'],['magnetite','coke','caco3'],['magnetite','coke','quicklime']],out:{},eqx:'沒有鐵水流出來',phen:'爐料燒得通紅，卻沒有熔化。',use:'要讓鐵熔成鐵水得超過 1400 °C。舊的鼓風爐太矮、散熱太快；燃料也要用焦炭，而且風不能停。',note:''},
 {id:'obs_zn_open',lose:['zno','charcoal','coke','coal'],name:'沒有冷凝管的煉鋅',kind:'obs',at:'heat',T:950,failOf:'smelt_zn',failNeeds:1,inputs:[['zno','charcoal'],['zno','coke'],['zno','coal']],out:{},eqx:'沒有金屬留下',phen:'爐口冒出一陣藍白色的煙，爐底什麼也沒有。',use:'溫度是夠了，但鋅一生成就變成蒸氣飄走。得想辦法把蒸氣冷卻、接住。',note:''},
 {id:'obs_waterglass',name:'只加天然鹼的玻璃',kind:'obs',at:'heat',T:1000,not:['caco3','quicklime'],lose:['sand','quartz','natron'],inputs:[['sand','natron'],['quartz','natron']],out:{},eqx:'SiO₂ + Na₂CO₃ → Na₂SiO₃ + CO₂（水玻璃）',phen:'沙子真的熔了，冷卻後是一團透明的東西——可是滴上水，表面就慢慢變黏、化開。',use:'天然鹼讓二氧化矽在比較低的溫度熔化，但生成的矽酸鈉會溶於水，叫做「水玻璃」。要讓玻璃不怕水，還得加進含鈣的東西。',note:'鈉鈣玻璃的三種原料：矽砂（主體）、純鹼（助熔）、石灰石（安定）。窗戶和瓶子到今天還是這個配方。'},
 {id:'obs_potdry',name:'把鍋子放進冶煉爐',kind:'obs',at:'none',inputs:[],out:{},eqx:'太熱了：一下就滾乾、燒焦',phen:'窯和鼓風爐是用來把熱悶在裡面的。鍋子一放進去，裡面的東西劈啪亂濺，一下子就滾乾、燒焦，什麼也沒留下。',use:'加熱不是越熱越好。煮東西只需要讓水保持在沸騰附近；冶煉爐動輒上千度，適合石頭和金屬，不適合鍋子裡的東西。要煮，就用營火、爐灶，或實驗室的蒸餾器。',note:'選對加熱的工具，和選對材料一樣重要。'},
 {id:'obs_oil_cold',name:'油和鹼在常溫下混合',kind:'obs',at:'table',failOf:'soap_ash',inputs:[['oil','lye'],['oil','koh'],['oil','naoh'],['oil','natron','water'],['oil','natron'],['oil','limewater'],['oil','slaked','water'],['oil','ash','water'],['oil','sodawater'],['oil','ash']],out:{},eqx:'（反應太慢，幾乎看不出變化）',phen:'油浮在上面，清清楚楚分成兩層。用力攪一攪，變得有點混濁；放著不動，又慢慢分開了。',use:'油和鹼確實會反應，但在常溫下慢得幾乎看不出來。想讓一個反應變快，你已經知道最常用的辦法。',note:'材料沒有壞，撈起來還能再用。'},
 {id:'obs_dirty',name:'沒洗手就發酵',kind:'obs',at:'none',inputs:[],out:{},eqx:'被雜菌污染：長黴、發臭',phen:'過了幾天，表面浮起一層灰綠色的毛，聞起來不是酒香，是餿味。整份都不能用了。',use:'手上有油汙，油汙裡藏著各種細菌和黴菌。它們跟著手進了罐子，長得比酵母菌還快。發酵的訣竅是「只讓想要的微生物長」——動手之前，先用肥皂把手洗乾淨。',note:'1847 年，醫師塞麥爾維斯發現：只要醫生接生前洗手，產婦的死亡率就大幅下降。那時還沒有人知道細菌。'},
 {id:'tech_wash',name:'肥皂為什麼洗得掉油',kind:'tech',inputs:[],out:{},eqx:'肥皂分子：親油端 ＋ 親水端',phen:'搓出泡沫，手上的油汙跟著水流走了。',use:'油和水不互溶，光用水沖不掉油。肥皂分子一端親油、一端親水：親油端插進油汙，親水端留在水裡，把油汙包成小顆粒帶走——連同躲在裡面的細菌。',note:'所以洗手要搓夠久，讓肥皂有時間把油汙包起來。'},
 {id:'obs_outdoor',name:'在戶外發酵',kind:'obs',at:'none',inputs:[],out:{},eqx:'長黴、發臭',phen:'放在露天的東西被太陽曬、被雨淋，引來一堆果蠅，表面長出一層灰綠色的黴，聞起來又酸又臭。',use:'發酵是靠特定的微生物（酵母菌、醋酸菌）慢慢工作。戶外忽冷忽熱，別的黴菌和細菌也會跑進來搶著長。要在溫度穩定、乾淨、能蓋起來的地方做——到屋子裡的實驗桌再試一次。',note:''},
 {id:'obs_bread_out',lose:['risen'],name:'在露天的火上烤麵團',kind:'obs',at:'heat',T:180,outdoor:1,inputs:[['risen']],out:{},eqx:'外面焦了，裡面還是生的',phen:'朝火的那一面燒得焦黑，背面和中心卻還是黏黏的生麵團。',use:'露天的火只烤得到一面，熱一下子就散掉。烤麵包需要四面八方都熱的密閉空間——屋子裡的爐灶。',note:''},
 {id:'obs_flatbread',lose:['dough'],name:'沒發酵就拿去烤',kind:'obs',at:'heat',T:180,inputs:[['dough']],out:{},eqx:'又硬又扁',phen:'烤出來的東西硬得像石頭，裡面一個洞也沒有。',use:'少了發酵產生的二氧化碳，麵團撐不起來。先讓它放一放。',note:''},
 {id:'obs_cu_acid',name:'銅加稀硫酸',kind:'obs',at:'table',inputs:[['copper','h2so4'],['copper','hcl']],out:{},eqx:'沒有變化',phen:'銅片靜靜躺在酸裡，一顆氣泡也沒有。',use:'銅的活性比氫小，沒辦法把酸裡的氫趕出來，換成稀鹽酸也一樣。鐵和鋅可以。',note:'這是在常溫下。如果加熱呢？'},
 {id:'obs_water_elec',name:'直接電解淡水',kind:'obs',at:'cell',inputs:[['water']],out:{},eqx:'幾乎沒有變化',phen:'電極上幾乎看不到氣泡。',use:'純水幾乎不導電。需要先加入能解離出離子的物質（電解質），例如酸、鹼或鹽。',note:''},
 {id:'obs_salt_solid',name:'電解固體食鹽',kind:'obs',at:'cell',inputs:[['salt']],out:{},eqx:'沒有變化',phen:'電極插在鹽粒裡，什麼事也沒發生。',use:'食鹽是電解質，但固體裡的離子被固定住、不能移動，所以不導電。要先溶進水裡。',note:''},
 {id:'obs_weak_elec',name:'電解醋或碳酸水',kind:'obs',at:'cell',inputs:[['vinegar'],['carbonic'],['water','vinegar'],['water','carbonic']],out:{},eqx:'氣泡又少又慢',phen:'兩極只有稀稀落落的小氣泡，比加了硫酸的水慢得多。',use:'醋酸和碳酸是弱酸，溶在水裡只有一小部分變成離子，導電能力差。這種叫弱電解質。',note:''},
 {id:'obs_nonelec',name:'電解糖水或酒精',kind:'obs',at:'cell',inputs:[['juice'],['ethanol'],['water','juice'],['water','ethanol']],out:{},eqx:'沒有變化',phen:'電極上一顆氣泡也沒有。',use:'糖和酒精溶在水裡還是一個個完整的分子，不會變成離子，所以不導電。這種叫非電解質。',note:'能不能導電，要看溶進水裡的東西會不會變成離子，和它溶不溶得進水沒有關係。'},
 {id:'obs_lowvolt',name:'電壓不夠的電解',kind:'obs',at:'cell',inputs:[],out:{},eqx:'沒有變化',phen:'電極上沒有動靜，頂多冒出一兩顆氣泡就停了。',use:'每一種物質要被電拆開，都有一個最低的電壓。電壓不夠，離子就是不肯在電極上放手。把伏打堆再疊高一些。',note:'不同的東西需要的電壓不一樣：銅離子最好說話，水和酸其次，食鹽水更高，熔化的強鹼最難。'},
 {id:'obs_no_cond',name:'沒接冷凝管就加熱',kind:'obs',at:'still',inputs:[],out:{},eqx:'蒸氣散到空氣裡',phen:'瓶口不斷冒出白煙，瓶裡的東西越來越少，卻什麼也沒接到。',use:'加熱會讓容易變成氣體的成分先跑出來。沒有冷凝管把蒸氣變回液體，它就全散到空氣裡了。',note:'在實驗桌上按下「💧 冷凝管」，就能把蒸氣接住。'},
 {id:'obs_melt_only',name:'只加熱、不通電的強鹼',kind:'obs',at:'still',inputs:[],out:{},eqx:'熔化 → 冷卻後又凝固',phen:'白色的固體熔成透明的液體；火一熄，又凝回白色的固體。',use:'熔化只是物理變化。再怎麼加熱，它也不會自己分開。要拆開它，得靠別的力量。',note:''},
 {id:'obs_no_melt',name:'想把食鹽或草木灰燒熔',kind:'obs',at:'still',needElec:1,T:550,inputs:[['salt'],['ash'],['natron']],out:{},eqx:'沒有熔化',phen:'燒到發紅，還是一粒一粒的固體。電極插在裡面，什麼事也沒發生。',use:'食鹽要 801 °C、草木灰裡的碳酸鉀要 891 °C 才會熔化，實驗桌上的小爐子辦不到。有沒有含著同一種金屬、卻容易熔化得多的東西？',note:''},
 /* ===== 科技原理 ===== */
 {id:'tech_bucket',name:'木桶',kind:'tech',inputs:[],out:{},eqx:'木板吸水膨脹 → 縫隙密合',phen:'剛箍好的桶子會滲水。泡一陣子以後，一滴也不漏了。',use:'木頭吸了水會膨脹，板子和板子擠在一起，把縫堵死。箍得越緊越不漏。要把木板削得平整，得有金屬工具。',note:'在塑膠出現以前的幾千年，水、酒、油、醃菜，全是用木桶裝的。'},
 {id:'tech_fire',name:'燃燒三要素',kind:'tech',inputs:[],out:{},eqx:'可燃物 ＋ 助燃物（氧氣）＋ 達到燃點',phen:'快速摩擦讓木屑升溫到燃點，冒煙、起火。',use:'三個要素缺一不可。柴越多，同時在燒的木頭越多，火就越熱；柴燒完，溫度就掉下來。',note:''},
 {id:'tech_kiln',name:'為什麼窯比營火熱',kind:'tech',inputs:[],out:{},eqx:'同樣的柴，把熱留住',phen:'窯壁摸起來燙手，但裡面比外面熱得多。',use:'營火的熱大部分散到空氣裡。黏土窯壁不容易傳熱，把熱關在裡面，同樣的木頭能燒到更高的溫度。',note:''},
 {id:'tech_raft',name:'出海需要什麼',kind:'tech',inputs:[],out:{},eqx:'浮力 ＋ 淡水 ＋ 不會壞的食物',phen:'木頭綁成的筏子穩穩浮在水面上。',use:'木頭的密度比水小所以會浮。鹽能讓食物裡的微生物脫水，食物就不容易腐敗。海水不能喝，所以要用陶罐裝淡水。',note:''},
 {id:'tech_furnace',name:'為什麼鼓風能讓火更熱',kind:'tech',inputs:[],out:{},eqx:'燃料 ＋ 更多氧氣 → 更劇烈的燃燒',phen:'每壓一下風箱，炭火就由紅轉成亮黃白色。',use:'燃燒的快慢和氧氣的量有關。鼓風送進大量氧氣，溫度可以超過 1200 °C——但燃料也燒得更快。燃料也有差：木頭含有水分和一加熱就跑掉的氣體，再怎麼鼓風也只到 1000 °C 左右；幾乎是純碳的木炭才燒得更熱。',note:''},
 {id:'tech_bronze',name:'合金',kind:'tech',inputs:[],out:{},eqx:'銅 ＋ 錫 → 青銅',phen:'青銅斧頭砍樹，刃口不會像純銅那樣捲起來。',use:'在金屬裡混入另一種金屬，原子排列被打亂，就不容易變形——所以合金通常比純金屬硬。',note:''},
 {id:'tech_sail',name:'帆',kind:'tech',inputs:[],out:{},eqx:'風的力 → 船的運動',phen:'帆一張開，船就自己動了起來。',use:'帆把風施加的力傳給船身。人類第一次用上了人力和獸力以外的動力。',note:''},
 {id:'tech_iron',name:'鐵器時代',kind:'tech',inputs:[],out:{},eqx:'鐵礦遍地都是，只是很難煉',phen:'鐵鎬敲在岩壁上，火星四濺。',use:'熟鐵本身偏軟。鐵匠把刃口埋在燒紅的木炭裡，讓表面吸進一點碳，再放進水裡急速冷卻，刃口就變得又硬又利，工具的身體卻還保有韌性。碳的多寡決定了鐵的軟硬——這件事後面還會再遇到。',note:'最早的鐵其實不比青銅好用。鐵能取代青銅，靠的是鐵礦到處都有，不必像錫那樣千里迢迢運來。'},
 {id:'tech_blast',name:'高爐',kind:'tech',inputs:[],out:{},eqx:'更高的爐身 ＋ 焦炭 ＋ 持續鼓風',phen:'爐料從頂端一層層加進去，鐵水從底部流出來。',use:'爐身越高，熱氣往上走的時候能把上面的爐料預熱，熱量不浪費。木炭太脆，堆高了會被壓碎、把風堵住；焦炭夠硬，撐得住。',note:'高爐可以連續運轉好幾年不熄火。'},
 {id:'tech_distill',name:'蒸餾',kind:'tech',inputs:[],out:{},eqx:'加熱 → 汽化 → 冷卻 → 凝結',phen:'蒸氣通過繞成螺旋的銅管，在另一端滴成液體。',use:'沸點不同的物質會先後變成蒸氣，藉此可以把混合物分開。玻璃透明又不怕酸，從此可以安全地處理強酸。',note:''},
 {id:'tech_compass',name:'磁化',kind:'tech',inputs:[],out:{},eqx:'帶磁的磁鐵礦 ＋ 滲過碳的鐵針 → 磁針',phen:'用磁鐵礦順著同一個方向摩擦鐵針，把針懸起來，它總是指著同一個方向。',use:'熟鐵太軟，磁化了也留不住，所以先把針埋在炭火裡滲碳變硬，再拿去摩擦。地球本身就是一個大磁鐵，所以磁針會指向南北。',note:'大多數磁鐵礦只會被磁鐵吸引，自己並不帶磁。你手上這一塊卻能吸起鐵屑——它是怎麼變成磁鐵的？答案在很遠的地方。'},
 {id:'tech_ship',name:'鐵釘與生鏽',kind:'tech',inputs:[],out:{},eqx:'鐵 ＋ 氧氣 ＋ 水 → 鐵鏽',phen:'沒上油的鐵釘，泡過海水幾天就長出紅褐色的鏽。',use:'生鏽是緩慢的氧化，需要氧氣和水，鹽分會讓它更快。所以船上的鐵件要塗油，把空氣和水隔開。',note:'船越大，沉在水面下的部分（吃水）越深：浮力要等於船重，船越重就得排開越多的水。所以大船進不了淺海。'},
 {id:'tech_wheel',name:'水車',kind:'tech',inputs:[],out:{},eqx:'水的位能 → 輪子的動能 → 風箱',phen:'河水推著輪子，輪子上的凸輪一下一下壓著風箱。',use:'水從高處往低處流，帶著能量。水車把這份能量接過來，替人做重複又費力的事。爐子有了不會累的風箱，溫度才穩得住。',note:'中國在東漢就有用水車鼓風煉鐵的「水排」，比歐洲早了一千多年。'},
 {id:'tech_rod',name:'避雷針',kind:'tech',inputs:[],out:{},eqx:'閃電（電流）→ 沿金屬導入地下',phen:'一根高過所有樹的鐵桿，底下接著埋進土裡的銅線。',use:'閃電是雲和地面之間的放電。電會挑最容易走的路——又高又尖的金屬。',note:'1752 年富蘭克林的風箏實驗證明閃電就是電。那個實驗其實非常危險，千萬不要模仿。'},
 {id:'tech_magnet',name:'雷擊磁化',kind:'tech',inputs:[],out:{},eqx:'強大的電流 → 線圈裡的磁場 → 鋼被磁化',phen:'一聲巨響之後，線圈裡的鋼棒能吸起鐵屑了。',use:'電流流過的地方，周圍會有磁場。把導線繞成一圈一圈，圈裡的磁場就順著同一個方向。雷電的電流大得驚人，足以讓鋼棒裡原本亂七八糟的「小磁鐵」排成同一個方向，而且排好就不再亂掉。',note:'1820 年厄斯特發現通電的導線會讓指南針偏轉——電和磁原來是同一件事的兩面。還記得那塊自己帶磁的磁鐵礦嗎？天然磁石，就是很久以前被雷打過的磁鐵礦。'},
 {id:'obs_soft_magnet',name:'被雷打過的熟鐵',kind:'obs',at:'none',inputs:[],out:{},eqx:'磁化 → 很快消失',phen:'熟鐵棒吸起了幾粒鐵屑，才一轉眼，又全掉了下來。',use:'熟鐵幾乎不含碳，裡面的「小磁鐵」很容易排整齊，也很容易又亂掉。含碳多的鋼和生鐵比較硬，排好了就不容易亂，才能做成永久磁鐵。',note:'留不住磁也有用處：電磁鐵和電動機的鐵芯，要的就是這種一通電就有磁、一斷電就沒有的材料。'},
 {id:'tech_gen',name:'發電機',kind:'tech',inputs:[],out:{},eqx:'動能 → 電能（磁鐵與線圈相對運動）',phen:'搖動把手，磁鐵在線圈旁邊轉，接在線圈兩端的碳絲微微亮了。',use:'電流能產生磁；反過來，變動的磁也能產生電。只要磁鐵和線圈之間有相對運動，線圈裡就有電流。這就是所有發電廠的原理——不管燒的是煤、是水力還是風。',note:'1831 年法拉第發現電磁感應。有人問他這有什麼用，他說：「剛出生的嬰兒有什麼用？」'},
 {id:'tech_motor',name:'電動機',kind:'tech',inputs:[],out:{},eqx:'電能 → 動能（通電的線圈在磁場裡受力）',phen:'線圈一通電，就在磁鐵旁邊轉了起來，越轉越快。',use:'發電機是「轉動 → 電」，電動機是「電 → 轉動」。兩者的構造幾乎一樣，只是倒過來用。水車的力氣只能用輪軸和連桿傳到旁邊；變成電以後，一條銅線就能送到遠處。',note:'水車推風箱是機械傳動，離不開河邊。電把「在哪裡產生力氣」和「在哪裡用力氣」分開了——這是電力改變世界的原因之一。'},
 {id:'tech_mask',name:'活性碳面具',kind:'tech',inputs:[],out:{},eqx:'有毒氣體 —(吸附)→ 留在活性碳表面',phen:'隔著面具吸氣，刺鼻的味道淡了很多。',use:'活性碳滿是小孔，氣體分子撞上去就被「黏」住了。空氣裡的氧和氮不太會被吸住，所以還是可以呼吸。',note:'活性碳吸滿了就沒有用了，要更換或重新加熱活化。'},
 {id:'tech_scope',name:'望遠鏡',kind:'tech',inputs:[],out:{},eqx:'物鏡聚光成像 → 目鏡放大',phen:'把筒子對準海平線。原本只是一抹灰影的地方，出現了樹和山壁。',use:'前面的大透鏡把遠方來的光聚成一個小小的像，後面的小透鏡再把這個像放大。',note:'1609 年伽利略把望遠鏡指向天空，看見了月球的坑洞和木星的衛星。'},
 {id:'tech_balloon',name:'熱氣球',kind:'tech',inputs:[],out:{},eqx:'空氣受熱 → 膨脹 → 密度變小 → 浮起來',phen:'火盆一燒旺，軟趴趴的氣囊慢慢鼓了起來，吊籃輕輕離開地面。',use:'空氣受熱會膨脹，同樣大小的一袋熱空氣，比外面的冷空氣輕。和船浮在水上是同一個道理：排開的空氣比氣球自己重，就會往上浮。火一熄，空氣冷下來，氣球就往下沉。木炭燒出的熱比同樣重的木頭多，又不冒煙，所以更耐飛。',note:'1783 年，法國的孟格菲兄弟在吊籃的火盆裡燒稻草和羊毛，載著兩個人飛越了巴黎。'},
 {id:'tech_acidlake',name:'火山口的酸湖',kind:'tech',inputs:[],out:{},eqx:'火山氣體（SO₂、HCl）+ 水 → 硫酸和鹽酸的混合酸',phen:'一池乳白帶綠的藍綠色湖水，冒著白煙，岸邊結著一層黃色的硫磺。把陶罐伸進去，舀上來的是一罐溫熱、刺鼻的酸。',use:'火山噴出的二氧化硫溶進湖水，再被空氣氧化成硫酸；噴出的氯化氫溶進去就是鹽酸。所以湖水是好幾種酸混在一起，還溶著鐵、鋁和硫磺。拿回實驗桌蒸餾：鹽酸會先揮發，要接上冷凝管才接得住；硫酸不揮發，留在燒瓶裡。',note:'印尼的伊真火山口有一座這樣的湖，酸鹼值比電池裡的電解液還低。山腳下的湖卻是鹼的——同一座火山，一酸一鹼。'},
 {id:'tech_radio',name:'無線電',kind:'tech',inputs:[],out:{},eqx:'電火花 → 電磁波 → 遠方的線圈 → 電流 → 聲音',phen:'你按下電鍵。火花劈啪一響——然後，耳機裡的晶體輕輕地答、答、答。',use:'快速變動的電流會把能量以波的形式送向四面八方，不需要導線。遠方的天線接住它，方鉛礦讓電流只能單向通過，酒石晶體把它變成振動——你就「聽見」了。',note:'1901 年馬可尼把三個點的訊號送過了大西洋。從那一天起，世界上沒有真正的孤島。'},
 {id:'tech_elec',name:'伏打堆的原理',kind:'tech',inputs:[],out:{},eqx:'負極 Zn → Zn²⁺ + 2e⁻　　電子經導線流向銅片',phen:'一片鋅、一片銅，中間夾一塊浸了鹽水的布。這樣一組一組往上疊，兩端接上導線，就有電流。',use:'鋅比銅活潑，容易失去電子；電子經過導線流向銅片，形成電流，化學能就變成了電能。每一層大約 1 伏特，疊幾層電壓就是幾倍。鋅片會一點一點被吃掉，用久了要換；銅片不會。',note:'1800 年，伏打把鋅片、銀片和浸了鹽水的紙板疊成一堆，做出史上第一個能持續供電的電池。消息傳開後才幾個星期，就有人用它把水拆開了。'},
 {id:'tech_daniell',name:'丹尼爾電池',kind:'tech',inputs:[],out:{},eqx:'負極 Zn → Zn²⁺ + 2e⁻　　正極 Cu²⁺ + 2e⁻ → Cu',phen:'鋅片泡在硫酸鋅溶液裡，銅片泡在硫酸銅溶液裡，中間隔著一只沒上釉的陶罐。接上導線，電流又穩又久，銅片上還慢慢長出一層新的銅。',use:'伏打堆通電沒多久，銅片表面就積滿氫氣泡，電壓跟著掉下去。丹尼爾電池讓銅片泡在含銅的溶液裡：到銅片上的不再是氫氣，而是銅，所以電壓不會掉。陶罐把兩種溶液隔開，卻讓離子通得過。',note:'你之前把鋅直接丟進硫酸銅溶液，電子直接從鋅跳到銅離子上，能量全變成了熱。把兩邊隔開、逼電子繞過導線，同一個反應就變成了電。1836 年丹尼爾發明這種電池，後來的電報線路靠的就是它。'},
 {id:'tech_field',name:'農業的開始',kind:'tech',inputs:[],out:{},eqx:'採集 → 種植',phen:'把吃剩的穀粒埋進土裡，過一陣子長出了一樣的植物。',use:'大約一萬年前，人類開始自己種糧食。有了穩定的食物，才有人能專心去燒陶、煉銅。',note:''},
 {id:'farm_min',name:'最小因子定律',kind:'tech',inputs:[],out:{},eqx:'收成取決於最缺的那一樣',phen:'木桶能裝多少水，由最短的那塊木板決定。',use:'植物需要氮、磷、鉀、水和合適的酸鹼。其中一樣不夠，其他的再多也沒用。施肥前要先知道缺的是什麼。',note:'1840 年德國化學家李比希提出，現代肥料工業從這裡開始。'},
 {id:'farm_ph',name:'測量土壤的酸鹼',kind:'tech',inputs:[],out:{},eqx:'土 + 水 + 指示劑 → 顏色',phen:'把一點土泡在水裡，滴進紫甘藍指示劑，看顏色就知道土是酸還是鹼。',use:'大多數作物喜歡接近中性、略偏酸的土。太酸或太鹼，養分就算在土裡，根也吸收不到。',note:''},
 {id:'farm_lime',name:'用石灰改良酸性土',kind:'tech',inputs:[],out:{},eqx:'酸 + Ca(OH)₂ → 鹽 + 水',phen:'撒過熟石灰的田，再測一次，顏色往紫色那邊回來了。',use:'酸鹼中和用在田裡。熟石灰是鹼，能把土裡過多的酸中和掉。但撒太多會變成鹼性，一樣長不好——所以要邊撒邊測。',note:'現在農民用的是比較溫和的石灰石粉或白雲石粉。'},
 {id:'farm_npk',name:'肥料三要素',kind:'tech',inputs:[],out:{},eqx:'氮 N　磷 P　鉀 K',phen:'施了肥的那一區，葉子明顯比較綠、長得比較快。',use:'氮長葉子、磷長根和果實、鉀讓莖強壯。草木灰主要補鉀，堆肥主要補氮，鳥糞石主要補磷。作物收走以後，這些養分也跟著被帶走，所以田要一直補。',note:''},
 {id:'tech_hut',name:'為什麼茅草屋冬暖夏涼',kind:'tech',inputs:[],out:{},eqx:'一層層的草 ＝ 很多不會流動的空氣',phen:'外面颳著風，棚子裡卻暖和多了。',use:'空氣是熱的不良導體。草和葉子之間夾著許多小空隙，空氣被困在裡面動不了，熱就不容易傳出去。羽絨衣、保麗龍也是同一個道理。',note:''},
 {id:'tech_cabin',name:'榫卯',kind:'tech',inputs:[],out:{},eqx:'凸的榫 ＋ 凹的卯',phen:'兩根木頭不用釘子就牢牢咬在一起。',use:'把力分散到木頭本身，而不是集中在一根釘子上。但要做出精準的榫頭，得先有夠硬的金屬工具。',note:''},
 {id:'tech_brick',name:'磚瓦與灰泥',kind:'tech',inputs:[],out:{},eqx:'Ca(OH)₂ + CO₂ → CaCO₃ + H₂O',phen:'剛砌好的牆還有點軟，過幾個星期就硬得敲不動。',use:'磚瓦是燒過的黏土，不怕火也不怕水。磚和磚之間的灰泥會慢慢吸收空氣裡的二氧化碳，變回堅硬的碳酸鈣——你在第一章做過的那個反應，現在撐著你的房子。',note:''},
 {id:'tech_rc',name:'鋼筋混凝土',kind:'tech',inputs:[],out:{},eqx:'混凝土（耐壓）＋ 鋼筋（耐拉）',phen:'樓板上站了人也不會裂。',use:'混凝土很耐壓，但一拉就裂；鋼正好相反，很耐拉。把鋼筋埋進混凝土，兩種力都撐得住。巧的是，兩者受熱膨脹的程度幾乎一樣，所以熱脹冷縮時不會互相扯開。',note:'1867 年法國園丁莫尼埃為了做不會裂的花盆而發明。'},
 {id:'tech_beacon',name:'電燈',kind:'tech',inputs:[],out:{},eqx:'電能 → 熱 → 光',phen:'碳絲亮了起來。',use:'電流通過很細的碳絲，碳絲發熱到發光。燈泡裡不能有氧氣，不然燒到白熱的碳絲一下就燒掉了——還記得燃燒三要素嗎？',note:'1879 年愛迪生第一顆成功的燈泡，用的是碳化的棉線，亮了十幾個小時；隔年換成碳化的竹絲，可以亮一千多個小時。'}
];
const RMAP={};REACTIONS.forEach(r=>RMAP[r.id]=r);

const F=id=>s=>!!s.found[id],A=id=>s=>!!s.abil[id],V=i=>s=>!!s.seen[i],HAS=t=>s=>s.st.some(x=>x.type===t&&x.done);
const QUESTS=[
 {id:'q_wreck',ch:'第一章　火與渡海　｜　貝殼島',goal:'到沙灘上那艘破船找找有沒有能用的東西',hint:'「船就擱淺在你醒來的地方往西幾步。走到旁邊按 E（或點它）。空著手，什麼也做不了。」',done:s=>!!s.known._wreck||!!s.abil.axe,
  after:'一把鐵斧。\n\n它又舊又鈍，卻是你和這座島之間的第一樣工具——也是這片海上唯一的一塊鐵。它是怎麼從石頭變成鐵的？你知道道理，但還沒有親手做過。\n\n人類花了幾十萬年才學會把石頭綁在木棍上。你不必從那裡開始——但接下來的每一步，都得自己走。'},
 {id:'q_wood',ch:'第一章　火與渡海　｜　貝殼島',goal:'走到樹旁邊，用斧頭砍樹，蒐集 3 個木頭',hint:'「靠近樹按 E（或點它），要砍好幾下。天黑以前，一定要先有火。」',done:s=>(s.inv.wood||0)>=3||s.st.length>0},
 {id:'q_campfire',ch:'第一章　火與渡海　｜　貝殼島',goal:'打開「建造」，在空地上堆一座營火',hint:'「面向一塊空地，選營火。木頭不夠的話，之後走過去按 E 再補。」',done:HAS('campfire')},
 {id:'q_fire',ch:'第一章　火與渡海　｜　貝殼島',goal:'走到營火旁，添柴、點火',hint:'「柴越多，火越旺、燒得越久。看著溫度計，試試放 2 根和放 6 根差多少。」',done:A('fire'),
  after:'火光亮起來的那一刻，你鬆了一口氣。\n\n筆記上寫著：「人類學會用火，是四十萬年前的事。從火到電，我們走了四十萬年。你不用那麼久——但每一步都省不掉。」'},
 {id:'q_pottery',ch:'第一章　火與渡海　｜　貝殼島',goal:'到湖邊挖黏土，放進營火裡燒成陶',hint:'「火不夠旺，土坯只會變乾，不會變硬。要燒到 600 °C 以上，而且要撐得夠久——柴一次放 8 根以上試試。」',rx:['pottery'],done:F('pottery'),
  after:'土坯變成了磚紅色，敲起來鏗鏘作響。\n\n你有了第一個鍋子。從現在起，你可以在火上煮液體、用罐子裝氣體，也可以蓋陶窯和實驗桌了。'},
 {id:'q_evap',ch:'第一章　火與渡海　｜　貝殼島',goal:'用陶鍋在營火上煮海水，取得食鹽',hint:'「走到海邊按 E 裝海水。煮沸只需要 100 °C，一兩根柴就夠。」',rx:['evap'],done:F('evap'),
  after:'水煮乾了，鍋底留下一層白色的結晶。\n\n筆記翻到下一頁：「火、陶、鹽——活下去需要的，這座島都給你了。但它只有這些。\n\n東北方有一座更大的島，那裡的石頭裡藏著別的東西。造一艘木筏吧。」'},
 {id:'q_raft',ch:'第一章　火與渡海　｜　貝殼島',goal:'在沙灘上造一艘木筏',hint:'「站在沙灘上，建造選木筏。木頭 8、藤蔓纖維 4、食鹽 2。出發前多帶些黏土——那邊的湖邊只有一點點。黏土和石頭挖完就沒了，省著用；樹砍了會慢慢長回來。」',done:A('raft')},
 {id:'q_1',ch:'第一章　火與渡海　｜　貝殼島',goal:'划向東北方的綠岩島',hint:'「走到木筏旁邊就能上去。上岸以後它會停在原地等你。淺色的海過得去，深色的海別硬闖。」',done:V(1),
  after:'綠岩島。\n\n岸邊的石縫裡塞著一個陶罐，裡面是筆記的第二章：\n\n「這裡的石頭，敲開來有的帶綠色、有的是深褐色。裡面藏著金屬。\n\n但營火的溫度不夠。你需要一座窯、更好的燃料，和一座能把風灌進去的爐子。\n\n爐子要用灰泥砌。山壁上灰白色的石頭和貝殼是同一種東西——燒過、加水、拌沙，就是灰泥。」'},
 {id:'q_kiln',ch:'第二章　金屬　｜　綠岩島',goal:'用黏土蓋一座陶窯',hint:'「黏土 6 份。營火的熱都散掉了，窯能把熱留住。這座島湖邊的黏土不多，不夠就回貝殼島挖。」',done:HAS('kiln')},
 {id:'q_calcine',ch:'第二章　金屬　｜　綠岩島',goal:'把石灰石（或貝殼）燒成能做灰泥的「石灰」',hint:'「灰白色礦脈的石頭，和貝殼是同一種東西。火要夠熱，它才會變質——多熱？放在哪裡燒？自己試。失敗也是一種發現。」',rx:['calcine'],done:F('calcine')},
 {id:'q_slake',ch:'第二章　金屬　｜　綠岩島',goal:'蓋一張實驗桌，把燒出來的生石灰變成熟石灰',hint:'「實驗桌要 4 根木頭。生石灰很『渴』。小心燙。」',rx:['slake'],done:F('slake')},
 {id:'q_mortar',ch:'第二章　金屬　｜　綠岩島',goal:'調出能把磚石黏在一起的灰泥',hint:'「羅馬人用燒過的石頭、沙和水，把整座城黏起來。沙灘上的沙堆就是石英砂；石頭裡敲出來的石英，敲碎也行。」',rx:['mortar'],done:F('mortar')},
 {id:'q_charcoal',ch:'第二章　金屬　｜　綠岩島',goal:'做出比木頭更好的燃料：木炭',hint:'「木頭直接燒只會變成灰。如果只給它熱、不給它空氣呢？陶窯有兩個放東西的地方。」',rx:['charcoal'],done:F('charcoal')},
 {id:'q_furnace',ch:'第二章　金屬　｜　綠岩島',goal:'蓋一座鼓風爐',hint:'「黏土 4、灰泥 2、木頭 2、藤蔓纖維 2。黏土要到湖邊找：這座島只有一點，貝殼島比較多。」',done:HAS('furnace'),
  after:'爐子砌好了，旁邊接著一具風箱。\n\n筆記：「七千年前，有人把綠色的石頭和木炭一起丟進這樣的爐子，流出來的東西改變了世界。記得——風不能停。」'},
 {id:'q_smelt_cu',ch:'第二章　金屬　｜　綠岩島',goal:'從帶綠色礦脈的石頭裡煉出銅',hint:'「綠色的石頭燒過會變黑——那還不是銅。要有東西把黑色粉末裡的氧搶走。溫度要很高，風不能停。」',rx:['smelt_cu'],done:F('smelt_cu')},
 {id:'q_smelt_sn',ch:'第二章　金屬　｜　綠岩島',goal:'找到深褐色礦脈的石頭，煉出錫',hint:'「做法和煉銅一樣，溫度低一點就行。」',rx:['smelt_sn'],done:F('smelt_sn')},
 {id:'q_bronze',ch:'第二章　金屬　｜　綠岩島',goal:'做出比銅更硬的金屬',hint:'「純銅太軟，做不了斧頭。你手上有兩種金屬。」',rx:['bronze'],done:F('bronze')},
 {id:'q_bronze_tools',ch:'第二章　金屬　｜　綠岩島',goal:'在「建造」裡打造青銅工具',hint:'「青銅 3、木頭 2。」',done:A('bronze_tools'),
  after:'青銅斧一揮，樹幹應聲而斷。\n\n筆記：「有了工具，才造得出真正的船，也蓋得出像樣的房子。\n\n有了屋頂，就能做些需要耐心的事——讓看不見的小東西替你把甘蔗汁變成酒、把麵團發起來。不過動手之前，先把手洗乾淨。記得火堆裡清出來的灰嗎？」'},
 {id:'q_sail',ch:'第二章　金屬　｜　綠岩島',goal:'在沙灘上造一艘帆船',hint:'「木頭 10、藤蔓纖維 6、青銅 2。」',done:A('sail'),
  after:'帆一張開，船就自己動了。\n\n筆記：「東南方那座冒煙的島，石頭是紅色和黑色的，湖邊結著白色的鹼。帶上黏土和灰泥，到那邊再蓋一座爐子。」'},
 {id:'q_2',ch:'第二章　金屬　｜　綠岩島',goal:'航向東南方的火山島',hint:'「現在你可以穿過比較深的海了。」',done:V(2),
  after:'火山島。黑色的沙灘，空氣裡有一點硫磺味。\n\n筆記的第三章被壓在一塊紅色的石頭下面：\n\n「鐵。玻璃。然後是酸。有了酸，化學才真正開始。」'},
 {id:'q_iron',ch:'第三章　鐵與玻璃　｜　火山島',goal:'從紅褐色或黑色礦脈的石頭裡煉出鐵',hint:'「這裡的石頭很硬，要青銅工具才敲得開。道理和煉銅一樣，但鐵抓氧抓得更緊——要更熱。」',rx:['smelt_fe','smelt_fe2'],done:s=>!!(s.found.smelt_fe||s.found.smelt_fe2)},
 {id:'q_forge',ch:'第三章　鐵與玻璃　｜　火山島',goal:'把海綿鐵打成能用的熟鐵',hint:'「爐子裡拿出來的那一團，全是孔，一敲就碎——渣還混在裡面。趁它燒紅，拿到實驗桌的石砧上用力打。兩塊才打得出一塊。」',rx:['forge'],done:F('forge')},
 {id:'q_iron_tools',ch:'第三章　鐵與玻璃　｜　火山島',goal:'打造鐵製工具',hint:'「熟鐵 3、木頭 2、木炭 1。熟鐵太軟，刃口要埋在炭火裡燒過，再放進水裡。」',done:A('iron_tools')},
 {id:'q_glass',ch:'第三章　鐵與玻璃　｜　火山島',goal:'做出透明的玻璃',hint:'「沙子的主要成分是二氧化矽，但它自己很難熔。古埃及的工匠發現，湖邊某種白色的東西能讓沙子在比較低的溫度熔化；可是那樣做出來的玻璃泡水會壞，還得再加一樣東西。」',rx:['glass'],done:F('glass')},
 {id:'q_distill',ch:'第三章　鐵與玻璃　｜　火山島',goal:'在屋裡的實驗室裝一套玻璃蒸餾器',hint:'「玻璃 3、銅 1，銅是用來繞冷凝管的。精細的玻璃器材要放在屋子裡——先蓋一間木屋，進屋安裝。」',done:A('distill'),
  after:'透明的器皿在火光下閃閃發亮。你第一次能「看見」反應在容器裡發生。\n\n筆記：「一千兩百年前，鍊金術士把一種藍綠色的晶體放進蒸餾器，得到了能溶解金屬的液體。」'},
 {id:'q_h2so4',ch:'第三章　鐵與玻璃　｜　火山島',goal:'用蒸餾器從藍綠色的礦石裡製造硫酸',hint:'「鍊金術士叫它『礬油』。把藍綠色礦脈敲出來的晶體加熱，冒出來的氣體要有水接住。」',rx:['h2so4'],done:F('h2so4')},
 {id:'q_cuo_acid',ch:'第三章　鐵與玻璃　｜　火山島',goal:'做出藍色的硫酸銅溶液',hint:'「銅自己不怕稀硫酸——至少冷的、稀的不怕。銅的某種黑色粉末就不一樣了，你煉銅時見過它。」',rx:['cuo_acid','cu_hot_acid'],done:s=>!!(s.found.cuo_acid||s.found.cu_hot_acid)},
 {id:'q_fe_cuso4',ch:'第三章　鐵與玻璃　｜　火山島',goal:'把鐵放進藍色的硫酸銅溶液',hint:'「看看鐵的表面長出什麼。」',rx:['fe_cuso4'],done:F('fe_cuso4'),
  after:'鐵的表面長出了銅。\n\n沒有火，沒有爐子，一種金屬就把另一種金屬從水裡「趕」了出來。\n\n筆記在這裡畫了一個大大的問號：「為什麼是鐵趕走銅，而不是銅趕走鐵？金屬之間，有強弱之分。記住這件事。它是通往電的鑰匙。」'},
 {id:'q_compass',ch:'第三章　鐵與玻璃　｜　火山島',goal:'做一個指南針',hint:'「黑色、會吸鐵的磁鐵礦 1 份，熟鐵 1 份，木炭 1 份。熟鐵太軟，留不住磁；先讓針在炭火裡變硬。」',done:A('compass')},
 {id:'q_ship',ch:'第三章　鐵與玻璃　｜　火山島',goal:'在沙灘上造一艘遠洋帆船',hint:'「木頭 12、藤蔓纖維 6、熟鐵 4。出發前把硫酸、硫酸銅、銅、玻璃、木炭都備足。大船吃水深，回不了淺海——要回貝殼島、綠岩島，得換回帆船。」',done:A('ship'),
  after:'船造好了。\n\n筆記：「正北方，雷聲不斷的那座島。我在那裡蓋了一座塔，卻沒能點亮它。那裡的石頭裡，有最後一種你需要的金屬。」'},
 {id:'q_3',ch:'第三章　鐵與玻璃　｜　火山島',goal:'航向北方的雷鳴島',hint:'「最深的海，現在也攔不住你了。」',done:V(3),
  after:'雷鳴島。山頂矗立著一座沒有亮過的塔。\n\n筆記的最後一章：\n\n「閃電是天上的電。我想把它裝進罐子裡。\n\n我找到了那種金屬——它比鐵還活潑。可是它一煉出來就變成煙跑掉，我用盡方法都留不住。\n\n如果你有蒸餾器，也許你做得到。」'},
 {id:'q_coke',ch:'第四章　煤與電　｜　雷鳴島',goal:'把烏黑發亮的石頭變成能煉鐵的燃料',hint:'「這座島的山壁裡夾著一種黑得發亮、點得著的石頭。直接拿它當燃料煉鐵，鐵會脆得一敲就碎——我試過了，你也可以試試。想想木頭是怎麼變成木炭的。」',rx:['coke'],done:F('coke')},
 {id:'q_blast',ch:'第四章　煤與電　｜　雷鳴島',goal:'蓋一座高爐',hint:'「黏土 6、灰泥 4、熟鐵 4、藤蔓纖維 2。鐵是用來箍住爐身的。」',done:HAS('blast'),
  after:'爐子比你還高出一倍。\n\n筆記：「1709 年，一個英國鐵匠把悶過的煤倒進這樣的爐子。從那天起，鐵不再是一塊一塊敲出來的，而是像水一樣流出來。」'},
 {id:'q_pig_iron',ch:'第四章　煤與電　｜　雷鳴島',goal:'用高爐煉出像水一樣流動的鐵',hint:'「鐵礦和焦炭之外，還要一種能把礦石裡的砂石雜質帶走的石頭——你很早就認識它了。要比以前煉鐵更熱。」',rx:['pig_iron'],done:F('pig_iron')},
 {id:'q_steel',ch:'第四章　煤與電　｜　雷鳴島',goal:'把又硬又脆的生鐵變成鋼',hint:'「生鐵脆，是因為裡面的碳太多。把生鐵取出來，單獨放回高爐再燒一次——這次爐料裡別放焦炭，只管用力鼓風。空氣裡有什麼東西，能把碳帶走？」',rx:['steel','steel_o2'],done:s=>!!(s.found.steel||s.found.steel_o2)},
 {id:'q_smelt_zn',ch:'第四章　煤與電　｜　雷鳴島',goal:'從淺藍色礦脈的石頭裡煉出鋅',hint:'「要鐵製工具才敲得開。前半和煉銅很像。但鋅很怪：還沒熔成一灘，就先變成蒸氣飄走了——得想辦法把蒸氣留下來。蒸氣還怕空氣，一碰到就燒回去，所以鼓風的爐子不行。」',rx:['smelt_zn'],done:F('smelt_zn')},
 {id:'q_zn_acid',ch:'第四章　煤與電　｜　雷鳴島',goal:'在實驗桌把鋅放進稀硫酸',hint:'「和鐵比比看，誰冒泡比較快？留下來的溶液也有用。」',rx:['zn_acid'],done:F('zn_acid')},
 {id:'q_elec',ch:'第四章　煤與電　｜　雷鳴島',goal:'在屋裡的實驗室疊一座伏打堆',hint:'「一片鋅、一片銅、一塊浸了鹽水的布，一層一層往上疊：鋅 2、銅 2、食鹽 1、藤蔓纖維 1。這麼嬌貴的東西，木屋的桌子放不了——要磚瓦屋以上：磚瓦 8、灰泥 3、木頭 4。」',done:A('elec'),
  after:'導線兩端碰在一起時，跳出了一點小小的火花。\n\n四十萬年前的那堆營火，走到了這裡。\n\n筆記：「有了電，連水都可以拆開。」'},
 {id:'q_electro_water',ch:'第四章　煤與電　｜　雷鳴島',goal:'用電解槽把水拆成氫氣和氧氣',hint:'「先直接電解淡水試試。不行的話，想想什麼東西能幫水導電。」',rx:['electro_water'],done:F('electro_water')},
 {id:'q_daniell',ch:'第四章　煤與電　｜　雷鳴島',goal:'讓電穩定下來，撐得住一整夜的燈',hint:'「伏打堆通電沒多久，銅片上就積滿氣泡，電也跟著弱下去——拿來拆水還行，要點一整夜的燈可不夠。如果銅片泡的不是鹽水，而是本來就含銅的藍色溶液呢？鋅那一邊，也給它自己的溶液。回屋裡在伏打堆旁邊改裝：硫酸銅溶液 1、硫酸鋅溶液 1、陶器 1（把兩種溶液隔開）。」',done:A('daniell')},
 {id:'q_beacon',ch:'第四章　煤與電　｜　雷鳴島',goal:'把材料帶到山頂，點亮電燈信號塔',hint:'「走到塔旁邊按 E。銅 3（導線）、玻璃 1（燈罩）、碳絲 1（燈絲）、鋼 2（燈架）。碳絲？把細細的植物纖維封進陶罐，像悶木炭那樣悶——但要燒得比悶木炭熱得多。」',done:A('beacon'),
  after:'塔亮了。\n\n筆記的最後一頁只有一行字：\n「我沒能做完。希望撿到這本筆記的人，可以。」\n\n你等了一整夜。海面上沒有任何回應。\n\n光只能照到看得見的地方。要讓更遠的人知道你在這裡，需要一種走得比光更遠、連山和海平線都擋不住的東西。\n\n——筆記到這裡就沒有了。從現在起，每一頁都要你自己寫。'},
 {id:'q_rod',ch:'第五章　遠方',goal:'在雷鳴島立一根避雷針',hint:'「這座島的雷打個不停。閃電是電——如果能讓它乖乖打在你指定的地方呢？熟鐵 3、銅 2、木頭 2。」',done:HAS('rod')},
 {id:'q_magnet',ch:'第五章　遠方',goal:'用雷電做出一根磁鐵',hint:'「避雷針底下的銅線繞成了一圈一圈。把一根金屬棒放進圈裡，然後——等。記得站遠一點。太軟的鐵留不住磁，要用硬的。」',done:s=>!!s.known._magnet,
  after:'鐵棒還是那根鐵棒，卻能吸起地上的鐵屑了。\n\n電流過的地方，留下了磁。\n\n那麼反過來——讓磁動起來，會不會生出電？'},
 {id:'q_gen',ch:'第五章　遠方',goal:'讓河水替你發電',hint:'「先在河邊蓋一座水車。再做一台發電機裝上去：磁鐵 1、銅 3（繞成線圈）、木頭 2。電池裡的鋅片會一點一點溶掉；轉動的磁鐵不會。電要送到屋裡，就拉銅線。」',done:A('gen')},
 {id:'q_actc',ch:'第五章　遠方',goal:'把木炭變成能抓住毒氣的活性碳',hint:'「火山島的山頂冒著嗆人的煙，上次差點把你燻倒。木炭本來就會吸味道，但還不夠。如果讓滾燙的水蒸氣在木炭上蛀出更多的孔呢？要很熱，而且不能讓它燒起來。」',rx:['actcarbon'],done:F('actcarbon')},
 {id:'q_mask',ch:'第五章　遠方',goal:'做一副活性碳面具',hint:'「活性碳 2、藤蔓纖維 3、玻璃 1（護目鏡）。」',done:A('mask')},
 {id:'q_acid',ch:'第五章　遠方',goal:'戴著面具走進火山口，看看裡面有什麼',hint:'「火山島正中央，寸草不生的那一圈。」',done:s=>!!s.known._acid,
  after:'一整池的酸。不只硫酸，聞起來還有鹽酸的味道。\n\n你想起在蒸餾器前面守著一點一點滴下來的那一小瓶。\n\n大自然從來不小氣，只是把東西混在一起、放在不好拿的地方。帶回實驗桌蒸餾，才分得開。'},
 {id:'q_lens',ch:'第五章　遠方',goal:'把玻璃磨成透鏡',hint:'「玻璃是透明的，但平平的玻璃只是窗戶。什麼東西比玻璃還硬，可以一點一點把它磨成弧形？你腳下到處都是。」',rx:['lens'],done:F('lens')},
 {id:'q_scope',ch:'第五章　遠方',goal:'做一支望遠鏡，看看海的另一邊',hint:'「透鏡 2、銅 1、木頭 1。」',done:A('scope'),
  after:'你把望遠鏡對準西北方的海平線。\n\n那裡一直有一團散不掉的雲。雲的下面——是一座島。\n\n四周的海面泛著白色的碎浪：暗礁。沒有任何一艘船過得去。\n\n但如果不走海路呢？'},
 {id:'q_balloon',ch:'第五章　遠方',goal:'造一個能載人的熱氣球',hint:'「藤蔓纖維 12（織氣囊）、木頭 4（吊籃）、陶器 1（火盆）。空氣燒熱了會變輕——煙為什麼總是往上飄？」',done:HAS('balloon')},
