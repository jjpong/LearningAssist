<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光路迷宮</title>
<meta name="description" content="格子式反射折射解謎遊戲：用平面鏡、分光鏡、直角稜鏡與各種玻璃磚把雷射導進偵測器，六組 30 關，含必經點與電池限時關。">
<meta name="category" content="科學遊戲">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 光學桌（深色陽極鋁板）為主角，右側是器材抽屜；手機上抽屜移到桌下 */
:root {
  --room: #0e1219;
  --table: #18202b;
  --table-edge: #232d3b;
  --hole: #0a0e14;
  --rule: #2a3545;
  --ink: #e2e8f0;
  --muted: #8d9aae;
  --laser: #ff3347;
  --lit: #ffc94d;
  --glass: #8fd3ff;
  --brass: #c9a66b;
  --ok: #6fd08c;
  --btn: #222c3a;
  --btn-hi: #2d394b;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--room); color: var(--ink); }
body { margin: 0; }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 14px; }
header.top h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: .08em; text-wrap: balance; }
header.top h1 span { color: var(--laser); text-shadow: 0 0 14px rgba(255, 51, 71, .55); }
header.top p { margin: 0; color: var(--muted); font-size: 14px; }
.spec { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.spec b { color: var(--ink); font-weight: 600; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
@media (max-width: 840px) { .main { grid-template-columns: minmax(0, 1fr); } }

.bench { position: relative; background: var(--table-edge); border-radius: 12px; padding: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 18px 40px rgba(0,0,0,.45); min-width: 0; }
.bench-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 4px 9px; flex-wrap: wrap; }
.lvl-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.lvl-no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.lvl-name { font-size: 19px; font-weight: 700; letter-spacing: .04em; }
.status { font-family: var(--f-mono); font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.status.on { color: var(--room); background: var(--lit); border-color: var(--lit); font-weight: 600; }
.board-box { position: relative; display: flex; justify-content: center; }
canvas#board { display: block; border-radius: 6px; touch-action: none; max-width: 100%; outline: none; }
canvas#board:focus-visible { box-shadow: 0 0 0 2px var(--glass); }

.win { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(14,18,25,.94);
  border: 1px solid var(--lit); border-radius: 12px; padding: 18px 22px; text-align: center; width: min(300px, 86%);
  box-shadow: 0 0 40px rgba(255, 201, 77, .25); }
.win h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; color: var(--lit); letter-spacing: .12em; }
.win p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.win .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

aside.drawer { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .14em; }
.tray { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 840px) { .tray { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 460px) { .tray { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.slot { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 9px; background: var(--btn);
  border: 1px solid var(--rule); color: var(--ink); font: inherit; cursor: grab; touch-action: none; text-align: left; min-width: 0; }
.slot:hover { background: var(--btn-hi); }
.slot.armed { border-color: var(--laser); box-shadow: 0 0 0 1px var(--laser) inset; }
.slot:disabled { opacity: .38; cursor: not-allowed; }
.slot canvas { width: 38px; height: 38px; flex: none; }
.slot .nm { font-size: 14px; font-weight: 500; line-height: 1.25; min-width: 0; }
.slot .ct { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--btn); border: 1px solid var(--rule);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--btn-hi); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--lit); color: var(--room); border-color: var(--lit); font-weight: 700; }
.btn:focus-visible, .slot:focus-visible, .lv:focus-visible { outline: 2px solid var(--glass); outline-offset: 2px; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.readout { font-family: var(--f-mono); font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.6em; }
.readout b { color: var(--ink); font-weight: 600; }
.desc { font-size: 14px; color: var(--ink); background: rgba(143, 211, 255, .06); border-left: 2px solid var(--glass);
  padding: 8px 10px; border-radius: 0 6px 6px 0; }
.desc small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.hint { font-size: 14px; color: var(--ink); margin-top: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; user-select: none; }
.toggle input { width: 16px; height: 16px; accent-color: var(--glass); }
.levels { display: flex; flex-direction: column; gap: 10px; }
.grp { display: flex; flex-direction: column; gap: 5px; padding: 8px; border-radius: 9px; border: 1px solid transparent; }
.grp.cur { border-color: var(--rule); background: rgba(255,255,255,.02); }
.grp-h { display: flex; align-items: baseline; gap: 8px; }
.grp-n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.grp-t { font-size: 14px; font-weight: 700; flex: 1; min-width: 0; }
.grp-p { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.grp-p.full { color: var(--lit); font-weight: 600; }
.grp.final .grp-t { color: var(--laser); }
.grp .tag { font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--room); background: var(--lit); border-radius: 4px; padding: 0 5px; margin-left: 4px; vertical-align: 1px; }
.bar-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.batt { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.batt b { color: var(--ink); font-weight: 600; min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
.batt #battSec { font-variant-numeric: tabular-nums; }
.batt-cell { position: relative; width: 34px; height: 16px; border: 2px solid var(--muted); border-radius: 4px; padding: 1px; }
.batt-cell::after { content: ""; position: absolute; right: -6px; top: 3px; width: 3px; height: 6px; background: var(--muted); border-radius: 0 2px 2px 0; }
.batt-cell i { display: block; height: 100%; border-radius: 1px; background: var(--ok); transition: width .1s linear; }
.batt-cell i.warn { background: var(--lit); }
.batt-cell i.low { background: var(--laser); }
.batt.low b { color: var(--laser); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.gate { position: absolute; inset: 0; background: #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; z-index: 5; }
.gate.fail { animation: blackout .9s ease-out; }
@keyframes blackout { 0% { background: rgba(0,0,0,0); } 30% { background: rgba(0,0,0,.6); } 45% { background: rgba(0,0,0,.2); } 100% { background: #000; } }
.gate-in { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.gate-ico { width: 56px; height: 28px; color: var(--ok); }
.gate.fail .gate-ico { color: var(--laser); }
.gate.fail .gate-charge { display: none; }
.gate h2 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: .1em; color: var(--ink); }
.gate.fail h2 { color: var(--laser); }
.gate p { margin: 0; color: var(--muted); font-size: 14px; }
.grp-b { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.lv { font-family: var(--f-mono); font-size: 13px; padding: 6px 0; border-radius: 7px; background: var(--btn);
  border: 1px solid var(--rule); color: var(--ink); cursor: pointer; position: relative; }
.lv:hover { background: var(--btn-hi); }
.lv.cur { border-color: var(--ink); }
.lv.done::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--lit); }
.keys { font-size: 12px; color: var(--muted); line-height: 1.7; }
.keys kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; color: var(--ink); }
#ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; opacity: .85; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>光路<span>迷宮</span></h1>
    <p>把雷射光導進偵測器。從元件盒拖曳或點選放上光學桌，點一下元件就旋轉（鏡子每次 45°，玻璃磚每次 15°）。</p>
    <span class="spec">n<sub>玻璃</sub> = <b>1.50</b>　θ<sub>c</sub> = <b>41.8°</b>　λ = <b>650 nm</b></span>
  </header>

  <div class="main">
    <section class="bench" aria-label="光學桌">
      <div class="bench-bar">
        <div class="lvl-title"><span class="lvl-no" id="lvlNo">第 1 組</span><span class="lvl-name" id="lvlName"></span></div>
        <div class="bar-r">
          <span class="batt" id="batt" hidden aria-live="polite"><span class="batt-cell"><i id="battFill"></i></span><b id="battPct">100%</b><span id="battSec">60 秒</span></span>
          <span class="status" id="status">偵測器 0/1</span>
        </div>
      </div>
      <div class="board-box" id="boardBox">
        <canvas id="board" tabindex="0" aria-label="遊戲格盤"></canvas>
        <div class="gate" id="gate" hidden>
          <div class="gate-in">
            <svg class="gate-ico" viewBox="0 0 48 24" aria-hidden="true"><rect x="1" y="3" width="40" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="42" y="8" width="4" height="8" rx="1" fill="currentColor"/><rect class="gate-charge" x="4" y="6" width="34" height="12" rx="1.5" fill="currentColor"/></svg>
            <h2 id="gateTitle">限時關卡</h2>
            <p id="gateMsg"></p>
            <button class="btn primary" id="gateBtn" type="button">開始</button>
          </div>
        </div>
        <div class="win" id="win" hidden>
          <h2 id="winTitle">通關</h2>
          <p id="winMsg"></p>
          <div class="row">
            <button class="btn" id="winStay" type="button">再調整一下</button>
            <button class="btn primary" id="winNext" type="button">下一關 →</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="drawer">
      <div class="sec">
        <h3>元件盒</h3>
        <div class="tray" id="tray"></div>
      </div>

      <div class="sec">
        <h3>選取的元件</h3>
        <div class="tools">
          <button class="btn" id="rotL" type="button" disabled>↺ 逆轉</button>
          <button class="btn" id="rotR" type="button" disabled>↻ 順轉</button>
          <button class="btn" id="takeBack" type="button" disabled>收回</button>
        </div>
        <div class="readout" id="readout">尚未選取</div>
      </div>

      <div class="sec">
        <div class="desc" id="desc"></div>
      </div>

      <div class="sec">
        <h3>實驗設定</h3>
        <div class="tools" style="flex-direction:column; align-items:flex-start; gap:10px">
          <label class="toggle"><input type="checkbox" id="normals"> 顯示法線與入射角</label>
          <div class="tools">
            <button class="btn" id="hintBtn" type="button">看提示</button>
            <button class="btn" id="resetBtn" type="button">清空桌面</button>
            <button class="btn" id="solBtn" type="button">參考解答</button>
          </div>
        </div>
        <div class="hint" id="hint" hidden></div>
      </div>

      <div class="sec">
        <h3>關卡（每組五關）</h3>
        <div class="levels" id="levels"></div>
      </div>

      <div class="sec keys">
        拖曳元件可移動，拖出桌面即收回。<br>
        鍵盤：<kbd>R</kbd> 順轉　<kbd>Shift</kbd>+<kbd>R</kbd> 逆轉　<kbd>Del</kbd> 收回　<kbd>Esc</kbd> 取消選取
      </div>
    </aside>
  </div>
</div>
<canvas id="ghost" hidden></canvas>
<script>
// ===== 光學引擎：連續 2D 光線追跡（格子座標，1 格 = 1 單位；rot 以「度」為單位，順時針） =====
const OPT = (() => {
  const N_GLASS = 1.5;
  const SZ = { mirrorHalf: 0.42, prismA: 0.36, semiR: 0.42, square: 0.68, rectL: 0.84, rectW: 0.40,
    laserHalf: 0.32, targetR: 0.3, smallR: 0.07, checkR: 0.25 };
  const EPS = 1e-6;
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // 右 下 左 上（螢幕座標，y 向下）

  function rot(x, y, a) { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }

  function polySurfaces(pts, cx, cy, th, pid) {
    const v = pts.map(([x, y]) => { const [rx, ry] = rot(x, y, th); return [cx + rx, cy + ry]; });
    let gx = 0, gy = 0; v.forEach(p => { gx += p[0]; gy += p[1]; }); gx /= v.length; gy /= v.length;
    return v.map((a, i) => {
      const b = v[(i + 1) % v.length];
      let nx = -(b[1] - a[1]), ny = b[0] - a[0];
      const L = Math.hypot(nx, ny); nx /= L; ny /= L;
      if (nx * ((a[0] + b[0]) / 2 - gx) + ny * ((a[1] + b[1]) / 2 - gy) < 0) { nx = -nx; ny = -ny; }
      return { k: 'seg', ax: a[0], ay: a[1], bx: b[0], by: b[1], nx, ny, mat: 'glass', pid };
    });
  }

  function pieceSurfaces(p) {
    const cx = p.c + 0.5, cy = p.r + 0.5, th = p.rot * Math.PI / 180, pid = p.id;
    if (p.type === 'mirror' || p.type === 'splitter') {
      const H = SZ.mirrorHalf, dx = Math.cos(th) * H, dy = Math.sin(th) * H;
      return [{ k: 'seg', ax: cx - dx, ay: cy - dy, bx: cx + dx, by: cy + dy,
        nx: -Math.sin(th), ny: Math.cos(th), mat: p.type === 'mirror' ? 'mirror' : 'split', pid }];
    }
    if (p.type === 'prism') { const A = SZ.prismA; return polySurfaces([[A, A], [-A, A], [A, -A]], cx, cy, th, pid); }
    if (p.type === 'square') { const h = SZ.square / 2; return polySurfaces([[-h, -h], [h, -h], [h, h], [-h, h]], cx, cy, th, pid); }
    if (p.type === 'rect') { const a = SZ.rectL / 2, b = SZ.rectW / 2; return polySurfaces([[-a, -b], [a, -b], [a, b], [-a, b]], cx, cy, th, pid); }
    if (p.type === 'semi') {
      const R = SZ.semiR, ux = Math.cos(th), uy = Math.sin(th), vx = -uy, vy = ux;
      return [
        { k: 'seg', ax: cx - R * vx, ay: cy - R * vy, bx: cx + R * vx, by: cy + R * vy, nx: -ux, ny: -uy, mat: 'glass', pid },
        { k: 'arc', cx, cy, R, ux, uy, mat: 'glass', pid }
      ];
    }
    return [];
  }

  function boxSurfaces(cx, cy, h, mat) {
    const x0 = cx - h, x1 = cx + h, y0 = cy - h, y1 = cy + h;
    return [[x0, y0, x1, y0], [x1, y0, x1, y1], [x1, y1, x0, y1], [x0, y1, x0, y0]]
      .map(([ax, ay, bx, by]) => ({ k: 'seg', ax, ay, bx, by, nx: 0, ny: 0, mat }));
  }

  const targetPos = t => ({ x: t.c + 0.5 + (t.dx || 0), y: t.r + 0.5 + (t.dy || 0), R: t.small ? SZ.smallR : SZ.targetR });

  function buildScene(level, pieces) {
    const S = [];
    for (const [c, r] of level.walls || []) S.push(...boxSurfaces(c + 0.5, r + 0.5, 0.5, 'block'));
    const L = level.laser;
    S.push(...boxSurfaces(L.c + 0.5, L.r + 0.5, SZ.laserHalf, 'block'));
    level.targets.forEach((t, i) => { const q = targetPos(t); S.push({ k: 'circle', cx: q.x, cy: q.y, R: q.R, mat: 'target', id: i }); });
    for (const p of pieces) S.push(...pieceSurfaces(p));
    return S;
  }

  function hit(s, px, py, dx, dy) {
    if (s.k === 'seg') {
      const ex = s.bx - s.ax, ey = s.by - s.ay;
      const den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-12) return null;
      const wx = s.ax - px, wy = s.ay - py;
      const t = (wx * ey - wy * ex) / den;
      const u = (wx * dy - wy * dx) / den;
      if (t <= EPS || u < -1e-9 || u > 1 + 1e-9) return null;
      return { t, nx: s.nx, ny: s.ny, edge: u < 1e-6 || u > 1 - 1e-6 };
    }
    const fx = px - s.cx, fy = py - s.cy;
    const b = fx * dx + fy * dy, c = fx * fx + fy * fy - s.R * s.R;
    const disc = b * b - c;
    if (disc < 0) return null;
    const sq = Math.sqrt(disc);
    for (const t of [-b - sq, -b + sq]) {
      if (t <= EPS) continue;
      const qx = px + t * dx - s.cx, qy = py + t * dy - s.cy;
      if (s.k === 'arc' && qx * s.ux + qy * s.uy <= 1e-7) continue;
      return { t, nx: qx / s.R, ny: qy / s.R, edge: false };
    }
    return null;
  }

  function boundaryT(level, px, py, dx, dy) {
    let t = Infinity;
    if (dx > 1e-12) t = Math.min(t, (level.cols - px) / dx);
    if (dx < -1e-12) t = Math.min(t, -px / dx);
    if (dy > 1e-12) t = Math.min(t, (level.rows - py) / dy);
    if (dy < -1e-12) t = Math.min(t, -py / dy);
    return t;
  }

  const deg = r => r * 180 / Math.PI;

  function trace(level, pieces) {
    const S = buildScene(level, pieces);
    const L = level.laser, [ldx, ldy] = DIRS[L.dir];
    const segs = [], events = [], lit = new Set();
    const stack = [{ x: L.c + 0.5 + ldx * (SZ.laserHalf + 0.01), y: L.r + 0.5 + ldy * (SZ.laserHalf + 0.01), dx: ldx, dy: ldy, a: 1, entry: null }];
    let budget = 700;
    while (stack.length && budget > 0) {
      let ray = stack.pop();
      for (let bounce = 0; bounce < 90 && budget > 0; bounce++, budget--) {
        let best = null, bs = null;
        for (const s of S) {
          const h = hit(s, ray.x, ray.y, ray.dx, ray.dy);
          if (h && (!best || h.t < best.t)) { best = h; bs = s; }
        }
        const tb = boundaryT(level, ray.x, ray.y, ray.dx, ray.dy);
        const inG = !!ray.entry;
        if (!best || tb < best.t) {
          segs.push({ x1: ray.x, y1: ray.y, x2: ray.x + ray.dx * tb, y2: ray.y + ray.dy * tb, a: ray.a, inG });
          break;
        }
        const qx = ray.x + ray.dx * best.t, qy = ray.y + ray.dy * best.t;
        segs.push({ x1: ray.x, y1: ray.y, x2: qx, y2: qy, a: ray.a, inG });
        if (bs.mat === 'block') break;
        if (bs.mat === 'target') { lit.add(bs.id); break; }
        let nx = best.nx, ny = best.ny;
        if (bs.mat === 'mirror' || bs.mat === 'split') {
          const dn = ray.dx * nx + ray.dy * ny;
          const rx = ray.dx - 2 * dn * nx, ry = ray.dy - 2 * dn * ny;
          const ai = deg(Math.acos(Math.min(1, Math.abs(dn))));
          events.push({ x: qx, y: qy, nx, ny, type: bs.mat === 'mirror' ? 'reflect' : 'split', ai, ao: ai });
          if (bs.mat === 'split') {
            if (ray.a / 2 >= 1 / 64) stack.push({ ...ray, x: qx, y: qy, a: ray.a / 2 });
            ray = { ...ray, x: qx, y: qy, dx: rx, dy: ry, a: ray.a / 2 };
            if (ray.a < 1 / 64) break;
          } else ray = { ...ray, x: qx, y: qy, dx: rx, dy: ry };
          continue;
        }
        // 玻璃介面
        if (best.edge) { events.push({ x: qx, y: qy, nx, ny, type: 'corner', ai: 0, ao: 0 }); break; }
        let n1 = 1, n2 = N_GLASS, entering = true;
        if (ray.dx * nx + ray.dy * ny > 0) { nx = -nx; ny = -ny; n1 = N_GLASS; n2 = 1; entering = false; }
        const cosi = -(ray.dx * nx + ray.dy * ny), eta = n1 / n2;
        const k = 1 - eta * eta * (1 - cosi * cosi);
        const ai = deg(Math.acos(Math.min(1, cosi)));
        if (k < 0) {
          const rx = ray.dx + 2 * cosi * nx, ry = ray.dy + 2 * cosi * ny;
          events.push({ x: qx, y: qy, nx, ny, type: 'tir', ai, ao: ai });
          ray = { ...ray, x: qx, y: qy, dx: rx, dy: ry };

          } else {
            const en = ray.entry;

  }

  return { trace, pieceSurfaces, targetPos, SZ, N_GLASS, DIRS };

      g.rotate(th); glassStyle(g, s);
      g.beginPath(); g.rect(-w / 2, -h / 2, w, h); g.fill(); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(-w / 2 + s * .06, -h / 2 + s * .06); g.lineTo(w / 2 - s * .18, -h / 2 + s * .06); g.stroke();
    } else if (p.type === 'semi') {
      const R = SZ.semiR * s;
      glassStyle(g, s); g.beginPath(); g.arc(0, 0, R, th - Math.PI / 2, th + Math.PI / 2); g.closePath(); g.fill(); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, R * .72, th - .9, th + .2); g.stroke();
      g.fillStyle = 'rgba(190,232,255,0.9)'; g.beginPath(); g.arc(0, 0, Math.max(1.2, s * .025), 0, 7); g.fill();
    }
    g.restore();
  }
  function drawLaser(g) {
    const lv = L().laser, x = (lv.c + .5) * cs, y = (lv.r + .5) * cs;
    g.save(); g.translate(x, y); g.rotate(lv.dir * Math.PI / 2);
    g.fillStyle = '#2a313c'; g.strokeStyle = '#475263'; g.lineWidth = 1;
    rr(g, -cs * .4, -cs * .22, cs * .7, cs * .44, cs * .06); g.fill(); g.stroke();
    g.fillStyle = C.laser; g.fillRect(-cs * .3, -cs * .22, cs * .06, cs * .44);
    g.fillStyle = '#11151b'; g.fillRect(cs * .3, -cs * .1, cs * .05, cs * .2);
    g.fillStyle = C.laser; g.beginPath(); g.arc(cs * .33, 0, cs * .04, 0, 7); g.fill();
    g.restore();
    g.fillStyle = C.muted; g.font = `600 ${Math.max(8, cs * .17)}px ${css('--f-mono')}`; g.textAlign = 'center';
  }
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function drawTargets(g, t) {
    L().targets.forEach((tg, i) => {
      const q = OPT.targetPos(tg), x = q.x * cs, y = q.y * cs, on = result && result.lit.has(i);
      const R = q.R * cs;
      if (tg.small) {
        // 精密偵測器：底座在格子中心，感光孔偏離中心
        const cx = (tg.c + .5) * cs, cy = (tg.r + .5) * cs;
        g.fillStyle = '#2a313c'; g.strokeStyle = '#596579'; g.lineWidth = 1;
        rr(g, cx - cs * .4, cy - cs * .4, cs * .8, cs * .8, cs * .1); g.fill(); g.stroke();
        g.setLineDash([2, 3]); g.strokeStyle = 'rgba(226,232,240,0.35)';
        g.beginPath(); g.moveTo(cx - cs * .4, cy); g.lineTo(cx + cs * .4, cy); g.moveTo(cx, cy - cs * .4); g.lineTo(cx, cy + cs * .4); g.stroke(); g.setLineDash([]);
        if (on) {
          const pulse = reduced ? 1 : .85 + .15 * Math.sin(t / 260);
          const gl = g.createRadialGradient(x, y, 0, x, y, cs * .6); gl.addColorStop(0, `rgba(255,201,77,${.6 * pulse})`); gl.addColorStop(1, 'rgba(255,201,77,0)');
          g.fillStyle = gl; g.beginPath(); g.arc(x, y, cs * .6, 0, 7); g.fill();
          g.fillStyle = C.lit; g.beginPath(); g.arc(x, y, Math.max(2.5, R), 0, 7); g.fill();
        } else {
          g.fillStyle = '#05080c'; g.beginPath(); g.arc(x, y, Math.max(2.5, R), 0, 7); g.fill();
          g.strokeStyle = 'rgba(255,201,77,0.8)'; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, Math.max(2.5, R) + 2, 0, 7); g.stroke();
        }
        g.fillStyle = C.muted; g.font = `600 ${Math.max(8, cs * .14)}px ${css('--f-mono')}`; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
        g.fillText('精密', cx, cy + cs * .36);
        return;
      }
      g.fillStyle = '#2a313c'; g.beginPath(); g.arc(x, y, R + cs * .07, 0, 7); g.fill();
      g.strokeStyle = '#596579'; g.lineWidth = 1; g.stroke();
      if (on) {
        const pulse = reduced ? 1 : .85 + .15 * Math.sin(t / 260);
        const gl = g.createRadialGradient(x, y, 0, x, y, cs * .9); gl.addColorStop(0, `rgba(255,201,77,${.55 * pulse})`); gl.addColorStop(1, 'rgba(255,201,77,0)');
        g.fillStyle = gl; g.beginPath(); g.arc(x, y, cs * .9, 0, 7); g.fill();
        g.fillStyle = C.lit; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
        g.fillStyle = '#fff8e0'; g.beginPath(); g.arc(x, y, R * .45, 0, 7); g.fill();
      } else {
        g.fillStyle = '#121820'; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
        g.strokeStyle = 'rgba(255,201,77,0.45)'; g.lineWidth = 1.2;
        g.beginPath(); g.arc(x, y, R * .6, 0, 7); g.stroke();
        g.beginPath(); g.moveTo(x - R * .9, y); g.lineTo(x + R * .9, y); g.moveTo(x, y - R * .9); g.lineTo(x, y + R * .9); g.stroke();
      }
    });
  }
  function drawChecks(g) {
    (L().checks || []).forEach((k, i) => {
      const x = (k.c + .5) * cs, y = (k.r + .5) * cs, on = result && result.passed.has(i), R = cs * .44;
      g.save();
      if (on) {
        g.strokeStyle = C.lit; g.lineWidth = 2; g.shadowColor = 'rgba(255,201,77,.6)'; g.shadowBlur = 8;
        g.beginPath(); g.arc(x, y, R, 0, 7); g.stroke();
      } else {
        g.strokeStyle = 'rgba(226,232,240,0.7)'; g.lineWidth = 1.5; g.setLineDash([4, 4]);
        g.beginPath(); g.arc(x, y, R, 0, 7); g.stroke(); g.setLineDash([]);
      }
      g.shadowBlur = 0; g.fillStyle = on ? C.lit : 'rgba(226,232,240,0.75)';
      for (let q = 0; q < 4; q++) { // 四個方向的小三角，指向中心
        const a = q * Math.PI / 2, px = x + Math.cos(a) * R, py = y + Math.sin(a) * R;
        g.beginPath(); g.moveTo(px - Math.cos(a) * cs * .09, py - Math.sin(a) * cs * .09);
        g.lineTo(px - Math.sin(a) * cs * .05, py + Math.cos(a) * cs * .05); g.lineTo(px + Math.sin(a) * cs * .05, py - Math.cos(a) * cs * .05); g.closePath(); g.fill();
      }
      g.restore();
    });
  }
  function drawRays(g, t) {
    if (!result) return;
    let pw = power();
    if (pw <= 0) return;
    if (st.tm && st.tm.state === 'running') {
      pw = .2 + .8 * pw;
      if (pw < .36 && Math.random() < .25) pw *= .35 + .4 * Math.random(); // 快沒電時閃爍
    }
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (const s of result.segs) {
      const a = (.35 + .65 * s.a) * pw;
      g.strokeStyle = `rgba(255,40,60,${.16 * a})`; g.lineWidth = cs * .2;
      g.beginPath(); g.moveTo(s.x1 * cs, s.y1 * cs); g.lineTo(s.x2 * cs, s.y2 * cs); g.stroke();
      g.strokeStyle = `rgba(255,70,85,${.9 * a})`; g.lineWidth = Math.max(1.6, cs * .045);
      g.stroke();
      g.strokeStyle = `rgba(255,220,225,${.7 * a})`; g.lineWidth = Math.max(.8, cs * .015);
      g.stroke();
    }
    if (!reduced) {
      // 流動的亮點，顯示光的行進方向
      g.setLineDash([cs * .12, cs * .5]); g.lineDashOffset = -(t / 16) % (cs * .62);
      g.strokeStyle = `rgba(255,240,240,${.55 * pw})`; g.lineWidth = Math.max(1.4, cs * .04);
      for (const s of result.segs) {
        g.beginPath(); g.moveTo(s.x1 * cs, s.y1 * cs); g.lineTo(s.x2 * cs, s.y2 * cs); g.stroke();
      }
    }
    g.restore();
  }
  function drawNormals(g) {
    if (!st.normals || !result) return;
    g.save(); g.font = `500 ${Math.max(9, cs * .2)}px ${css('--f-mono')}`; g.textBaseline = 'middle';
    const placed = [];
    for (const e of result.events) {
      const x = e.x * cs, y = e.y * cs, L2 = cs * .42;
      g.setLineDash([3, 3]); g.strokeStyle = 'rgba(220,232,245,0.8)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x - e.nx * L2, y - e.ny * L2); g.lineTo(x + e.nx * L2, y + e.ny * L2); g.stroke(); g.setLineDash([]);
      let txt;
      if (e.type === 'refract') {
        txt = e.ai > 0.5 ? `${e.ai.toFixed(1)}°→${e.ao.toFixed(1)}°` : '';
        if (e.shift) txt = `側移 ${e.shift.toFixed(2)} 格`;
        else if (e.dev && e.ai <= 0.5) txt = `偏折 ${e.dev.toFixed(1)}°`;
        if (!txt) continue;
      } else if (e.type === 'tir') txt = `全反射 ${e.ai.toFixed(0)}°`;
      else if (e.type === 'corner') txt = '邊角散射';
      else txt = `${e.ai.toFixed(0)}°`;
      const w = g.measureText(txt).width + 8, h = Math.max(14, cs * .3);
      // 標籤沿法線或其垂直方向擺放，挑一個不跟其他標籤重疊的位置
      const BW = board.width / dpr, BH = board.height / dpr;
      const cand = [[-e.nx, -e.ny], [e.nx, e.ny], [-e.ny, e.nx], [e.ny, -e.nx]];
      let lx, ly, found = false;
      for (const k of [1.15, 1.9, 2.7]) {
        for (const [ux, uy] of cand) {
          let cx = x + ux * L2 * k, cy = y + uy * L2 * k;
          cx = Math.min(Math.max(cx, w / 2 + 2), BW - w / 2 - 2); cy = Math.min(Math.max(cy, h / 2 + 2), BH - h / 2 - 2);
          if (!placed.some(p => Math.abs(p.x - cx) < (p.w + w) / 2 + 2 && Math.abs(p.y - cy) < (p.h + h) / 2 + 1)) { lx = cx; ly = cy; found = true; break; }
        }
        if (found) break;
      }
      if (!found) { lx = Math.min(Math.max(x - e.nx * L2 * 1.15, w / 2 + 2), BW - w / 2 - 2); ly = Math.min(Math.max(y - e.ny * L2 * 1.15, h / 2 + 2), BH - h / 2 - 2); }
      placed.push({ x: lx, y: ly, w, h });
      g.fillStyle = 'rgba(10,14,20,0.85)'; rr(g, lx - w / 2, ly - h / 2, w, h, 4); g.fill();
      g.fillStyle = e.type === 'tir' ? C.lit : (e.type === 'refract' ? C.glass : (e.type === 'corner' ? C.laser : C.ink));
      g.textAlign = 'center'; g.fillText(txt, lx, ly + .5);
    }
    g.restore();
  }

  let rafPending = false;
  function requestDraw() { if (reduced && !rafPending) { rafPending = true; requestAnimationFrame(t => { rafPending = false; draw(t); }); } }
  function loop(t) { draw(t); requestAnimationFrame(loop); }

  function draw(t) {
    if (!bg) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, board.width, board.height); ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawLaser(ctx);
    // 放置預覽
    const lv = L();
    const showCell = (c, r, ok) => {
      ctx.strokeStyle = ok ? 'rgba(143,211,255,0.75)' : 'rgba(255,51,71,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.strokeRect(c * cs + 3, r * cs + 3, cs - 6, cs - 6); ctx.setLineDash([]);
    };
    if (drag && drag.moved && drag.cell) showCell(drag.cell.c, drag.cell.r, placeable(drag.cell.c, drag.cell.r, drag.id));
    if (!drag && st.armed && hover && placeable(hover.c, hover.r)) {
      showCell(hover.c, hover.r, true);
      drawPiece(ctx, { type: st.armed, rot: TYPES[st.armed].def }, (hover.c + .5) * cs, (hover.r + .5) * cs, cs, { alpha: .4 });
    }
    drawChecks(ctx);
    for (const p of st.pieces) {
      if (drag && drag.moved && drag.id === p.id) continue;
      drawPiece(ctx, p, (p.c + .5) * cs, (p.r + .5) * cs, cs, {});
    }
    drawTargets(ctx, t || 0);
    drawRays(ctx, t || 0);
    const sel = st.pieces.find(p => p.id === st.sel);
    if (sel && !(drag && drag.moved)) {
      const x = (sel.c + .5) * cs, y = (sel.r + .5) * cs;
      ctx.strokeStyle = 'rgba(226,232,240,0.9)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(x, y, cs * .48, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      // 旋轉方向小箭頭
      const a = -Math.PI / 4, R = cs * .48;
      ctx.fillStyle = 'rgba(226,232,240,0.9)'; ctx.beginPath();
      const ax = x + Math.cos(a) * R, ay = y + Math.sin(a) * R;
      ctx.moveTo(ax + cs * .07, ay); ctx.lineTo(ax - cs * .04, ay - cs * .07); ctx.lineTo(ax - cs * .04, ay + cs * .07); ctx.closePath();
      ctx.save(); ctx.translate(ax, ay); ctx.restore(); ctx.fill();
    }
    drawNormals(ctx);
  }

  // ---------- pointer ----------
  function cellFrom(e) {
    const r = board.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * L().cols, y = (e.clientY - r.top) / r.height * L().rows;
    return { c: Math.floor(x), r: Math.floor(y), inside: x >= 0 && y >= 0 && x < L().cols && y < L().rows };
  }
  function showGhost(e, p) {
    const s = cs; ghost.width = s * dpr; ghost.height = s * dpr; ghost.style.width = s + 'px'; ghost.style.height = s + 'px';
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0); gctx.clearRect(0, 0, s, s); drawPiece(gctx, p, s / 2, s / 2, s, {});
    ghost.style.transform = `translate(${e.clientX - s / 2}px, ${e.clientY - s / 2}px)`; ghost.hidden = false;
  }

  board.addEventListener('pointerdown', e => {
    if (locked()) return;
    board.focus({ preventScroll: true });
    const { c, r, inside } = cellFrom(e); if (!inside) return;
    const p = pieceAt(c, r);
    if (p && !p.fixed) {
      drag = { mode: 'piece', id: p.id, type: p.type, rot: p.rot, x0: e.clientX, y0: e.clientY, moved: false, cell: null };
      board.setPointerCapture(e.pointerId); return;
    }
    if (p && p.fixed) { st.sel = null; st.armed = null; buildTray(); updatePanel();
      $('#desc').innerHTML = `<b>${TYPES[p.type].name}（鎖定）</b>　這個元件固定在桌上，不能移動或旋轉。<small>${TYPES[p.type].desc}</small>`; requestDraw(); return; }
    if (st.armed && placeable(c, r)) { place(st.armed, c, r); return; }
    st.sel = null; updatePanel(); requestDraw();
  });
  board.addEventListener('pointermove', e => {
    if (drag && drag.mode === 'piece') { handleDragMove(e); return; }
    if (e.pointerType === 'mouse') {
      const { c, r, inside } = cellFrom(e); hover = inside ? { c, r } : null;
      const p = inside && pieceAt(c, r);
      board.style.cursor = p && !p.fixed ? 'grab' : (st.armed && inside && placeable(c, r) ? 'copy' : 'default');
      requestDraw();
    }
  });
  board.addEventListener('pointerleave', () => { if (!drag) { hover = null; requestDraw(); } });
  board.addEventListener('pointerup', e => { if (drag && drag.mode === 'piece') endDrag(e); });
  board.addEventListener('pointercancel', () => cancelDrag());

  function handleDragMove(e) {
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) drag.moved = true;
    if (!drag.moved) return;
    const { c, r, inside } = cellFrom(e); drag.cell = inside ? { c, r } : null;
    showGhost(e, { type: drag.type, rot: drag.rot }); requestDraw();
  }
  function endDrag(e) {
    const d = drag; drag = null; ghost.hidden = true;
    const { c, r, inside } = cellFrom(e);
    if (d.mode === 'piece') {
      if (!d.moved) { st.sel = d.id; rotate(d.id, 1); return; }
      if (inside) { if (placeable(c, r, d.id)) { st.sel = d.id; move(d.id, c, r); } else requestDraw(); }
      else takeBack(d.id);
    } else {
      if (!d.moved) { toggleArm(d.type); return; }
      if (inside && placeable(c, r)) place(d.type, c, r); else requestDraw();
    }
  }
  function cancelDrag() { drag = null; ghost.hidden = true; requestDraw(); }

  function trayDown(e, t, btn) {
    if (btn.disabled || locked()) return;
    drag = { mode: 'new', type: t, rot: TYPES[t].def, x0: e.clientX, y0: e.clientY, moved: false, cell: null, id: null };
    btn.setPointerCapture(e.pointerId);
    const mv = ev => handleDragMove(ev);
    const up = ev => { btn.removeEventListener('pointermove', mv); btn.removeEventListener('pointerup', up); btn.removeEventListener('pointercancel', cn); endDrag(ev); };
    const cn = () => { btn.removeEventListener('pointermove', mv); btn.removeEventListener('pointerup', up); btn.removeEventListener('pointercancel', cn); cancelDrag(); };
    btn.addEventListener('pointermove', mv); btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', cn);
  }

  // ---------- controls ----------
  $('#rotL').onclick = () => rotate(st.sel, -1);
  $('#rotR').onclick = () => rotate(st.sel, 1);
  $('#takeBack').onclick = () => { if (!locked()) takeBack(st.sel); };
  $('#gateBtn').onclick = () => startRun();
  $('#normals').onchange = e => { st.normals = e.target.checked; save(); requestDraw(); };
  $('#hintBtn').onclick = () => { const h = $('#hint'); h.hidden = !h.hidden; $('#hintBtn').textContent = h.hidden ? '看提示' : '收起提示'; };
  $('#resetBtn').onclick = () => loadLevel(st.li);
  let solArm = 0;
  $('#solBtn').onclick = () => {
    if (Date.now() - solArm > 2500) { solArm = Date.now(); $('#solBtn').textContent = '再按一次放上解答'; setTimeout(() => $('#solBtn').textContent = '參考解答', 2500); return; }
    solArm = 0; $('#solBtn').textContent = '參考解答'; loadLevel(st.li, L().sol);
  };
  $('#winNext').onclick = () => loadLevel((st.li + 1) % LEVELS.length);
  $('#winStay').onclick = () => { $('#win').hidden = true; };
  board.addEventListener('keydown', e => {
    if (e.key === 'Escape') { st.sel = null; st.armed = null; buildTray(); updatePanel(); requestDraw(); return; }
    if (!st.sel || locked()) return;
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); rotate(st.sel, e.shiftKey ? -1 : 1); }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); takeBack(st.sel); }
  });
  window.addEventListener('resize', () => resize());
  if ('ResizeObserver' in window) new ResizeObserver(() => resize()).observe($('#boardBox'));

  // ---------- boot ----------
  function start(data) {
    load();
    if (data && Number.isInteger(data.li) && LEVELS[data.li]) { st.li = data.li; }
    loadLevel(st.li, data && Array.isArray(data.pieces) ? data.pieces : null);
    if (!reduced) requestAnimationFrame(loop);
  }
  start({});
})();
</script>
</body>
</html>
